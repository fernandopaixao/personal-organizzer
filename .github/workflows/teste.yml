# Roda só no repositório pessoal. Na empresa a solução chega como .zip (tools/empacotar.py), sem CI.
name: Teste e pacote

on:
  pull_request:
  push:
    branches: [main]

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Blocos injetados e cópias embutidas em dia
        run: |
          python3 tools/injetar_seguranca.py
          if ! git diff --quiet; then
            echo "::error::Os HTMLs montados não batem com financas/src/. Rode python3 tools/injetar_seguranca.py e faça commit."
            git diff --stat
            exit 1
          fi

      - name: Documentação atualizada no mesmo PR (ADR-0022)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          mudou=$(git diff --name-only "$BASE"...HEAD)
          codigo=$(echo "$mudou" | grep -E '\.html$|^financas/src/|^ferramenta-time/.*\.html$|^tools/' || true)
          docs=$(echo "$mudou" | grep -E '^docs/|^README\.md$|^ferramenta-time/.*\.md$|^contratos/' || true)
          if [ -n "$codigo" ] && [ -z "$docs" ]; then
            case "$TITULO" in *"[sem-docs]"*) echo "PR marcado [sem-docs]: sem conferência."; exit 0;; esac
            echo "::error::O PR muda ferramentas sem atualizar a documentação (docs/, README.md). Veja docs/adr/0022-documentacao-no-mesmo-pr.md. Para correção sem efeito para quem usa, ponha [sem-docs] no título."
            echo "$codigo"
            exit 1
          fi

      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Teste de ponta a ponta
        run: node financas/testes/teste-e2e.js

      - name: Teste do Quadro do Time (hierarquia e exportação)
        run: node financas/testes/teste-quadro.js

      - name: Teste do Mapa de Férias
        run: node financas/testes/teste-ferias.js

      - name: Teste do aviso sem acesso a pastas
        run: node financas/testes/teste-navegador.js

      - name: Teste dos contratos de integração
        run: node contratos/testes/teste-contratos.js

      - name: Versão experimental (visual novo) montada do main e testada
        run: python3 tools/build_experimental.py --testar

      - name: Montar o pacote .zip
        run: python3 tools/empacotar.py

      - uses: actions/upload-artifact@v4
        with:
          name: gestao-solucao
          path: dist/*.zip
          retention-days: 30

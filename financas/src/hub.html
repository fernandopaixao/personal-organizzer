<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hub da solução</title>
<style>
/*NUCLEO-CSS*/
.hub{max-width:1180px;margin:0 auto;padding:0 clamp(16px,2.6vw,40px) 80px}
.hub .top .logo{margin:0}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:22px}
.tool{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:inherit;min-width:0}
.tool:hover{border-color:var(--bv-mid);box-shadow:0 2px 10px rgba(34,58,210,.08)}
.tool .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:11px;flex:none;background:var(--bv-soft);color:var(--bv)}
.tool .ic.fin{background:var(--ok-soft);color:var(--ok)}.tool .ic.aux{background:#edf1f9;color:var(--muted)}
.tool b{display:block;font-size:13.5px}.tool .code{color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.tool .go{margin-left:auto;color:var(--bv);font-size:12px;font-weight:600;white-space:nowrap}
.team{padding:16px 18px}
.team .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.team .hd h3{font-family:var(--title);font-size:16px;font-weight:600}
.act{font-size:12px;color:var(--muted);margin:0 0 12px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.pi{position:relative;border-radius:4px 4px 14px 4px;padding:12px 12px 10px;min-height:120px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 2px rgba(11,33,85,.08),0 6px 14px rgba(11,33,85,.06);font-size:13px;line-height:1.4;word-break:break-word}
.pi .tx{white-space:pre-wrap;flex:1}
.pi .ft{font-size:11px;color:rgba(22,26,35,.62);display:flex;flex-wrap:wrap;gap:4px 8px}
.pi .para{font-size:11px;font-weight:650;color:rgba(22,26,35,.7)}
.pi .ac{position:absolute;top:6px;right:6px;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.pi:hover .ac,.pi:focus-within .ac{opacity:1}
.pi .ac button{width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,.7);font-size:12px;color:var(--ink)}
.pi.exp{opacity:.55}
.pi.novo{border:1.5px dashed var(--bv-line);background:#fff;box-shadow:none;align-items:center;justify-content:center;color:var(--bv);font-weight:600;cursor:pointer}
.pi.novo:hover{background:var(--bv-soft)}
.pi.novo:disabled{color:var(--faint);cursor:not-allowed;background:#fff}
.c-amarelo{background:#fff4b8}.c-rosa{background:#ffdbe4}.c-verde{background:#d3f0e7}.c-azul{background:#dde7ff}.c-lilas{background:#ebdfff}
.cores{display:flex;gap:8px}.cores label{width:28px;height:28px;border-radius:8px;cursor:pointer;border:2px solid transparent;display:block}
.cores input{display:none}.cores input:checked+label{border-color:var(--ink)}
.tchk{display:flex;flex-wrap:wrap;gap:6px}.tchk label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer}
.kl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}.kl:last-child{border:0}
.sub2{font-size:12px;color:var(--muted)}
.finl{display:grid;grid-template-columns:auto minmax(80px,180px) 1fr;gap:10px;align-items:center;margin:2px 0 8px}
.finl .m{height:6px;border-radius:99px;background:var(--bv-soft);position:relative;overflow:hidden}.finl .m i{position:absolute;inset:0 auto 0 0;background:var(--bv);border-radius:99px}.finl .m.over i{background:var(--late)}
@media (max-width:720px){.tools{grid-template-columns:1fr}.wall{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
/*NUCLEO-JS*/
</script>
<script>
/* =====================================================================
   Hub da solução · tela inicial do dia a dia
   1) Encontra as ferramentas (HTMLs) na pasta local e abre cada uma, sem acoplar nada:
      o hub só tem links; cada ferramenta continua com o próprio arquivo de dados.
   2) Post-its para os times, no mesmo modelo de troca de arquivos da solução:
      times/<time>/postits/<pessoa>-<computador>.json   (gestao-envelope/1, conteúdo gestao-postits/1)
      cifrado com a chave do time, um arquivo por autor (ninguém grava o arquivo de outra pessoa).
      O Quadro do Time mostra os post-its e grava quem já viu em times/<time>/postits/vistos/<pessoa>-<computador>.json.
   O arquivo pessoal do hub (times, chaves e seus post-its) é cifrado com a sua senha e fica numa pasta só sua (de preferência no seu OneDrive), nunca na compartilhada.
   ===================================================================== */
const TOOL = 'hub', TOOL_NOME = 'Hub da solução', TOOL_VERSION = '1.5.0';
try { window.name = 'gestao-hub'; } catch {}   // o botão "← Hub" das ferramentas volta para esta aba sem recarregar
const LOCAL_SCHEMA = 'gestao-hub-local/1', POSTITS = 'gestao-postits/1', VISTOS = 'gestao-postits-vistos/1', PLANO = 'gestao-financas-plano/1';
const CORES = [['amarelo', 'Amarelo'], ['rosa', 'Rosa'], ['verde', 'Verde'], ['azul', 'Azul'], ['lilas', 'Lilás']];
const MAX_TEXTO = 500;

let db = null, ctx = null, dirLocal = null, arquivo = '', raiz = null, chaves = new Map(), chavesFin = new Map();
let ferramentas = [], recebidos = {}, situacao = { lidoEm: null, erro: '' };
let salvarT = null, salvando = false, sujo = false, pollT = null;
const pubT = {}, pubEstado = {};

/* ------------------------------- modelo ------------------------------- */
function novoDb({ nome, pessoa, times = [] }) {
  return {
    schema: LOCAL_SCHEMA, version: 1, tool: TOOL, criadoEm: new Date().toISOString(),
    nome: clamp(nome, 80), pessoa: { nome: clamp(pessoa, 80), slug: slugPessoa(pessoa) },
    times: times.map(t => ({ nome: clamp(t.nome, 80), slug: t.slug, prefixo: clamp(t.prefixo || '', 5), chaves: [], chavesFin: [] })),
    notas: {}, publicacao: {}, pastaComum: '', seg: { cofreConfirmadoEm: null, ultimoTesteEm: null }
  };
}
const slugPessoa = n => slugify(n).replace(/-/g, '').slice(0, 16) || 'eu';
function normalizar(d) {
  if (d?.schema !== LOCAL_SCHEMA || d.tool !== TOOL) throw new Error('Este arquivo não é do Hub da solução.');
  d.times ??= []; d.notas ??= {}; d.publicacao ??= {}; d.seg ??= {}; d.pessoa ??= { nome: 'Eu', slug: 'eu' };
  for (const t of d.times) { t.chaves ??= []; t.chavesFin ??= []; t.tipo = t.tipo === 'grupo' ? 'grupo' : 'time'; }
  return d;
}
const writer = () => `${db.pessoa.slug}~${dispositivo().id}`;
const baseArq = () => `${db.pessoa.slug}-${dispositivo().id}`;
const timePorSlug = s => db.times.find(t => t.slug === s);
const hoje = () => hojeISO();
const expirada = n => !!n.expira && n.expira < hoje();
const notasDe = slug => (db.notas[slug] ||= []);

/* ------------------------------- arquivo local ------------------------------- */
function agendarSalvar() { sujo = true; clearTimeout(salvarT); salvarT = setTimeout(salvar, 1000); renderTopo(); }
async function salvar() {
  if (!db || !ctx || !dirLocal || salvando) return;
  salvando = true;
  try { await gravarLocal(dirLocal, arquivo, await cifrarLocal(db, ctx)); sujo = false; }
  catch (e) { toast('Não foi possível salvar: ' + e.message, 6000); }
  finally { salvando = false; renderTopo(); }
}
window.addEventListener('beforeunload', e => { if (db && (sujo || Object.keys(pubT).length)) { salvar(); e.preventDefault(); e.returnValue = ''; } });

/* --------------------------------- chaves --------------------------------- */
async function carregarChaves() {
  chaves = new Map();
  chavesFin = new Map();
  for (const t of db.times) for (const c of t.chaves) { try { const k = lerChaveTexto(c.texto); chaves.set(k.kid, await importarChave(k.raw)); } catch {} }
  for (const t of db.times) for (const c of (t.chavesFin ||= [])) { try { const k = lerChaveTexto(c.texto); chavesFin.set(k.kid, await importarChave(k.raw)); } catch {} }
}
// Chave de finanças (separada da de tarefas): só serve para ler o plano agregado que o time publica.
const mapaFinDoTime = t => new Map((t.chavesFin ||= []).filter(c => !c.revogada && chavesFin.has(c.kid)).map(c => [c.kid, chavesFin.get(c.kid)]));
const temChaveFin = t => mapaFinDoTime(t).size > 0;
function chaveDoTime(t) { const c = t.chaves.filter(x => !x.revogada).at(-1); return c && chaves.has(c.kid) ? { kid: c.kid, key: chaves.get(c.kid) } : null; }
const mapaDoTime = t => new Map(t.chaves.filter(c => chaves.has(c.kid)).map(c => [c.kid, chaves.get(c.kid)]));
async function colarChave(t, texto, origem = 'colada', fin = false) {
  const k = lerChaveTexto(texto), lista = fin ? t.chavesFin : t.chaves;
  if (fin) lista.forEach(c => c.revogada = c.revogada || (c.kid !== k.kid));
  if (!lista.some(c => c.kid === k.kid)) lista.push({ kid: k.kid, texto: texto.trim(), em: new Date().toISOString(), origem });
  await carregarChaves(); agendarSalvar();
  return k.kid;
}

/* ------------------------------ ferramentas ------------------------------ */
// Reconhece cada HTML da pasta local pelo <title> e, quando houver, pela pré-configuração do time.
// O hub nunca abre nem lê os arquivos de dados das ferramentas: só lista os HTMLs e cria links.
const TIPOS = {
  'Central de Gestão': { ic: 'CT', cls: '', ordem: 1, desc: 'Tarefas consolidado: iniciativas, times, rituais e pessoas' },
  'Finanças do Grupo': { ic: 'FG', cls: 'fin', ordem: 2, desc: 'Consolidado das finanças dos times' },
  'Quadro do Time': { ic: 'QT', cls: '', ordem: 3, desc: 'Quadro, backlog, sprints e métricas do time' },
  'Finanças do Time': { ic: 'FT', cls: 'fin', ordem: 4, desc: 'Dia a dia e futuro das finanças do time' },
  'Mapa de Férias': { ic: 'FÉ', cls: '', ordem: 5, desc: 'Quem está fora e quando: dias com mais e menos gente ausente' },
  'Início da solução': { ic: 'IN', cls: 'aux', ordem: 8, desc: 'Assistente: gera as ferramentas de novo' },
  'Onde fica cada coisa': { ic: '?', cls: 'aux', ordem: 9, desc: 'Cartão com o mapa dos seus arquivos' }
};
function presetDe(txt, marca) {
  const i = txt.indexOf(`/*${marca}*/`), j = txt.indexOf(`/*FIM-${marca}*/`);
  if (i < 0 || j < i) return null;
  try { return JSON.parse(txt.slice(i + marca.length + 4, j)); } catch { return null; }
}
async function procurarFerramentas() {
  const out = [];
  if (!dirLocal) return out;
  for await (const [n, h] of dirLocal.entries()) {
    if (h.kind !== 'file' || !/\.html?$/i.test(n)) continue;
    try {
      const f = await h.getFile(), cab = await f.slice(0, 4096).text();
      const titulo = (/<title>([^<]*)<\/title>/i.exec(cab) || [])[1]?.trim() || '';
      const tipo = TIPOS[titulo]; if (!tipo) continue;
      let time = null;
      if (titulo === 'Quadro do Time' || titulo === 'Finanças do Time') {
        const txt = await f.text(), p = presetDe(txt, titulo === 'Quadro do Time' ? 'QUADRO-PRESET' : 'FIN-PRESET');
        const tm = p?.team; if (tm) time = { nome: tm.name || tm.nome || '', slug: tm.slug || '' };
      }
      out.push({ arquivo: n, titulo, ...tipo, time, alterado: f.lastModified });
    } catch {}
  }
  return out.sort((a, b) => a.ordem - b.ordem || (a.time?.nome || '').localeCompare(b.time?.nome || '', 'pt-BR') || a.arquivo.localeCompare(b.arquivo));
}
// Os links são relativos: funcionam quando o hub.html está na mesma pasta das ferramentas.
function pastaDoHub() {
  if (location.protocol !== 'file:') return null;
  const partes = decodeURIComponent(location.pathname).split('/').filter(Boolean);
  return { nome: partes.at(-2) || '', caminho: partes.slice(0, -1).join('/') };
}

/* --------------------------- pasta sincronizada --------------------------- */
async function ligarPasta(h, silencioso = false) {
  if (!await permissao(h, !silencioso)) { if (!silencioso) toast('Sem permissão na pasta.'); return false; }
  const v = await validarPastaComum(h);
  if (!v.tem && !v.nomeOk && !silencioso) {
    const r = await perguntar('Esta é a pasta compartilhada?', `<p>A pasta <b class="code">${esc(h.name)}</b> não tem a estrutura da solução (<span class="code">times/</span>, <span class="code">grupo/</span>) nem o nome <span class="code">${PASTA_COMUM}</span>.</p>
      <p class="muted small">Escolha a pasta raiz sincronizada pelo OneDrive. Se for esta mesma, o hub cria só <span class="code">times/&lt;time&gt;/postits/</span> quando você publicar um post-it.</p>`, [['no', 'Escolher outra'], ['ok', 'Usar esta pasta', 'pri']]);
    if (r !== 'ok') return false;
  }
  if (dirLocal && h.name === dirLocal.name && !v.tem && !silencioso) toast('Atenção: esta parece ser a pasta local. A pasta comum é a sincronizada pelo OneDrive.', 6000);
  raiz = h; db.pastaComum = h.name; agendarSalvar();
  lembrarPasta('hub-raiz', h);
  await lerTudo(); render();
  for (const t of db.times) if ((db.notas[t.slug] || []).length && !db.publicacao[t.slug]?.revision) agendarPublicar(t.slug, 500);
  return true;
}
async function ultimaAlteracao(dir, filtro = () => true) {
  let m = 0; if (!dir) return 0;
  try { for await (const [n, h] of dir.entries()) if (h.kind === 'file' && !n.startsWith('.') && filtro(n)) { const f = await h.getFile(); m = Math.max(m, f.lastModified); } } catch {}
  return m;
}
// Só os totais agregados do plano publicado (o detalhe dos lançamentos nunca sai do time).
function resumoPlano(p) {
  const n = v => Number.isFinite(+v) ? Math.round(+v) : 0;
  const porAno = {};
  for (const [a, x] of Object.entries(p.totalsByYear || {})) if (/^\d{4}$/.test(a)) porAno[a] = { orcado: n(x?.budget), previsto: n(x?.forecast), realizado: n(x?.actual) };
  if (!Object.keys(porAno).length && p.fiscalYear) porAno[p.fiscalYear] = { orcado: n(p.totals?.budget), previsto: n(p.totals?.forecast), realizado: n(p.totals?.actual) };
  return { moeda: clamp(p.currency || 'BRL', 3), ano: +p.fiscalYear || null, porAno, fechados: (p.closedMonths || []).length, em: p.generatedAt || '' };
}
// Ano mostrado: o ano corrente, se algum time já planejou; senão o ano base mais recente publicado.
const anoCorrente = () => { const a = String(new Date().getFullYear()); const pls = db?.times.map(t => recebidos[t.slug]?.plano).filter(Boolean) || [];
  return !pls.length || pls.some(p => p.porAno[a]) ? a : String(Math.max(...pls.map(p => p.ano || 0))); };
function totaisAno(pl, ano = anoCorrente()) { return pl?.porAno?.[ano] || null; }
async function lerTime(t) {
  const r = { notas: [], vistos: {}, atividade: {}, erros: [], copias: 0, plano: null, planoErro: '' };
  if (t.tipo === 'grupo') return lerGestor(t, r);
  const dt = await subpasta(raiz, ['times', t.slug]);
  if (!dt) return r;
  r.atividade.quadro = await ultimaAlteracao(await subpasta(dt, ['quadro']));
  r.atividade.status = await ultimaAlteracao(dt, n => n === 'status.json');
  r.atividade.metricas = await ultimaAlteracao(dt, n => n === 'metricas.json');
  const df = await subpasta(dt, ['financas']);
  r.atividade.plano = await ultimaAlteracao(df, n => /^plano/.test(n));
  if (df && temChaveFin(t)) {
    try { const e = await lerEnvelopes(df, 'plano', mapaFinDoTime(t), { team: t.slug, content: PLANO }); if (e.melhor) r.plano = resumoPlano(e.melhor.payload); else if (e.invalidos.some(x => x.principal)) r.planoErro = 'o plano não abriu com a chave de finanças cadastrada'; } catch {}
  }
  const dp = await subpasta(dt, ['postits']); if (!dp) return r;
  const mapa = mapaDoTime(t), meu = writer(), porAutor = new Map();
  const ler = async (dir, conteudo, fn) => {
    for await (const [n, h] of dir.entries()) {
      if (h.kind !== 'file' || !n.endsWith('.json') || n.startsWith('.')) continue;
      let env, p;
      try { env = JSON.parse(await (await h.getFile()).text()); p = await decifrarEnv(env, mapa); }
      catch (e) { if (env?.team === t.slug) r.erros.push(`${n}: ${e.message}`); continue; }
      if (p.schema !== conteudo || env.team !== t.slug || p.source?.team !== t.slug) continue;
      fn(n, p);
    }
  };
  await ler(dp, POSTITS, (n, p) => {
    const w = p.source?.writer || n; if (w === meu) { if (n !== baseArq() + '.json') r.copias++; return; }
    const ant = porAutor.get(w); if (!ant || p.revision > ant.revision) porAutor.set(w, p);
  });
  for (const [w, p] of porAutor) for (const x of p.notes || []) {
    if (!x?.id || typeof x.text !== 'string') continue;
    r.notas.push({ id: String(x.id), texto: clamp(x.text, MAX_TEXTO), cor: CORES.some(c => c[0] === x.color) ? x.color : 'amarelo', para: clamp(x.to || '', 60), criadoEm: x.createdAt, atualizadoEm: x.updatedAt, expira: x.expiresAt || '', autor: clamp(p.source?.author?.name || w.split('~')[0], 60), writer: w, meuOutro: w.split('~')[0] === db.pessoa.slug });
  }
  r.notas.sort((a, b) => String(b.atualizadoEm || '').localeCompare(String(a.atualizadoEm || '')));
  const dv = await subpasta(dp, ['vistos']);
  if (dv) {
    const porLeitor = new Map();
    await ler(dv, VISTOS, (n, p) => { const w = p.source?.writer || n, ant = porLeitor.get(w); if (!ant || p.revision > ant.revision) porLeitor.set(w, p); });
    for (const [w, p] of porLeitor) for (const s of p.seen || []) (r.vistos[s.id] ||= []).push({ quem: clamp(p.source?.author?.name || w.split('~')[0], 40), em: s.at });
  }
  return r;
}
// Liderança (Hub 1.3): um gestor par é uma unidade "grupo" no Finanças do Grupo da liderança. O hub lê o consolidado
// que ele publica para a liderança (grupos/<grupo>/financas/plano.json, ADR-0025) com a chave de finanças do grupo.
async function lerGestor(t, r) {
  const df = await subpasta(raiz, ['grupos', t.slug, 'financas']); if (!df) return r;
  r.atividade.plano = await ultimaAlteracao(df, n => /^plano/.test(n));
  if (temChaveFin(t)) {
    try { const e = await lerEnvelopes(df, 'plano', mapaFinDoTime(t), { team: t.slug, content: PLANO }); if (e.melhor) r.plano = resumoPlano(e.melhor.payload); else if (e.invalidos.some(x => x.principal)) r.planoErro = 'o consolidado não abriu com a chave de finanças do grupo'; } catch {}
  }
  return r;
}
async function lerTudo() {
  if (!raiz || !db) return;
  try {
    for (const t of db.times) recebidos[t.slug] = await lerTime(t);
    situacao = { lidoEm: new Date().toISOString(), erro: '' };
  } catch (e) { situacao.erro = e.message; }
}
async function atualizar() { if (!raiz || !db) return; await lerTudo(); if (!dlg().open) render(); else renderTopo(); }

/* ------------------------------ publicação ------------------------------ */
// Um arquivo por autor e computador: times/<time>/postits/<pessoa>-<computador>.json.
// Retrato completo (não diff), revisão monotônica, gravação atômica e conferida (publicarUnico do núcleo).
function agendarPublicar(slug, ms = 4000) {
  clearTimeout(pubT[slug]); pubEstado[slug] = { ...(pubEstado[slug] || {}), pendente: true, erro: '' };
  pubT[slug] = setTimeout(() => { delete pubT[slug]; publicar(slug); }, ms);
}
async function publicar(slug) {
  const t = timePorSlug(slug); if (!t) return;
  const k = chaveDoTime(t);
  if (!raiz || !k) { pubEstado[slug] = { pendente: true, erro: !k ? 'sem chave do time' : 'pasta sincronizada não ligada' }; renderTopo(); return; }
  try {
    const dir = await subpasta(raiz, ['times', slug, 'postits'], true);
    const notas = notasDe(slug).filter(n => !expirada(n));
    const r = await publicarUnico({
      dir, base: baseArq(), chave: k, team: slug, writer: writer(), ultimaRevisao: db.publicacao[slug]?.revision || 0,
      montar: { schema: POSTITS, payload: meta => ({ schema: POSTITS, ...meta, source: { tool: TOOL, toolVersion: TOOL_VERSION, author: { name: db.pessoa.nome } }, team: { name: t.nome, slug },
        notes: notas.map(n => ({ id: n.id, text: n.texto, color: n.cor, to: n.para || undefined, createdAt: n.criadoEm, updatedAt: n.atualizadoEm, expiresAt: n.expira || undefined })) }) }
    });
    db.publicacao[slug] = { revision: r.revision, em: r.generatedAt, notas: notas.length };
    pubEstado[slug] = { pendente: false, erro: '' };
    if (r.removidas.length) toast(`Cópia de conflito do OneDrive resolvida (${r.removidas.length}).`);
    agendarSalvar();
  } catch (e) { pubEstado[slug] = { pendente: true, erro: e.message }; }
  render();
}

/* --------------------------------- telas --------------------------------- */
const tempo = ms => { if (!ms) return '—'; const m = (Date.now() - ms) / 60000; return m < 1 ? 'agora' : m < 60 ? `há ${Math.round(m)} min` : m < 1440 ? `há ${Math.round(m / 60)} h` : `há ${Math.round(m / 1440)} d`; };
function renderTopo() {
  const el = $('#topo'); if (!el || !db) return;
  const pend = Object.values(pubEstado).filter(x => x.pendente).length;

}
// Lê o arquivo de dados da Central (gestao-cripto/2) com a senha dela e traz os times e as chaves ativas.
// Só lê: o arquivo da Central não é alterado.
async function importarDaCentral() {
  let fh; try { [fh] = await window.showOpenFilePicker({ id: 'hub-central', types: [{ description: 'Dados da Central', accept: { 'application/json': ['.json'] } }] }); } catch { return; }
  const texto = await (await fh.getFile()).text();
  let pack; try { pack = JSON.parse(texto); } catch { return toast('O arquivo não é JSON.'); }
  let obj = null;
  if (pack?.encrypted && pack.format === 'gestao-cripto/2') {
    for (let i = 0; i < 3 && !obj; i++) {
      const s = await pedirSenhaDlg('Senha da Central', i > 0); if (s == null) return;
      try { const key = await chaveDaSenha(s, b64.dec(pack.salt), pack.iterations || 250000); obj = JSON.parse(td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64.dec(pack.iv) }, key, b64.dec(pack.data)))); } catch {}
    }
    if (!obj) return toast('Senha incorreta.');
  } else if (pack && !pack.encrypted && Array.isArray((pack.data || pack).teams)) obj = pack.data || pack;
  else return toast('Este arquivo não é da Central de Gestão.');
  let nt = 0, nk = 0, sem = [];
  for (const tc of obj.teams || []) {
    const slug = tc.slug || ''; if (!slug) { sem.push(tc.name); continue; }
    let t = timePorSlug(slug);
    if (!t) { t = { nome: clamp(tc.name, 80), slug, prefixo: clamp(tc.prefix || '', 5), chaves: [], chavesFin: [] }; db.times.push(t); nt++; }
    for (const k of (obj.integ?.keys?.[tc.id] || []).filter(k => !k.revokedAt)) { try { const p = lerChaveTexto(k.key); if (!t.chaves.some(c => c.kid === p.kid)) { t.chaves.push({ kid: p.kid, texto: k.key, em: new Date().toISOString(), origem: 'central' }); nk++; } } catch {} }
  }
  obj = null;
  await carregarChaves(); agendarSalvar(); await atualizar(); render();
  await perguntar('Importado da Central', `<p>${nt} time(s) novo(s) e ${nk} chave(s) trazidos da Central.${sem.length ? ` Times sem pasta definida na Central ficaram de fora: ${esc(sem.join(', '))}.` : ''}</p>
    <div class="cofre">As chaves dos times agora também ficam dentro do arquivo do hub, cifrado com a <b>sua senha</b>. Ela deve estar no cofre de senhas.</div>`);
}

// Lê o arquivo local do Finanças do Grupo (gestao-local-cifrado/1) com a senha dele e traz os times e as
// chaves de finanças ativas. Só lê: o arquivo do grupo não é alterado. Cada gestor importa o próprio grupo.
async function importarDoGrupo() {
  let fh; try { [fh] = await window.showOpenFilePicker({ id: 'hub-grupo', types: [{ description: 'Dados do Finanças do Grupo', accept: { 'application/json': ['.json'] } }] }); } catch { return; }
  const texto = await (await fh.getFile()).text();
  try { lerCabecalhoLocal(texto); } catch (e) { return toast(e.message); }
  let obj = null;
  for (let i = 0; i < 3 && !obj; i++) {
    const s = await pedirSenhaDlg('Senha do Finanças do Grupo', i > 0); if (s == null) return;
    try { obj = (await decifrarLocal(texto, s)).dados; } catch (e) { if (e.code !== 'SENHA') return toast(e.message); }
  }
  if (!obj) return toast('Senha incorreta.');
  if (obj.tool !== 'financas-grupo' || !Array.isArray(obj.times)) return toast('Este arquivo não é do Finanças do Grupo.');
  let nt = 0, nk = 0;
  for (const tg of obj.times) {
    const slug = tg.slug || ''; if (!slug) continue;
    let t = timePorSlug(slug);
    if (!t) { t = { nome: clamp(tg.nome, 80), slug, prefixo: clamp(tg.prefixo || '', 5), chaves: [], chavesFin: [], tipo: 'time' }; db.times.push(t); nt++; }
    if (tg.tipo === 'grupo') t.tipo = 'grupo';
    for (const c of (tg.chaves || []).filter(c => !c.revogada)) { try { const p = lerChaveTexto(c.texto); if (!t.chavesFin.some(x => x.kid === p.kid)) { t.chavesFin.push({ kid: p.kid, texto: c.texto, em: new Date().toISOString(), origem: 'grupo' }); nk++; } } catch {} }
  }
  obj = null;
  await carregarChaves(); agendarSalvar(); await atualizar(); render();
  await perguntar('Importado do Finanças do Grupo', `<p>${nt} time(s) novo(s) e ${nk} chave(s) de finanças trazidos. O hub passa a mostrar o plano agregado que cada time publica (orçado, previsto e realizado do ano).</p>
    <div class="cofre">As chaves de finanças agora também ficam dentro do arquivo do hub, cifrado com a <b>sua senha</b>. Ela deve estar no cofre de senhas.</div>`);
}

/* --------------------------------- ajustes --------------------------------- */
function ajustes() {
  const d = modal(`<div class="mh"><h2>Ajustes do hub</h2></div><div class="mb">
    <div class="f2"><label class="field"><span>Nome no topo (grupo ou time)</span><input class="sin" id="aN" value="${esc(db.nome || '')}"></label><label class="field"><span>Seu nome (aparece nos post-its)</span><input class="sin" id="aP" value="${esc(db.pessoa.nome)}"></label></div>
    <p class="small muted" style="margin-top:-4px">Você neste computador: <span class="code">${esc(writer())}</span>. Seus post-its vão em <span class="code">times/&lt;time&gt;/postits/${esc(baseArq())}.json</span>.</p>
    <p class="lbl" style="margin-top:14px">Times e chaves</p>
    ${db.times.map(t => { const k = chaveDoTime(t); return `<div class="kl"><b>${esc(t.nome)}</b><span class="chip code">${esc(t.slug)}</span>${k ? `<span class="chip ok code">${esc(k.kid)}</span>` : '<span class="chip late">sem chave</span>'}<span class="grow"></span>
      ${temChaveFin(t) ? '<span class="chip ok" title="Chave de finanças cadastrada">finanças</span>' : ''}
      <button class="btn sm" data-ak="${esc(t.slug)}">${k ? 'Trocar chave' : 'Colar chave'}</button><button class="btn sm ghost" data-af="${esc(t.slug)}">${temChaveFin(t) ? 'Trocar chave de finanças' : 'Colar chave de finanças'}</button>${k ? `<button class="btn sm ghost" data-ar="${esc(t.slug)}">Remover chave</button>` : ''}<button class="btn sm ghost" data-ae="${esc(t.slug)}">Editar</button></div>`; }).join('') || '<div class="empty">Nenhum time.</div>'}
    <p class="lbl" style="margin-top:14px">Senha do arquivo</p>
    <div class="row"><button class="btn sm" id="aSenha">Trocar senha</button><button class="btn sm" id="aTeste">Testar minha senha</button><button class="btn sm" id="aBk">Baixar cópia cifrada</button></div></div>
    <div class="mf"><button class="btn pri" id="aOk">Fechar</button></div>`, 'wide');
  $('#aN', d).onchange = e => { db.nome = clamp(e.target.value.trim(), 80); agendarSalvar(); };
  $('#aP', d).onchange = e => { const n = e.target.value.trim(); if (n) { db.pessoa.nome = clamp(n, 80); agendarSalvar(); for (const t of db.times) if ((db.notas[t.slug] || []).length) agendarPublicar(t.slug); } };
  $('#aOk', d).onclick = () => { fecharModal(); render(); };
  $$('[data-ak]', d).forEach(b => b.onclick = () => { fecharModal(); pedirChave(timePorSlug(b.dataset.ak)); });
  $$('[data-af]', d).forEach(b => b.onclick = () => { fecharModal(); pedirChave(timePorSlug(b.dataset.af), 'fin'); });
  $$('[data-ae]', d).forEach(b => b.onclick = () => { fecharModal(); editarTime(timePorSlug(b.dataset.ae)); });
  $$('[data-ar]', d).forEach(b => b.onclick = async () => { const t = timePorSlug(b.dataset.ar); t.chaves.forEach(c => c.revogada = true); await carregarChaves(); agendarSalvar(); fecharModal(); render(); });
  $('#aSenha', d).onclick = async () => { const s = await criarSenhaDlg('Nova senha do hub'); if (!s) return; ctx = await novoCtx(s, TOOL); db.seg = { cofreConfirmadoEm: new Date().toISOString(), ultimoTesteEm: null }; await salvar(); toast('Senha trocada. Use a nova a partir de agora.'); };
  $('#aTeste', d).onclick = async () => { const s = await pedirSenhaDlg('Testar minha senha'); if (s == null) return; if (await senhaConfere(s, ctx)) { db.seg.ultimoTesteEm = new Date().toISOString(); agendarSalvar(); toast('Senha correta.'); } else toast('Senha não confere. Troque a senha enquanto o arquivo está aberto.', 6000); };
  $('#aBk', d).onclick = async () => baixar(arquivo.replace(/\.json$/, '') + '-copia-' + hojeISO() + '.json', await cifrarLocal(db, ctx));
}

/* ---------------------------- abertura e criação ---------------------------- */
async function telaInicial(msg = '') {
  const ult = lembrarAtivo() ? await kv.get('hub-local') : null;
  $('#app').innerHTML = `<div class="welcome"><div class="card">
    <div class="row"><div class="logo" style="margin:0">HUB</div><div><h2 style="margin:0">${TOOL_NOME}</h2><div class="small muted">Abra as ferramentas da solução e deixe post-its para os times</div></div></div>
    ${msg ? `<div class="banner warn" style="margin-top:12px">${esc(msg)}</div>` : ''}
    ${avisoFS()}
    ${ult ? `<button class="opt" id="iUlt" style="margin-top:18px"><b>Abrir ${esc(ult.arquivo)}</b><span>Pasta local <span class="code">${esc(ult.dir.name)}</span>, usada por último neste computador.</span></button>` : ''}
    <p class="lbl" style="margin-top:20px">Já tenho o hub</p>
    <button class="opt" id="iAbrir"><b>Abrir a pasta local</b><span>A pasta deste computador (só sua; de preferência no seu OneDrive) com as ferramentas e o arquivo <span class="code">hub-&lt;nome&gt;.json</span>.</span></button>
    <p class="lbl" style="margin-top:16px">É a primeira vez?</p>
    <button class="opt" id="iNovo"><b>Criar o hub</b><span>Seu nome, a pasta local e a senha. Depois você liga a pasta sincronizada e cola as chaves dos times (ou importa da Central).</span></button>
    <p class="small muted" style="margin-top:16px">O hub não guarda dados das outras ferramentas: só abre cada uma. Seus post-its vão cifrados com a chave de cada time para a pasta sincronizada pelo OneDrive.</p>
  </div></div>`;
  $('#iNovo').onclick = criarDlg;
  $('#iAbrir').onclick = abrirPasta;
  if (ult) $('#iUlt').onclick = async () => { if (!await permissao(ult.dir)) return telaInicial('Sem permissão na pasta.'); await abrirArquivo(ult.dir, ult.arquivo); };
}
async function abrirPasta() {
  let h; try { h = await escolherPasta('fin-local'); } catch (e) { if (e.name !== 'AbortError') toast(e.message); return; }
  if (!await permissao(h)) return;
  const cand = [];
  for await (const [n, f] of h.entries()) if (f.kind === 'file' && /^hub-.*\.json$/.test(n)) { try { const o = JSON.parse(await (await f.getFile()).text()); if (o.schema === LOCAL_ENC && o.app === TOOL) cand.push(n); } catch {} }
  if (!cand.length) return telaInicial('Não encontrei um arquivo do hub nesta pasta. Se é a primeira vez, use "Criar o hub".');
  let nome = cand[0];
  if (cand.length > 1) { const r = await perguntar('Qual arquivo?', cand.map((n, i) => `<button class="opt" data-r="${i}"><b class="code">${esc(n)}</b></button>`).join(''), [['no', 'Cancelar']]); if (r == null || r === 'no') return; nome = cand[+r]; }
  await abrirArquivo(h, nome);
}
async function abrirArquivo(h, nome) {
  const texto = await lerTexto(h, nome);
  if (!texto) return telaInicial('Arquivo não encontrado.');
  for (let i = 0; i < 3; i++) {
    const s = await pedirSenhaDlg('Senha do hub', i > 0, { sessao: true }); if (s == null) return;
    try { const r = await decifrarLocal(texto, s); db = normalizar(r.dados); ctx = r.ctx; dirLocal = h; arquivo = nome; window.gestaoSessao?.definir(s); break; }
    catch (e) { if (e.code !== 'SENHA') return telaInicial(e.message); }
  }
  if (!db) return telaInicial('Senha incorreta três vezes.');
  await aposAbrir();
}
async function aposAbrir() {
  if (lembrarAtivo()) kv.set('hub-local', { dir: dirLocal, arquivo });
  await carregarChaves();
  ferramentas = await procurarFerramentas();
  render();
  if (await lembreteTesteSenha(db.seg, ctx)) agendarSalvar();
  { const h = await pastaLembrada('hub-raiz'); if (h && await permissao(h, false)) await ligarPasta(h, true); }
  clearInterval(pollT); pollT = setInterval(atualizar, 30000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && db) atualizar(); });
async function criarDlg() {
  if (semFS()) return;
  const d = modal(`<div class="mh"><h2>Criar o hub</h2></div><div class="mb">
    <div class="f2"><label class="field"><span>Seu nome (aparece nos post-its)</span><input class="sin" id="cP"></label><label class="field"><span>Nome no topo (grupo ou time)</span><input class="sin" id="cN" placeholder="Ex.: Tecnologia"></label></div>
    <p class="small muted">Depois você escolhe a pasta pessoal (só sua, de preferência no seu OneDrive; a mesma das ferramentas) e cria a senha.</p></div>
    <div class="mf"><button class="btn" id="cNo">Cancelar</button><button class="btn pri" id="cOk">Escolher pasta local</button></div>`);
  $('#cNo', d).onclick = fecharModal;
  $('#cOk', d).onclick = async () => {
    const pessoa = $('#cP', d).value.trim(), nome = $('#cN', d).value.trim();
    if (!pessoa) return toast('Preencha o seu nome.');
    fecharModal();
    if (!await criarArquivo({ nome, pessoa })) telaInicial();
  };
}
async function escolherPastaLocal() {
  await perguntar('Pasta local', `<p>Escolha a sua <b>pasta pessoal</b>: só sua, de preferência no <b>seu OneDrive</b> (backup se trocar de computador), como <span class="code">OneDrive - Empresa\\GestaoPessoal</span>. A mesma das outras ferramentas, com os HTMLs. Nunca a pasta compartilhada com os times.</p><div class="banner">O arquivo é cifrado com a sua senha: no OneDrive, ninguém consegue ler sem ela.</div>`, [['ok', 'Escolher pasta', 'pri']]);
  let h; try { h = await escolherPasta('fin-local'); } catch { return null; }
  if (!await permissao(h)) return null;
  const s = await suspeitaDeSincronizada(h);
  if (s.length) { const r = await perguntar('Esta parece ser a pasta compartilhada', `<div class="cofre">A pasta <b>${esc(h.name)}</b> ${esc(s.join(', '))}. ${AVISO_PASTA_PESSOAL}</div>`, [['no', 'Escolher outra'], ['ok', 'Usar mesmo assim']]); if (r !== 'ok') return escolherPastaLocal(); }
  return h;
}
async function criarArquivo({ nome, pessoa }) {
  const h = await escolherPastaLocal(); if (!h) return false;
  const nomeArq = `hub-${slugify(nome || pessoa) || 'meu'}.json`;
  if (await lerTexto(h, nomeArq)) { const r = await perguntar('Arquivo já existe', `<p>Já existe <span class="code">${esc(nomeArq)}</span> nesta pasta. Abrir o existente?</p>`, [['no', 'Cancelar'], ['ok', 'Abrir', 'pri']]); if (r === 'ok') { await abrirArquivo(h, nomeArq); return true; } return false; }
  const senha = await criarSenhaDlg('Senha do hub'); if (!senha) return false;
  db = novoDb({ nome: nome || pessoa, pessoa });
  db.seg.cofreConfirmadoEm = new Date().toISOString();
  ctx = await novoCtx(senha, TOOL); dirLocal = h; arquivo = nomeArq; window.gestaoSessao?.definir(senha);
  await gravarLocal(h, nomeArq, await cifrarLocal(db, ctx));
  await aposAbrir();
  toast('Hub criado e cifrado. Agora ligue a pasta sincronizada e cadastre os times.', 5000);
  return true;
}
window.__hub = { get db() { return db; }, get recebidos() { return recebidos; }, importarDoGrupo, painel, novoDb, lerTime, publicar, atualizar, procurarFerramentas, get ferramentas() { return ferramentas; }, ligarPasta, colarChave, abrirArquivo };
// Aberto pelo assistente ou de novo neste computador: abre direto o último hub quando a pasta ainda está liberada.
(async () => { const u = lembrarAtivo() ? await kv.get('hub-local') : null; let ok = false;
  try { ok = !!(u?.dir && await permissao(u.dir, false) && await lerTexto(u.dir, u.arquivo)); } catch {}
  if (ok) await abrirArquivo(u.dir, u.arquivo); if (!db && !$('#app').children.length) telaInicial(); })();
</script>

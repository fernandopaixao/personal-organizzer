<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finanças do Grupo</title>
<style>
/*NUCLEO-CSS*/
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
/*NUCLEO-JS*/
</script>
<script>
/* =====================================================================
   Finanças do Grupo · consolidado dos planos publicados pelos times
   Soma os JSONs times/<time>/financas/plano.json (nunca altera o número de um time),
   compara com o orçamento do grupo e publica diretrizes grupo/financas/diretriz-<time>.json.
   Orçamento aprovado, itens do grupo, chaves e versões ficam no arquivo local cifrado.
   ===================================================================== */
const TOOL = 'financas-grupo', TOOL_NOME = 'Finanças do Grupo', TOOL_VERSION = '1.0.0';
const LOCAL_SCHEMA = 'gestao-financas-local/1', PLANO_SCHEMA = 'gestao-financas-plano/1', DIRETRIZ_SCHEMA = 'gestao-financas-diretriz/1';
const PRESET = /*FING-PRESET*/null/*FIM-FING-PRESET*/;
const CATS_PADRAO = [
  ['pessoas', 'Pessoas', 'OPEX'], ['terceiros', 'Terceiros e consultoria', 'OPEX'], ['licencas', 'Licenças e software', 'OPEX'],
  ['nuvem', 'Nuvem e infraestrutura', 'OPEX'], ['viagens', 'Viagens e eventos', 'OPEX'], ['treinamento', 'Treinamento', 'OPEX'],
  ['equipamentos', 'Equipamentos', 'CAPEX'], ['desenvolvimento', 'Desenvolvimento capitalizável', 'CAPEX'], ['outras', 'Outras', 'OPEX']
].map(([id, nome, tipo]) => ({ id, nome, tipo }));

let db = null, ctx = null, dirLocal = null, arquivo = '', raiz = null;
let view = 'consolidado', pendentes = [], saude = {}, salvarT = null, salvando = false, sujo = false, verVersao = '', agrupar = 'time';

function novoDb({ nome, ano, moeda, pessoa }) {
  return { schema: LOCAL_SCHEMA, version: 1, tool: TOOL, criadoEm: new Date().toISOString(), grupo: { nome, slug: slugify(nome) }, ano: +ano, moeda,
    pessoa: { nome: pessoa, slug: slugify(pessoa).split('-')[0] || 'gestor' }, categorias: CATS_PADRAO.map(c => ({ ...c })), centros: [],
    orcamento: { total: 0, nota: '' }, itens: [], times: [], retratos: {}, versoes: [], seg: {} };
}
function normalizar(d) {
  if (d?.schema !== LOCAL_SCHEMA || d.tool !== TOOL) throw new Error('Este arquivo não é das Finanças do Grupo.');
  d.categorias ??= CATS_PADRAO.map(c => ({ ...c })); d.centros ??= []; d.orcamento ??= { total: 0 }; d.itens ??= []; d.times ??= []; d.retratos ??= {}; d.versoes ??= []; d.seg ??= {};
  for (const t of d.times) { t.chaves ??= []; t.teto ??= { total: 0, caps: {} }; t.diretriz ??= {}; }
  return d;
}
const writer = () => `${db.pessoa.slug}~${dispositivo().id}`;
const fm = c => fmtMoeda(c, db.moeda);
const catPorId = id => db.categorias.find(c => c.id === id);
const timePorSlug = s => db.times.find(t => t.slug === s);
const mesesAno = () => mesesDoAno(db.ano);
const ytd = () => mesesAno().filter(m => m <= mesAtual());

/* --------------------------- soma dos planos --------------------------- */
// Um retrato só entra na soma se for do mesmo ano fiscal e da mesma moeda do grupo.
function somavel(p) { return p && p.fiscalYear === db.ano && p.currency === db.moeda; }
function totaisPlano(p, meses = mesesAno(), filtro = () => true) {
  const t = { orcado: 0, previsto: 0, realizado: 0 };
  if (!p) return t;
  for (const l of p.lines || []) { if (!filtro(l)) continue; for (const m of meses) { const v = l.months?.[m]; if (!v) continue; t.orcado += +v.budget || 0; t.previsto += +v.forecast || 0; t.realizado += +v.actual || 0; } }
  return t;
}
function totaisItens(meses = mesesAno(), filtro = () => true) {
  const t = { orcado: 0, previsto: 0, realizado: 0 };
  for (const i of db.itens.filter(filtro)) for (const m of meses) { t.orcado += i.orcado?.[m] || 0; t.previsto += i.previsto?.[m] ?? i.orcado?.[m] ?? 0; t.realizado += i.realizado?.[m] || 0; }
  return t;
}
const soma = (...ts) => ts.reduce((a, b) => ({ orcado: a.orcado + b.orcado, previsto: a.previsto + b.previsto, realizado: a.realizado + b.realizado }), { orcado: 0, previsto: 0, realizado: 0 });
function consolidado(meses = mesesAno()) {
  const porTime = db.times.map(t => { const r = db.retratos[t.slug]; return { t, r, ok: somavel(r?.payload), tot: somavel(r?.payload) ? totaisPlano(r.payload, meses) : { orcado: 0, previsto: 0, realizado: 0 } }; });
  return { porTime, itens: totaisItens(meses), total: soma(...porTime.map(x => x.tot), totaisItens(meses)) };
}
function linhasTodas() {
  const out = [];
  for (const t of db.times) { const p = db.retratos[t.slug]?.payload; if (!somavel(p)) continue; for (const l of p.lines || []) out.push({ time: t, l }); }
  return out;
}

/* -------------------------------- arquivo -------------------------------- */
function agendarSalvar() { sujo = true; clearTimeout(salvarT); salvarT = setTimeout(salvar, 1200); render(); }
async function salvar() {
  if (!db || !ctx || !dirLocal || salvando) return;
  salvando = true;
  try { await gravarLocal(dirLocal, arquivo, await cifrarLocal(db, ctx)); sujo = false; } catch (e) { toast('Não foi possível salvar: ' + e.message, 6000); }
  finally { salvando = false; renderTopo(); }
}
window.addEventListener('beforeunload', e => { if (db && sujo) { salvar(); e.preventDefault(); e.returnValue = ''; } });
async function chavesDoTime(t) {
  const m = new Map();
  for (const c of t.chaves.filter(c => !c.revogada)) { try { const k = lerChaveTexto(c.texto); m.set(k.kid, await importarChave(k.raw)); } catch {} }
  return m;
}
const chaveAtualTexto = t => t.chaves.filter(c => !c.revogada).at(-1);

/* -------------------------- pasta sincronizada -------------------------- */
let pollT = null;
async function ligarPasta(h, silencioso = false) {
  if (!await permissao(h, !silencioso)) return false;
  const v = await validarPastaComum(h);
  if (!v.tem && !silencioso) {
    const r = await perguntar('Esta é a pasta compartilhada?', `<p>A pasta <b class="code">${esc(h.name)}</b> ainda não tem a estrutura da solução.</p><p class="muted small">Recomendado: uma biblioteca do SharePoint do grupo, sincronizada pelo OneDrive, chamada <span class="code">${PASTA_COMUM}</span>. Se for esta, a ferramenta cria <span class="code">grupo/financas/</span> e <span class="code">times/</span>.</p>`, [['no', 'Escolher outra'], ['ok', 'É esta, criar', 'pri']]);
    if (r !== 'ok') return false;
  }
  raiz = h; await subpasta(raiz, ['grupo', 'financas'], true); await subpasta(raiz, ['times'], true);
  if (!await lerTexto(raiz, 'LEIA-ME.md')) { try { await gravarSeguro(raiz, 'LEIA-ME.md', LEIA_ME()); } catch {} }
  db.pastaComum = h.name; agendarSalvar();
  if (!navigator.webdriver) kv.set('fin-grupo-raiz:' + db.grupo.slug, h);
  clearInterval(pollT); pollT = setInterval(() => lerPasta(true), 60000);
  await lerPasta(silencioso);
  return true;
}
const LEIA_ME = () => `# ${PASTA_COMUM}\n\nPasta compartilhada da solução de gestão (sincronizada pelo OneDrive). **Tudo aqui é cifrado**; não há chaves nem senhas nesta pasta.\n\n- grupo/financas/diretriz-<time>.json: só a ferramenta Finanças do Grupo escreve.\n- times/<time>/financas/plano.json: só o responsável financeiro do time escreve.\n- Arquivos com nome de computador no final (ex.: plano-NOTEBOOK01.json) são cópias de conflito do OneDrive: as ferramentas resolvem sozinhas.\n- Não edite nem renomeie os arquivos à mão.\n`;
document.addEventListener('visibilitychange', () => { if (!document.hidden && raiz) lerPasta(true); });
async function lerPasta(silencioso = false) {
  if (!raiz) return;
  pendentes = []; saude = {};
  for (const t of db.times) {
    const s = saude[t.slug] = { avisos: [], copias: [] };
    const ch = await chavesDoTime(t);
    if (!ch.size) { s.avisos.push('sem chave de finanças'); continue; }
    const dir = await subpasta(raiz, ['times', t.slug, 'financas'], false);
    if (!dir) { s.avisos.push('ainda não publicou'); continue; }
    const r = await lerEnvelopes(dir, 'plano', ch, { team: t.slug, content: PLANO_SCHEMA });
    s.copias = r.copias.map(c => c.nome);
    if (r.copias.length) s.avisos.push(`${r.copias.length} cópia(s) de conflito do OneDrive (vale a de maior revisão)`);
    const inval = r.invalidos.find(x => x.principal);
    if (inval && !r.melhor) s.avisos.push('arquivo não abre: ' + inval.erro);
    if (!r.melhor) { if (!inval) s.avisos.push('ainda não publicou'); continue; }
    const p = r.melhor.payload, atual = db.retratos[t.slug]?.payload;
    if (atual && p.revision < atual.revision) { s.avisos.push(`arquivo na pasta (rev. ${p.revision}) é mais antigo que o já lido (rev. ${atual.revision}): ignorado`); continue; }
    if (atual && p.revision === atual.revision && p.generatedAt === atual.generatedAt) continue;
    if (p.fiscalYear !== db.ano) s.avisos.push(`plano do ano ${p.fiscalYear} (grupo está em ${db.ano}): não entra na soma`);
    if (p.currency !== db.moeda) s.avisos.push(`moeda ${p.currency} diferente de ${db.moeda}: não entra na soma`);
    pendentes.push({ t, p, de: r.melhor.nome });
  }
  for (const t of db.times) {
    const r = db.retratos[t.slug]; if (!r) continue; const s = saude[t.slug] ??= { avisos: [] };
    const dias = (Date.now() - new Date(r.payload.generatedAt).getTime()) / 864e5;
    if (dias > 35) s.avisos.push(`plano sem atualização há ${Math.floor(dias)} dias`);
    const fora = (r.payload.lines || []).filter(l => !catPorId(l.category)).length;
    if (fora) s.avisos.push(`${fora} linha(s) com categoria fora da lista do grupo (somadas em "Outras")`);
  }
  if (!silencioso) toast(pendentes.length ? `${pendentes.length} plano(s) novo(s) para revisar.` : 'Pasta lida. Nada novo.');
  render();
}
function diffPlano(antes, depois) {
  const a = totaisPlano(antes), b = totaisPlano(depois), out = [];
  const porLinha = p => Object.fromEntries((p?.lines || []).map(l => [l.id, l]));
  const la = porLinha(antes), lb = porLinha(depois), anual = l => { let s = 0; for (const m of mesesAno()) s += +l?.months?.[m]?.forecast || 0; return s; };
  for (const id of new Set([...Object.keys(la), ...Object.keys(lb)])) {
    const va = anual(la[id]), vb = anual(lb[id]);
    if (!la[id]) out.push(`nova linha "${lb[id].name}" (${fm(vb)} no ano)`);
    else if (!lb[id]) out.push(`linha removida "${la[id].name}" (${fm(va)})`);
    else if (va !== vb) out.push(`"${lb[id].name}": previsto ${fm(va)} → ${fm(vb)}`);
  }
  const fechAntes = antes?.closedMonths || [], novos = (depois.closedMonths || []).filter(m => !fechAntes.includes(m));
  if (novos.length) out.push(`fechou ${novos.map(nomeMes).join(', ')}`);
  return { a, b, linhas: out };
}
function aplicar(slug) {
  for (const x of pendentes.filter(x => !slug || x.t.slug === slug)) db.retratos[x.t.slug] = { payload: x.p, lidoEm: new Date().toISOString(), de: x.de };
  pendentes = pendentes.filter(x => slug && x.t.slug !== slug);
  agendarSalvar(); toast('Consolidado atualizado.');
}

/* -------------------------- diretrizes e chaves -------------------------- */
function montarDiretriz(t, meta) {
  return { schema: DIRETRIZ_SCHEMA, ...meta, source: { group: db.grupo.slug, tool: TOOL, toolVersion: TOOL_VERSION },
    team: { name: t.nome, slug: t.slug }, fiscalYear: db.ano, currency: db.moeda,
    categories: db.categorias.map(c => ({ id: c.id, name: c.nome, kind: c.tipo })), costCenters: db.centros,
    caps: Object.fromEntries(Object.entries(t.teto.caps || {}).filter(([, v]) => v > 0)), capTotal: t.teto.total || undefined,
    planVersion: db.versaoAtual || 'Orçamento original', publishBy: t.publishBy || undefined, closingDay: db.diaFechamento || undefined, note: t.nota ? clamp(t.nota, 500) : undefined };
}
async function publicarDiretriz(t, assumir = false) {
  if (!raiz) return toast('Ligue a pasta sincronizada primeiro.');
  const c = chaveAtualTexto(t); if (!c) return toast(`Gere a chave de finanças do time ${t.nome} primeiro.`);
  const k = lerChaveTexto(c.texto), dir = await subpasta(raiz, ['grupo', 'financas'], true);
  try {
    const r = await publicarUnico({ dir, base: `diretriz-${t.slug}`, chave: { kid: k.kid, key: await importarChave(k.raw) }, team: t.slug, writer: writer(), assumir, ultimaRevisao: t.diretriz.revision || 0,
      montar: { schema: DIRETRIZ_SCHEMA, payload: meta => montarDiretriz(t, meta) } });
    t.diretriz = { revision: r.revision, em: r.generatedAt }; agendarSalvar();
    toast(`Diretriz publicada para ${t.nome} (revisão ${r.revision}).`);
  } catch (e) {
    if ((e.code === 'DONO' || e.code === 'DISPOSITIVO') && await perguntar('Assumir a publicação?', `<p>${esc(e.message)}</p><p class="small muted">Cada arquivo comum tem um único dono. Assuma só se você trocou de computador ou combinou com o outro dono.</p>`, [['no', 'Cancelar'], ['ok', 'Assumir e publicar', 'pri']]) === 'ok') return publicarDiretriz(t, true);
    if (e.code !== 'DONO' && e.code !== 'DISPOSITIVO') toast('Não foi possível publicar: ' + e.message, 6000);
  }
}
async function gerarChave(t) {
  const kid = `${t.slug}-fin-${String(new Date().getFullYear()).slice(2)}${pad2(new Date().getMonth() + 1)}`;
  const kidFinal = t.chaves.some(c => c.kid === kid) ? kid + '-' + (t.chaves.length + 1) : kid;
  const texto = gerarChaveTexto(kidFinal);
  if (!await avisoCofre('chave', `<p class="small">Chave de finanças do time <b>${esc(t.nome)}</b> (diferente da chave de tarefas e da sua senha):</p><input class="sin code" style="width:100%" readonly value="${esc(texto)}" onclick="this.select()"><div class="row" style="margin-top:6px"><button class="btn sm" onclick="navigator.clipboard?.writeText('${texto}');toast('Chave copiada.')">Copiar</button></div>`)) return false;
  t.chaves.push({ kid: kidFinal, texto, em: new Date().toISOString() }); agendarSalvar();
  return true;
}
async function revogarChave(t) {
  if (await perguntar('Revogar a chave?', `<div class="cofre">Use só se a chave vazou. Arquivos com a chave antiga deixam de ser aceitos na hora. Você vai gerar uma nova e enviar ao time, e o time publica de novo.</div>`, [['no', 'Cancelar'], ['ok', 'Revogar e gerar nova', 'danger']]) !== 'ok') return;
  for (const c of t.chaves) c.revogada = c.revogada || new Date().toISOString();
  if (await gerarChave(t) && raiz) await publicarDiretriz(t);
}
async function htmlDoTime(t) {
  const c = chaveAtualTexto(t);
  const r = await perguntar(`Finanças do Time para ${t.nome}`, `<p>Gera o HTML das Finanças do Time já configurado para <b>${esc(t.nome)}</b> (nome, identificador, ano, moeda, categorias e centros de custo do grupo).</p>
    <label class="row"><input type="checkbox" id="hCh" ${c ? '' : 'disabled'}> <span>Incluir a chave de finanças do time no HTML ${c ? '' : '<span class="faint">(gere a chave antes)</span>'}</span></label>
    <p class="small muted">Sem a chave, o responsável cola a chave que você enviar por mensagem direta. Com a chave, o arquivo vira um segredo e deve ir só por mensagem direta ou e-mail.</p>`, [['no', 'Cancelar'], ['ok', 'Gerar HTML', 'pri']]);
  if (r !== 'ok') return;
  const comChave = !!document.getElementById('hCh')?.checked;
  return gerarHtmlTime(t, comChave);
}
async function gerarHtmlTime(t, comChave) {
  if (comChave && !await avisoCofre('html')) return;
  const c = chaveAtualTexto(t);
  const preset = { schema: 'financas-preset/1', team: { nome: t.nome, slug: t.slug, prefixo: t.prefixo || '' }, ano: db.ano, moeda: db.moeda,
    categorias: db.categorias.map(x => ({ id: x.id, nome: x.nome, tipo: x.tipo })), centros: db.centros, pasta: db.pastaComum || PASTA_COMUM, chave: comChave && c ? c.texto : undefined, contato: db.pessoa.nome, geradoEm: new Date().toISOString() };
  let html; try { html = aplicarPreset(await lerEmbutido('finTimeEmb'), 'FIN-PRESET', preset); } catch (e) { return toast(e.message, 6000); }
  baixar(`financas_${t.slug}.html`, html, 'text/html');
  toast(comChave ? 'HTML baixado com a chave. Envie só por mensagem direta.' : 'HTML baixado. Envie a chave separadamente por mensagem direta.', 6000);
}

/* ------------------------------- interface ------------------------------- */
const ICONES = {
  consolidado: '<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>',
  revisar: '<svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>',
  times: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M17 11a3 3 0 1 0 0-6M21 20c0-2.5-1.5-4-4-4.6"/></svg>',
  versoes: '<svg viewBox="0 0 24 24"><path d="M12 8v5l3 2"/><circle cx="12" cy="12" r="9"/></svg>',
  ajustes: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>'
};
const NAV = [['consolidado', 'Consolidado'], ['revisar', 'Ler pasta'], ['times', 'Times'], ['versoes', 'Versões'], ['ajustes', 'Ajustes']];
function render() {
  if (!db) return;
  $('#app').innerHTML = `<nav class="rail"><div class="logo">GRP</div>${NAV.map(([k, n]) => `<button class="nv ${view === k ? 'on' : ''}" data-v="${k}">${ICONES[k]}${n}${k === 'revisar' && pendentes.length ? `<span class="b">${pendentes.length}</span>` : ''}</button>`).join('')}</nav>
    <main class="main"><header class="top" id="topo"></header><div id="pg"></div></main>`;
  $$('.nv').forEach(b => b.onclick = () => { view = b.dataset.v; render(); });
  renderTopo();
  ({ consolidado: vCons, revisar: vRevisar, times: vTimes, versoes: vVersoes, ajustes: vAjustes })[view]($('#pg'));
}
function renderTopo() {
  const t = $('#topo'); if (!t) return;
  t.innerHTML = `<div><h1>${esc(NAV.find(n => n[0] === view)[1])}</h1><div class="sub">${esc(db.grupo.nome)} · ${db.ano} · ${esc(db.moeda)}</div></div><span class="grow"></span>
    <span class="pill"><span class="led ${sujo || salvando ? 'wait' : ''}"></span>${sujo || salvando ? 'Salvando…' : 'Salvo e cifrado'}</span>
    <button class="pill" id="tPasta"><span class="led ${raiz ? '' : 'wait'}"></span>${raiz ? 'Pasta ligada' : 'Ligar pasta'}</button>
    ${raiz ? '<button class="btn" id="tLer">Ler pasta</button>' : ''}<button class="btn ghost" id="tOnde">Onde estou?</button>`;
  $('#tPasta').onclick = async () => { try { await ligarPasta(await escolherPasta('fin-comum')); } catch (e) { if (e.name !== 'AbortError') toast(e.message); } };
  if ($('#tLer')) $('#tLer').onclick = () => lerPasta();
  $('#tOnde').onclick = () => ondeEstou({ ferramenta: TOOL_NOME, versao: TOOL_VERSION, arquivo, pastaLocal: dirLocal?.name, pastaComum: raiz?.name, writer: writer(),
    local: ['Orçamento aprovado do grupo e itens do grupo', 'Chaves de finanças de cada time', 'Retratos lidos dos times e versões do plano', 'Cópias de segurança em backup/'],
    comum: ['grupo/financas/diretriz-<time>.json (tetos, categorias, prazos)', 'Leitura de times/<time>/financas/plano.json'] });
}
const kpi = (r, v, c = '') => `<div class="kpi ${c}"><span>${r}</span><b>${v}</b></div>`;

/* --- Consolidado --- */
function vCons(el) {
  const c = consolidado(), y = consolidado(ytd()), orc = db.orcamento.total || 0;
  const semPlano = db.times.filter(t => !db.retratos[t.slug]);
  const dims = { time: 'Por time', categoria: 'Por categoria', iniciativa: 'Por iniciativa', tipo: 'OPEX × CAPEX' };
  el.innerHTML = `${pendentes.length ? `<div class="banner">${pendentes.length} plano(s) novo(s) na pasta. <button class="btn sm pri" id="cRev">Revisar</button></div>` : ''}
    ${semPlano.length && db.times.length ? `<div class="banner warn">Sem plano: ${semPlano.map(t => esc(t.nome)).join(', ')}.</div>` : ''}
    <div class="kpis">${kpi('Orçamento aprovado do grupo', orc ? fm(orc) : '<span class="faint">definir</span>')}${kpi('Orçado (times + grupo)', fm(c.total.orcado), orc && c.total.orcado > orc ? 'alert' : '')}
      ${kpi('Previsto no ano', fm(c.total.previsto), orc && c.total.previsto > orc ? 'alert' : '')}${kpi('Realizado até ' + nomeMes(mesAtual()), fm(y.total.realizado))}
      ${kpi('Saldo previsto', orc ? fm(orc - c.total.previsto) : '—', orc && orc - c.total.previsto < 0 ? 'alert' : '')}</div>
    <div class="card"><div class="row"><div class="sg">${Object.entries(dims).map(([k, n]) => `<button class="${agrupar === k ? 'on' : ''}" data-g="${k}">${n}</button>`).join('')}</div><span class="grow"></span><button class="btn sm" id="cCsv">Exportar CSV</button></div>
      <div style="margin-top:12px">${tabelaAgrupada(agrupar)}</div></div>
    <div class="card"><p class="lbl">Previsto por mês, empilhado por time</p>${graficoTimes()}</div>`;
  if ($('#cRev')) $('#cRev').onclick = () => { view = 'revisar'; render(); };
  $$('[data-g]', el).forEach(b => b.onclick = () => { agrupar = b.dataset.g; render(); });
  $('#cCsv').onclick = exportarCsv;

function graficoTimes() {

      <div class="row"><input class="sin grow" id="gNC" placeholder="Nova categoria"><button class="btn" id="gNCb">Adicionar</button></div><p class="small muted">Linhas dos times com categoria fora desta lista são somadas em "Outras" e aparecem na saúde da soma.</p></div>
    <div class="card"><p class="lbl">Segurança</p><p class="small">Arquivo <span class="code">${esc(arquivo)}</span> cifrado com a sua senha. As chaves dos times ficam dentro dele.</p>
      <div class="row"><button class="btn" id="gSenha">Trocar senha</button><button class="btn" id="gBk">Baixar cópia cifrada</button></div>
      <p class="small muted">A pasta local guarda as 5 últimas versões em <span class="code">backup/</span>; baixe uma cópia cifrada de vez em quando.</p></div></div>`;
  $('#gN').onchange = e => { db.grupo.nome = clamp(e.target.value.trim(), 80) || db.grupo.nome; agendarSalvar(); };
  $('#gA').onchange = e => { const a = +e.target.value; if (a > 2000 && a < 2100) { db.ano = a; agendarSalvar(); } };
  $('#gO').onchange = e => { db.orcamento.total = parseValor(e.target.value) || 0; agendarSalvar(); };
  $('#gV').onchange = e => { db.versaoAtual = clamp(e.target.value.trim(), 40); agendarSalvar(); };
  $('#gC').onchange = e => { db.centros = e.target.value.split('\n').map(x => clamp(x.trim(), 40)).filter(Boolean); agendarSalvar(); };
  $('#gItem').onclick = () => { db.itens.push({ id: uid('I'), nome: 'Reserva do grupo', cat: 'outras', orcado: {} }); agendarSalvar(); };
  $$('[data-in]', el).forEach(i => i.onchange = () => { db.itens.find(x => x.id === i.dataset.in).nome = clamp(i.value, 80); agendarSalvar(); });
  $$('[data-ic]', el).forEach(i => i.onchange = () => { db.itens.find(x => x.id === i.dataset.ic).cat = i.value; agendarSalvar(); });
  $$('[data-iv]', el).forEach(i => i.onchange = () => { const it = db.itens.find(x => x.id === i.dataset.iv), val = parseValor(i.value) || 0; it.orcado = Object.fromEntries(mesesAno().map(m => [m, val])); agendarSalvar(); });
  $$('[data-ix]', el).forEach(b => b.onclick = () => { db.itens = db.itens.filter(x => x.id !== b.dataset.ix); agendarSalvar(); });
  $$('[data-cn]', el).forEach(i => i.onchange = () => { catPorId(i.dataset.cn).nome = clamp(i.value.trim(), 60); agendarSalvar(); });
  $$('[data-ct]', el).forEach(i => i.onchange = () => { catPorId(i.dataset.ct).tipo = i.value; agendarSalvar(); });
  $('#gNCb').onclick = () => { const n = $('#gNC').value.trim(), id = slugify(n); if (!id || catPorId(id)) return; db.categorias.push({ id, nome: clamp(n, 60), tipo: 'OPEX' }); agendarSalvar(); };
  $('#gSenha').onclick = async () => { const s = await criarSenhaDlg('Nova senha do arquivo'); if (!s) return; ctx = await novoCtx(s, TOOL); db.seg = { cofreConfirmadoEm: new Date().toISOString() }; await salvar(); toast('Senha trocada.'); };
  $('#gBk').onclick = async () => baixar(arquivo.replace(/\.json$/, '') + '-copia-' + hojeISO() + '.json', await cifrarLocal(db, ctx));
}

/* ---------------------------- abertura e criação ---------------------------- */
function telaInicial(msg = '') {
  $('#app').innerHTML = `<div class="welcome"><div class="card">
    <div class="row"><div class="logo" style="margin:0">GRP</div><div><h2 style="margin:0">Finanças do Grupo</h2><div class="small muted">Consolidado dos planos financeiros dos times</div></div></div>
    ${msg ? `<div class="banner warn" style="margin-top:12px">${esc(msg)}</div>` : ''}
    <p class="lbl" style="margin-top:20px">É a primeira vez?</p>
    <button class="opt" id="iNovo"><b>Criar o arquivo do grupo</b><span>Pasta local fora do OneDrive, senha guardada no cofre, depois times e chaves.</span></button>
    <p class="lbl" style="margin-top:16px">Já tenho o arquivo</p>
    <button class="opt" id="iAbrir"><b>Abrir a pasta local</b><span>Onde está <span class="code">financas-grupo-&lt;nome&gt;.json</span>.</span></button>
    ${temFS() ? '' : '<div class="banner warn">Abra no Microsoft Edge ou no Google Chrome.</div>'}
  </div></div>`;
  $('#iNovo').onclick = criarDlg; $('#iAbrir').onclick = abrirPasta;
}
async function abrirPasta() {
  let h; try { h = await escolherPasta('fin-local'); } catch (e) { return; }
  if (!await permissao(h)) return;
  const cand = [];
  for await (const [n, f] of h.entries()) if (f.kind === 'file' && /^financas-grupo-.*\.json$/.test(n)) { try { const o = JSON.parse(await (await f.getFile()).text()); if (o.schema === LOCAL_ENC && o.app === TOOL) cand.push(n); } catch {} }
  if (!cand.length) return telaInicial('Não encontrei um arquivo das Finanças do Grupo nesta pasta.');
  let nome = cand[0];
  if (cand.length > 1) { const r = await perguntar('Qual arquivo?', cand.map((n, i) => `<button class="opt" data-r="${i}"><b class="code">${esc(n)}</b></button>`).join(''), [['no', 'Cancelar']]); if (r == null || r === 'no') return; nome = cand[+r]; }
  await abrirArquivo(h, nome);
}
async function abrirArquivo(h, nome) {
  const texto = await lerTexto(h, nome);
  for (let i = 0; i < 3 && !db; i++) {
    const s = await pedirSenhaDlg('Senha das Finanças do Grupo', i > 0); if (s == null) return;
    try { const r = await decifrarLocal(texto, s); db = normalizar(r.dados); ctx = r.ctx; dirLocal = h; arquivo = nome; } catch (e) { if (e.code !== 'SENHA') return telaInicial(e.message); }
  }
  if (!db) return telaInicial('Senha incorreta três vezes.');
  await aposAbrir();
}
async function aposAbrir() {
  render();
  if (await lembreteTesteSenha(db.seg, ctx)) agendarSalvar();
  if (!navigator.webdriver) { const h = await kv.get('fin-grupo-raiz:' + db.grupo.slug); if (h && await permissao(h, false)) await ligarPasta(h, true); }
}
async function criarDlg() {
  const p = PRESET || {};
  const d = modal(`<div class="mh"><h2>Criar o arquivo do grupo</h2></div><div class="mb">
    <label class="field"><span>Nome do grupo</span><input class="sin" id="cN" value="${esc(p.grupo?.nome || '')}"></label>
    <div class="f2"><label class="field"><span>Ano fiscal</span><input class="sin" type="number" id="cA" value="${p.ano || new Date().getFullYear()}"></label><label class="field"><span>Moeda</span><select class="sel" id="cM"><option>BRL</option><option>USD</option><option>EUR</option></select></label></div>
    <label class="field"><span>Seu nome</span><input class="sin" id="cP" value="${esc(p.pessoa || '')}"></label></div>
    <div class="mf"><button class="btn" id="cNo">Cancelar</button><button class="btn pri" id="cOk">Escolher pasta local</button></div>`);
  $('#cNo', d).onclick = fecharModal;
  $('#cOk', d).onclick = async () => {
    const nome = $('#cN', d).value.trim(), pessoa = $('#cP', d).value.trim(), ano = +$('#cA', d).value, moeda = $('#cM', d).value;
    if (!nome || !pessoa) return toast('Preencha o nome do grupo e o seu nome.');
    fecharModal();
    if (!await criarArquivo({ nome, pessoa, ano, moeda })) telaInicial();
  };
}
async function escolherPastaLocal() {
  await perguntar('Pasta local', `<p>Escolha uma pasta <b>deste computador</b> que <b>não</b> esteja no OneDrive.</p><div class="banner warn">Com o backup de pastas do OneDrive ligado, <b>Documentos</b> e <b>Área de Trabalho</b> também sincronizam. Prefira algo como <span class="code">C:\\Users\\voce\\GestaoLocal</span>.</div>`, [['ok', 'Escolher pasta', 'pri']]);
  let h; try { h = await escolherPasta('fin-local'); } catch { return null; }
  if (!await permissao(h)) return null;
  const s = await suspeitaDeSincronizada(h);
  if (s.length) { if (await perguntar('Esta pasta parece sincronizada', `<div class="cofre">A pasta <b>${esc(h.name)}</b> ${esc(s.join(', '))}.</div>`, [['no', 'Escolher outra'], ['ok', 'Usar mesmo assim']]) !== 'ok') return escolherPastaLocal(); }
  else if (await perguntar('Confirme', `<p>Você conferiu que <b class="code">${esc(h.name)}</b> não está no OneDrive?</p>`, [['no', 'Escolher outra'], ['ok', 'Conferi, não está', 'pri']]) !== 'ok') return escolherPastaLocal();
  return h;
}
async function criarArquivo({ nome, pessoa, ano, moeda, dir, senha, times = [] }) {
  const h = dir || await escolherPastaLocal(); if (!h) return false;
  const nomeArq = `financas-grupo-${slugify(nome)}.json`;
  if (await lerTexto(h, nomeArq)) { if (await perguntar('Arquivo já existe', `<p>Já existe <span class="code">${esc(nomeArq)}</span>. Abrir?</p>`, [['no', 'Cancelar'], ['ok', 'Abrir', 'pri']]) === 'ok') { await abrirArquivo(h, nomeArq); return true; } return false; }
  senha ??= await criarSenhaDlg(); if (!senha) return false;
  db = novoDb({ nome, ano, moeda, pessoa }); db.seg.cofreConfirmadoEm = new Date().toISOString();
  for (const t of times) db.times.push({ nome: t.nome, slug: t.slug, prefixo: t.prefixo || '', chaves: [], teto: { total: 0, caps: {} }, diretriz: {} });
  ctx = await novoCtx(senha, TOOL); dirLocal = h; arquivo = nomeArq;
  await gravarLocal(h, nomeArq, await cifrarLocal(db, ctx));
  view = 'times'; await aposAbrir();
  toast('Arquivo do grupo criado e cifrado. Cadastre os times e gere as chaves.', 5000);
  return true;
}
telaInicial();
</script>

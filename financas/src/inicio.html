<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Início da solução</title>
<style>
/*NUCLEO-CSS*/
.wz{max-width:720px;margin:6vh auto 80px;padding:0 20px}
.wz .card{padding:26px 28px}
.wz h1{font-family:var(--title);font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
.combo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.res:last-child{border:0}
.res .ic{width:28px;height:28px;border-radius:8px;background:var(--bv-soft);color:var(--bv);display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}
/* 2.1: como funciona, Estou com sorte e checklist */
.ilus{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.ilu{border:1px solid var(--line);border-radius:14px;padding:12px 14px 13px;font-size:12.5px;color:var(--muted);background:#fff}
.ilu h4{margin:8px 0 3px;color:var(--ink);font-size:13.5px;letter-spacing:-.01em}.ilu p{margin:0}
.ilu svg,.mapa-svg{width:100%;height:auto;display:block}
.ilu .s1,.mapa-svg .s1{stroke:var(--bv);fill:none;stroke-width:1.6}.ilu .sl,.mapa-svg .sl{stroke:#c7ccda;fill:none;stroke-width:1.4}
.ilu .f1,.mapa-svg .f1{fill:var(--bv-soft)}.ilu .f2,.mapa-svg .f2{fill:var(--bv)}.ilu .fw,.mapa-svg .fw{fill:#fff}
.ilu .t,.mapa-svg .t{fill:var(--ink);font-size:11px;font-weight:600}.ilu .tm,.mapa-svg .tm{fill:var(--muted);font-size:10px}.ilu .tb{fill:var(--bv);font-size:15px;font-weight:700}.ilu .tx{fill:#9aa1b4;font-size:10px;font-family:ui-monospace,Consolas,monospace}
.sorte{margin:4px 0 6px;border:1px solid var(--bv-line);background:linear-gradient(160deg,#fff 0%,var(--bv-soft) 100%);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:center}
.sorte .grow{font-size:12.5px;color:var(--muted)}.sorte b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}.ck:last-child{border-bottom:0}
.ck input{margin-top:3px;accent-color:var(--bv);width:16px;height:16px;flex:none}.ck small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.ck.on>span>span{color:var(--faint);text-decoration:line-through}
.tk{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}.tk:last-child{border-bottom:0}
@media (max-width:720px){.combo{grid-template-columns:1fr}.ilus{grid-template-columns:1fr}.sorte{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="wz"><div class="card" id="wz"></div><p class="small muted" style="text-align:center;margin-top:14px">Início da solução <span id="ver"></span> · nada sai do seu computador: as ferramentas são arquivos HTML e os dados ficam em arquivos cifrados.</p></div>
<dialog id="dlg"></dialog>
<script>
/*NUCLEO-JS*/
</script>
<script>
/* =====================================================================
   Início da solução · assistente
   Pergunta o uso esperado, cria o primeiro arquivo (sempre cifrado), gera os HTMLs
   desacoplados de cada uso e o cartão "Onde fica cada coisa".
   ===================================================================== */
const TOOL_NOME = 'Início da solução', TOOL_VERSION = '2.1.0';
$('#ver').textContent = TOOL_VERSION;
const st = { modo: '', sp: 0, sorteTimes: [], passo: 0, papel: '', usos: [], dados: {}, dirLocal: null, raiz: null, senha: null, criados: [], temChave: null, chaves: [], kErr: '', pastaDoLider: '', cofreChaves: false };
// Perfil: quem lidera, se quer finanças e tarefas, e se o líder já mandou chaves e a pasta.
const PAPEIS = [
  ['gestor', 'Sim, lidero 2 ou mais times', 'Você acompanha um grupo: consolida tarefas e finanças dos seus times e gera as chaves deles.'],
  ['responsavel', 'Sim, lidero 1 time', 'Você cuida do dia a dia de um time: quadro de tarefas e, se quiser, o plano financeiro.'],
  ['membro', 'Não, faço parte de um time', 'Você usa o quadro de tarefas do time.']
];
const USOS = [['tarefas', 'Tarefas', 'Iniciativas, quadro, backlog e acompanhamento.'], ['financas', 'Finanças', 'Orçado, previsto e realizado; contratos; previsão de vários anos.'], ['ferias', 'Férias', 'Quem está fora e quando; dias com muita gente fora no time e no grupo.']];
// O que cada combinação gera. Cada HTML é desacoplado e tem o próprio arquivo de dados.
function plano() {
  const g = st.papel === 'gestor', out = [{ id: 'hb', nome: 'Hub da solução', desc: 'Tela inicial do dia a dia: abre as outras ferramentas, mostra os times e deixa post-its.', html: 'hub.html' }];
  if (st.usos.includes('financas')) out.push(g ? { id: 'fg', nome: 'Finanças do Grupo', desc: 'Consolidado: soma os planos publicados pelos times.', html: 'financas_grupo.html' }
                                             : { id: 'ft', nome: 'Finanças do Time', desc: 'Dia a dia e futuro das finanças do time.', html: `financas_${st.dados.slug || '<time>'}.html` });
  if (st.usos.includes('tarefas')) out.push(g ? { id: 'ct', nome: 'Central de Gestão', desc: 'Tarefas consolidado: iniciativas, times, rituais e pessoas.', html: 'gestao_pessoal.html' }
                                            : { id: 'qt', nome: 'Quadro do Time', desc: 'Tarefas de um time: quadro, backlog, sprints e métricas.', html: `quadro_${st.dados.slug || '<time>'}.html` });
  if (st.usos.includes('ferias')) out.push({ id: 'fe', nome: 'Mapa de Férias', desc: g ? 'Soma as férias dos seus times e mostra onde há mais e menos gente fora.' : 'Férias do time: cada pessoa marca as suas e o time vê os picos.', html: 'ferias.html' });
  return out;
}
// Chaves coladas: o kid diz o que cada uma é. "<time>-AAMM" é de tarefas; "<time>-fin-AAMM" é de finanças.
// Para quem lidera vários times, uma chave de finanças vem da liderança (nível acima: grupos/<grupo>/financas/).
function classificarChave(texto) {
  const k = lerChaveTexto(texto), m = /^(.+?)(-fin)?-\d{4}(?:-\d+)?$/.exec(k.kid) || [null, k.kid, ''];
  const fin = !!m[2], slug = m[1], g = st.papel === 'gestor';
  let papel = fin ? (g ? 'acima' : 'fin') : 'tarefas', aviso = '';
  if (g && !fin) aviso = 'Chave de tarefas de um time. Como você lidera vários times, as chaves deles são geradas por você na Central; esta será ignorada.';
  if (!g && fin && st.papel === 'membro') aviso = 'Chave de finanças: as finanças do time ficam com quem lidera o time. Será ignorada.';
  if (!g && fin && !st.usos.includes('financas')) aviso = 'Chave de finanças, mas você não marcou Finanças. Será ignorada.';
  if (!g && !fin && !st.usos.includes('tarefas') && !st.usos.includes('ferias')) aviso = 'Chave de tarefas, mas você não marcou Tarefas nem Férias. Será guardada só no hub, para post-its.';
  return { texto: texto.trim(), kid: k.kid, slug, tipo: fin ? 'fin' : 'tarefas', papel, aviso, ignorar: /ignorada/.test(aviso) };
}
const chavesUteis = () => st.chaves.filter(c => !c.ignorar);
const slugAcima = () => chavesUteis().find(c => c.papel === 'acima')?.slug || '';
const slugDasChaves = () => { const s = [...new Set(chavesUteis().filter(c => c.papel !== 'acima').map(c => c.slug))]; return s.length === 1 ? s[0] : ''; };
const ROTULO = { tarefas: 'Tarefas do time', fin: 'Finanças do time', acima: 'Finanças do nível acima (liderança)' };
// Como a solução funciona: quatro desenhos simples, sem dados.
const ILU = [
  { h: 'O HTML é a ferramenta; o JSON é o seu caderno', p: 'O HTML não guarda nada e pode ser trocado por uma versão nova. Seus dados ficam num arquivo .json separado, trancado com a sua senha.',
    svg: `<svg viewBox="0 0 240 104" aria-hidden="true"><rect class="s1 f1" x="22" y="8" width="62" height="74" rx="7"/><text class="tb" x="53" y="51" text-anchor="middle">&lt;/&gt;</text><text class="tm" x="53" y="98" text-anchor="middle">ferramenta.html</text>
      <path class="sl" d="M92 45H146"/><path class="sl" d="M140 40l6 5l-6 5"/><text class="tm" x="119" y="37" text-anchor="middle">abre e grava</text>
      <rect class="s1" x="156" y="8" width="62" height="74" rx="7"/><path class="s1" d="M181 46v-6a6 6 0 0 1 12 0v6"/><rect class="f2" x="176" y="45" width="22" height="17" rx="3"/><text class="tm" x="187" y="98" text-anchor="middle">seus-dados.json</text></svg>` },
  { h: 'A chave é um idioma que só vocês dois falam', p: 'O que vai para a pasta compartilhada é escrito nesse idioma. Quem tem a chave lê; para qualquer outra pessoa, é texto embaralhado. Cada time tem a sua chave, e a de finanças é outra.',
    svg: `<svg viewBox="0 0 240 104" aria-hidden="true"><circle class="s1 f1" cx="28" cy="34" r="10"/><path class="s1" d="M12 66c2-12 8-17 16-17s14 5 16 17"/><text class="tm" x="28" y="84" text-anchor="middle">você</text>
      <rect class="s1 fw" x="50" y="10" width="34" height="18" rx="9"/><text class="t" x="67" y="23" text-anchor="middle">Olá</text>
      <rect class="sl fw" x="92" y="26" width="56" height="44" rx="6"/><text class="tx" x="120" y="44" text-anchor="middle">x7#qL9</text><text class="tx" x="120" y="58" text-anchor="middle">@k2!vR</text><text class="tm" x="120" y="84" text-anchor="middle">a pasta só vê isto</text>
      <path class="sl" d="M62 48H88"/><path class="sl" d="M152 48H178"/><path class="sl" d="M172 43l6 5l-6 5"/>
      <circle class="s1 f1" cx="212" cy="34" r="10"/><path class="s1" d="M196 66c2-12 8-17 16-17s14 5 16 17"/><text class="tm" x="212" y="84" text-anchor="middle">seu time</text>
      <rect class="s1 fw" x="156" y="10" width="34" height="18" rx="9"/><text class="t" x="173" y="23" text-anchor="middle">Olá</text><text class="tm" x="120" y="100" text-anchor="middle">GK1.pagamentos-2611.…</text></svg>` },
  { h: 'Quem lidera 1 time ou vários', p: 'Quem lidera 1 time cuida do quadro e das finanças do time e publica para o gestor. Quem lidera vários times gera as chaves deles, soma o que publicam e, se a liderança também usa a solução, publica o consolidado para ela.',
    svg: `<svg viewBox="0 0 240 104" aria-hidden="true"><rect class="sl fw" x="84" y="4" width="72" height="20" rx="6"/><text class="tm" x="120" y="17" text-anchor="middle">liderança</text>
      <path class="sl" d="M120 24V38"/><rect class="s1 f1" x="56" y="38" width="128" height="22" rx="6"/><text class="t" x="120" y="53" text-anchor="middle">gestor (vários times)</text>
      <path class="sl" d="M120 60V68M40 68H200M40 68V76M120 68V76M200 68V76"/>
      <rect class="s1" x="10" y="76" width="60" height="22" rx="6"/><text class="tm" x="40" y="91" text-anchor="middle">time A</text>
      <rect class="s1" x="90" y="76" width="60" height="22" rx="6"/><text class="tm" x="120" y="91" text-anchor="middle">time B</text>
      <rect class="s1" x="170" y="76" width="60" height="22" rx="6"/><text class="tm" x="200" y="91" text-anchor="middle">time C</text></svg>` },
  { h: 'A troca de arquivos é pelo OneDrive', p: 'Uma pasta do SharePoint, sincronizada pelo OneDrive, aparece igual em todos os computadores. Cada pessoa grava só o próprio arquivo e lê o dos outros: ninguém sobrescreve ninguém. O dado individual fica fora dela.',
    svg: `<svg viewBox="0 -8 240 112" aria-hidden="true"><rect class="s1" x="8" y="44" width="54" height="34" rx="4"/><path class="s1" d="M2 84H68"/><text class="tm" x="35" y="98" text-anchor="middle">ana-notebook</text>
      <path class="s1 f1" d="M92 40a14 14 0 0 1 8-26a20 20 0 0 1 38-2a14 14 0 0 1 12 28z"/><text class="t" x="120" y="32" text-anchor="middle">pasta</text>
      <rect class="sl fw" x="84" y="52" width="72" height="16" rx="4"/><text class="tx" x="120" y="63" text-anchor="middle">ana.json</text><rect class="sl fw" x="84" y="72" width="72" height="16" rx="4"/><text class="tx" x="120" y="83" text-anchor="middle">bruno.json</text>
      <path class="sl" d="M62 56L82 48"/><path class="sl" d="M158 48L178 56"/>
      <rect class="s1" x="178" y="44" width="54" height="34" rx="4"/><path class="s1" d="M172 84H238"/><text class="tm" x="205" y="98" text-anchor="middle">bruno-desktop</text></svg>` }
];
const comoFunciona = () => `<div class="ilus">${ILU.map(x => `<div class="ilu">${x.svg}<h4>${x.h}</h4><p>${x.p}</p></div>`).join('')}</div>`;
const PASSOS = ['Boas-vindas', 'Perfil', 'Chaves', 'Dados', 'Pastas', 'Senha', 'Pronto'];
function desenhar() {
  const p = st.passo, el = $('#wz');
  const topo = `<div class="steps">${PASSOS.map((_, i) => `<i class="${i <= p ? 'on' : ''}"></i>`).join('')}</div>`;
  const nav = (proxOk = true, proxTxt = 'Continuar') => `<div class="row" style="margin-top:18px">${p > 0 && p < 6 ? '<button class="btn" id="vol">Voltar</button>' : ''}<span class="grow"></span>${p < 6 ? `<button class="btn pri" id="prox" ${proxOk ? '' : 'disabled'}>${proxTxt}</button>` : ''}</div>`;
  if (st.modo === 'sorte') return desenharSorte(el);
  if (p === 0) el.innerHTML = `${topo}<h1>Vamos montar sua solução</h1><p class="muted">Primeiro, como ela funciona em quatro desenhos. Depois, três perguntas sobre o seu perfil e, se o seu líder já mandou, a chave e a pasta.</p>
    ${comoFunciona()}
    ${temFS() ? `<div class="sorte"><div class="grow"><b>Estou com sorte</b>Lidero times e quero tudo pronto de uma vez: Central, Finanças do Grupo, Mapa de Férias, hub e, para cada time, o Quadro, o Finanças do Time e o Mapa de Férias, já com as chaves e a pasta.</div><button class="btn pri" id="sorte">Estou com sorte</button></div>` : '<div class="banner warn">Abra este arquivo no Microsoft Edge ou no Google Chrome.</div>'}
    <button class="btn ghost" id="mapa">Ver todas as ferramentas da solução</button>${nav(temFS(), 'Começar')}`;
  if (p === 1) el.innerHTML = `${topo}<h1>Seu perfil</h1>
    <p class="lbl">1 · Você lidera times?</p>
    ${PAPEIS.map(([k, n, d]) => `<button class="opt ${st.papel === k ? 'on' : ''}" data-p="${k}"><b>${n}</b><span>${d}</span></button>`).join('')}
    ${st.papel ? `<p class="lbl" style="margin-top:16px">2 · O que você quer organizar?</p>
    <div class="combo">${USOS.map(([k, n, d]) => `<button class="opt ${st.usos.includes(k) ? 'on' : ''}" data-u="${k}" ${st.papel === 'membro' && k === 'financas' ? 'disabled style="opacity:.5"' : ''}><b>${n}</b><span>${d}</span></button>`).join('')}</div>
    ${st.papel === 'membro' ? '<p class="small muted">As finanças do time ficam com quem lidera o time.</p>' : ''}` : ''}
    ${st.usos.length ? `<p class="lbl" style="margin-top:14px">Você vai receber</p>${plano().map(x => `<div class="res"><span class="ic">${x.id.toUpperCase()}</span><div><b>${x.nome}</b><br><span class="small muted">${x.desc}</span></div></div>`).join('')}` : ''}${nav(!!st.papel && st.usos.length > 0)}`;
  if (p === 2) {
    const g = st.papel === 'gestor';
    el.innerHTML = `${topo}<h1>Seu líder compartilhou chaves de integração?</h1>
    <p class="muted">${g ? 'Se a sua liderança também usa a solução, ela pode ter mandado uma <b>chave de finanças do grupo</b> para você publicar o consolidado para ela.' : 'Quem lidera o seu grupo gera uma <b>chave do time</b> (tarefas e, se for o caso, finanças) e manda por mensagem direta ou e-mail, junto com o nome da pasta sincronizada.'}</p>
    <div class="combo"><button class="opt ${st.temChave === true ? 'on' : ''}" data-k="sim"><b>Sim, recebi</b><span>Cole as chaves e a ferramenta já sai configurada.</span></button>
    <button class="opt ${st.temChave === false ? 'on' : ''}" data-k="nao"><b>Não, ainda não</b><span>Dá para colar depois, dentro de cada ferramenta.</span></button></div>
    ${st.temChave ? `<label class="field" style="margin-top:10px"><span>Chaves (uma por linha, começam com GK1.)</span><textarea class="sin code" id="kT" rows="3" placeholder="GK1.pagamentos-2611.…&#10;GK1.pagamentos-fin-2611.…">${esc(st.chaves.map(c => c.texto).join('\n'))}</textarea></label>
      <div class="row"><button class="btn sm" id="kLer">Conferir chaves</button><span class="small latec" id="kErr">${esc(st.kErr || '')}</span></div>
      ${st.chaves.map(c => `<div class="res"><span class="ic">${c.tipo === 'fin' ? 'FIN' : 'TAR'}</span><div><b>${esc(ROTULO[c.papel])}</b> · <span class="code">${esc(c.kid)}</span><br><span class="small ${c.aviso ? 'latec' : 'muted'}">${esc(c.aviso || (c.papel === 'acima' ? `Gerada pela sua liderança para o seu grupo "${c.slug}". Vai para Finanças do Grupo › Ajustes › Nível acima.` : `Time "${c.slug}". Vai pré-configurada na ferramenta do time e no hub.`))}</span></div></div>`).join('')}
      <label class="field" style="margin-top:10px"><span>Nome da pasta sincronizada que o líder indicou (opcional)</span><input class="sin" id="kP" value="${esc(st.pastaDoLider || '')}" placeholder="${PASTA_COMUM}"></label>` : ''}
    ${nav(st.temChave === false || (st.temChave === true && st.chaves.length > 0 && !st.kErr))}`;
  }
  if (p === 3) {
    const g = st.papel === 'gestor', d = st.dados, sk = slugDasChaves();
    el.innerHTML = `${topo}<h1>${g ? 'Sobre o grupo' : 'Sobre o time'}</h1>
      ${g ? `<label class="field"><span>Nome do grupo${slugAcima() ? ` · identificador <span class="code">${esc(slugAcima())}</span>, da chave da liderança` : ''}</span><input class="sin" id="dN" value="${esc(d.nome || '')}" placeholder="Ex.: Tecnologia de Pagamentos"></label>
        <label class="field"><span>Times que você lidera (um por linha: nome e, se quiser, prefixo de código)</span><textarea class="sin" id="dT" placeholder="Pagamentos PAG&#10;Cartões CAR">${esc(d.timesTxt || '')}</textarea></label>`
      : `<div class="f2"><label class="field"><span>Nome do time</span><input class="sin" id="dN" value="${esc(d.nome || '')}"></label><label class="field"><span>Identificador (pastas)${sk ? ' · veio da chave' : ''}</span><input class="sin code" id="dS" value="${esc(sk || d.slug || '')}" ${sk ? 'disabled' : ''}></label></div>
        <label class="field"><span>Prefixo de código (opcional, ex.: PAG)</span><input class="sin" id="dPx" value="${esc(d.prefixo || '')}" maxlength="5"></label>`}
      <div class="f2"><label class="field"><span>Seu nome</span><input class="sin" id="dP" value="${esc(d.pessoa || '')}"></label>
      ${st.usos.includes('financas') ? `<label class="field"><span>Ano fiscal e moeda</span><div class="row"><input class="sin" type="number" id="dA" value="${d.ano || new Date().getFullYear()}" style="width:100px"><select class="sel" id="dM"><option>BRL</option><option>USD</option><option>EUR</option></select></div></label>` : '<span></span>'}</div>
      ${nav(true)}`;
    if (!g && !sk) $('#dN').oninput = () => { $('#dS').value = slugify($('#dN').value); };
    if (g && slugAcima() && !d.nome) $('#dN').value = slugAcima().split('-').map(x => x[0].toUpperCase() + x.slice(1)).join(' ');
    if (!g && sk && !d.nome) $('#dN').value = sk.split('-').map(x => x[0].toUpperCase() + x.slice(1)).join(' ');
    if ($('#dM')) $('#dM').value = d.moeda || 'BRL';
  }
  if (p === 4) el.innerHTML = `${topo}<h1>Onde guardar</h1>
    <p class="lbl">1 · Pasta local (obrigatória)</p>
    <p class="small muted" style="margin-top:0">Fica só neste computador, <b>fora do OneDrive</b>: recebe os HTMLs e o seu arquivo de dados cifrado. Com o backup de pastas do OneDrive ligado, <b>Documentos</b> e <b>Área de Trabalho</b> também sincronizam; prefira algo como <span class="code">C:\\Users\\voce\\GestaoLocal</span>.</p>
    <div class="row"><button class="btn ${st.dirLocal ? '' : 'pri'}" id="pL">${st.dirLocal ? 'Trocar' : 'Escolher pasta local'}</button>${st.dirLocal ? `<span class="chip ok">${esc(st.dirLocal.name)}</span>` : ''}</div>
    <p class="lbl" style="margin-top:20px">2 · Pasta sincronizada pelo OneDrive ${chavesUteis().length ? '(recomendada agora)' : '(pode ser depois)'}</p>

async function cifrarCentral(obj, senha) {

}
// Formato do arquivo do Quadro (quadro-time-cifrado/1): AES-GCM com AAD = nome do formato.
async function cifrarQuadro(obj, senha) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), key = await chaveDaSenha(senha, salt), iv = crypto.getRandomValues(new Uint8Array(12));

<h2>Pasta local (${esc(st.dirLocal.name)}) · só neste computador, fora do OneDrive</h2><table>${linhas}<tr><td><code>backup/</code></td><td>As 5 últimas versões de cada arquivo de dados (cifradas).</td></tr></table>
<h2>Pasta sincronizada (${esc(st.raiz?.name || PASTA_COMUM)}) · OneDrive / SharePoint</h2><table>
<tr><td><code>grupo/financas/diretriz-&lt;time&gt;.json</code></td><td>Tetos e categorias do grupo para cada time. Só o gestor escreve.</td></tr>
<tr><td><code>times/&lt;time&gt;/financas/plano.json</code></td><td>Plano financeiro agregado do time. Só o responsável do time escreve.</td></tr>
<tr><td><code>times/&lt;time&gt;/postits/&lt;pessoa&gt;-&lt;computador&gt;.json</code></td><td>Post-its deixados pelo hub para o time (um arquivo por autor). O Quadro mostra e grava quem viu em <code>postits/vistos/</code>.</td></tr>
<tr><td><code>central/catalogo-&lt;time&gt;.json</code>, <code>times/&lt;time&gt;/status.json</code></td><td>Troca de tarefas entre a Central e o Quadro.</td></tr></table>
<h2>Regras que evitam conflito</h2><div class="g"><div>Cada arquivo comum tem <b>um único dono</b> (pessoa e computador). A ferramenta não grava no arquivo de outra pessoa.</div><div>Cópias de conflito do OneDrive (<code>plano-NOTEBOOK.json</code>, <code>plano (1).json</code>) são detectadas: vale a de maior revisão.</div><div>Gravação atômica e conferida; arquivo pela metade não decifra e é ignorado.</div><div>Trocou de computador? Abra a ferramenta no novo e escolha "Assumir a publicação".</div></div>
<h2>Se trocar de computador</h2><p>Copie a pasta local inteira (ou uma cópia cifrada baixada em Ajustes) para o novo computador, abra os HTMLs e use a senha do cofre.</p></body></html>`;
}
async function abrirCartao() {
  const t = await lerTexto(st.dirLocal, 'onde-fica-cada-coisa.html'); if (!t) return;
  const w = window.open(URL.createObjectURL(new Blob([t], { type: 'text/html' })), '_blank'); if (!w) toast('Abra o arquivo onde-fica-cada-coisa.html na pasta local.');
}
/* --------------------------- Estou com sorte --------------------------- */
// Uma tela só: grupo, times, seu nome, pasta e senha. Gera as chaves de cada time (tarefas e finanças),
// as ferramentas do gestor já com times e chaves e, em para-os-times/<time>/, o Quadro e o Finanças do Time
// de cada time já configurados com a chave e a pasta.
function desenharSorte(el) {
  const d = st.dados;
  if (st.sp === 0) {
    const ok = !!(st.dirLocal && st.senha);
    el.innerHTML = `<h1>Estou com sorte</h1><p class="muted">Preencha só o essencial. Geramos as chaves de cada time e todas as ferramentas de uma vez, já configuradas.</p>
      <div class="f2"><label class="field"><span>Nome do grupo</span><input class="sin" id="sN" value="${esc(d.nome || '')}" placeholder="Ex.: Tecnologia de Pagamentos"></label><label class="field"><span>Seu nome</span><input class="sin" id="sP" value="${esc(d.pessoa || '')}"></label></div>
      <label class="field"><span>Times que você lidera (um por linha: nome e, se quiser, prefixo de código)</span><textarea class="sin" id="sT" placeholder="Pagamentos PAG&#10;Cartões CAR">${esc(d.timesTxt || '')}</textarea></label>
      <div class="f2"><label class="field"><span>Ano fiscal e moeda</span><div class="row"><input class="sin" type="number" id="sA" value="${d.ano || new Date().getFullYear()}" style="width:100px"><select class="sel" id="sM"><option>BRL</option><option>USD</option><option>EUR</option></select></div></label><span></span></div>
      <p class="lbl">Pasta onde tudo vai ficar (fora do OneDrive)</p>
      <div class="row"><button class="btn ${st.dirLocal ? '' : 'pri'}" id="sL">${st.dirLocal ? 'Trocar' : 'Escolher pasta'}</button>${st.dirLocal ? `<span class="chip ok">${esc(st.dirLocal.name)}</span>` : ''}</div>
      <p class="lbl" style="margin-top:16px">Pasta sincronizada pelo OneDrive (pode ser depois)</p>
      <div class="row"><button class="btn" id="sC">${st.raiz ? 'Trocar' : 'Escolher pasta sincronizada'}</button>${st.raiz ? `<span class="chip ok">${esc(st.raiz.name)}</span>` : `<span class="small faint">normalmente ${PASTA_COMUM}</span>`}</div>
      <p class="lbl" style="margin-top:16px">Senha (uma só, para todos os seus arquivos)</p>
      <div class="row"><button class="btn ${st.senha ? '' : 'pri'}" id="sS">${st.senha ? 'Criar outra senha' : 'Criar senha'}</button>${st.senha ? '<span class="chip ok">guardada no cofre</span>' : ''}</div>
      <div class="row" style="margin-top:20px"><button class="btn" id="sVol">Voltar</button><span class="grow"></span><button class="btn pri" id="sGo" ${ok ? '' : 'disabled'}>Gerar tudo</button></div>`;
    $('#sM').value = d.moeda || 'BRL';
    const guardar = () => { d.nome = $('#sN').value.trim(); d.pessoa = $('#sP').value.trim(); d.timesTxt = $('#sT').value; d.ano = +$('#sA').value; d.moeda = $('#sM').value; };
    $('#sVol').onclick = () => { guardar(); st.modo = ''; st.passo = 0; desenhar(); };
    $('#sL').onclick = async () => { guardar(); const h = await escolherPastaLocalAssist(); if (h) { st.dirLocal = h; desenhar(); } };
    $('#sC').onclick = async () => { guardar(); await escolherComum(); };
    $('#sS').onclick = async () => { guardar(); const s = await criarSenhaDlg('Senha dos seus arquivos'); if (s) { st.senha = s; desenhar(); } };
    $('#sGo').onclick = async () => {
      guardar(); const b = $('#sGo');
      if (!d.nome || !d.pessoa) return toast('Preencha o nome do grupo e o seu nome.');
      const times = lerTimes(d.timesTxt); if (!times.length) return toast('Informe pelo menos um time.');
      if (new Set(times.map(t => t.slug)).size !== times.length) return toast('Há dois times com o mesmo nome.');
      if (!(d.ano >= 2000 && d.ano < 2100)) return toast('Ano fiscal inválido.');
      if (!await avisoCofre('chave', `<p class="small">Vamos gerar ${times.length * 2} chaves (tarefas e finanças de cada time). Elas vão dentro dos seus arquivos cifrados e dos HTMLs de cada time; você vê e copia cada uma na próxima tela.</p>`)) return;
      b.disabled = true; b.textContent = 'Gerando…';
      try { await gerarSorte(times); } catch (e) { b.disabled = false; b.textContent = 'Gerar tudo'; return toast('Erro: ' + e.message, 8000); }
      st.sp = 1; desenhar();
    };
    return;
  }
  const n = st.sorteTimes.length, htmls = st.criados.filter(c => /\.html$/.test(c.nome)).length, json = st.criados.filter(c => /\.json$/.test(c.nome)).length;
  el.innerHTML = `<h1>Tudo pronto</h1><p class="muted">Grupo <b>${esc(d.nome)}</b>, ${n} ${n === 1 ? 'time' : 'times'}, na pasta <span class="code">${esc(st.dirLocal.name)}</span>.</p>
    <div class="inss">${[
      cardLeitura({ hi: true, k: 'Ferramentas geradas', v: String(htmls), s: `${htmls - n * 3} suas e ${n * 3} dos times` }),
      cardLeitura({ k: 'Times prontos', v: String(n), pct: 1, s: 'Quadro, Finanças e Férias de cada um' }),
      cardLeitura({ k: 'Chaves criadas', v: String(n * 2), s: 'tarefas e finanças, já dentro dos arquivos' }),
      cardLeitura({ k: 'Arquivos cifrados', v: String(json), s: 'todos abrem com a sua senha' })].join('')}</div>
    <div class="card" style="padding:14px 16px;margin:4px 0 16px">${mapaSorte()}</div>
    <p class="lbl">Chaves de cada time</p>
    <p class="small muted" style="margin-top:0">Os HTMLs de <span class="code">para-os-times/&lt;time&gt;/</span> já levam a chave. Envie cada pasta ao responsável do time por mensagem direta ou e-mail, nunca pela pasta compartilhada. Guarde as chaves no cofre.</p>
    <div>${st.sorteTimes.map((t, i) => `<div class="tk"><div><b>${esc(t.nome)}</b> <span class="small faint code">${esc(t.slug)}</span></div><button class="btn sm" data-cp="${i}:tar">Copiar chave de tarefas</button><button class="btn sm" data-cp="${i}:fin">Copiar chave de finanças</button></div>`).join('')}</div>
    <p class="lbl" style="margin-top:18px">Checklist para deixar tudo funcionando</p>${checklist(itensChecklist())}
    <div class="row" style="margin-top:16px"><button class="btn pri" id="mapa2">Abrir "Onde fica cada coisa"</button><button class="btn" id="mapa">Ferramentas da solução</button></div>`;
  $$('[data-cp]').forEach(b => b.onclick = async () => { const [i, k] = b.dataset.cp.split(':'), t = st.sorteTimes[+i]; try { await navigator.clipboard.writeText(k === 'fin' ? t.kFin : t.kTar); toast('Chave copiada. Cole no cofre ou na mensagem direta.'); } catch { toast('Não consegui copiar.'); } });
  $('#mapa2').onclick = abrirCartao;
  $('#mapa').onclick = () => ondeEstou({ ferramenta: TOOL_NOME, versao: TOOL_VERSION, arquivo: '', pastaLocal: st.dirLocal?.name, pastaComum: st.raiz?.name, writer: '', local: ['Os HTMLs das ferramentas', 'Arquivos de dados cifrados com a sua senha', 'para-os-times/: as ferramentas de cada time'], comum: ['Planos, diretrizes, catálogos e status cifrados com a chave de cada time'] });
  ligarChecklist();
}
function lerTimes(txt) {
  return String(txt || '').split('\n').map(x => x.trim()).filter(Boolean).map(x => { const m = /^(.*?)\s+([A-Za-z]{2,5})$/.exec(x); const nome = m ? m[1] : x; return { nome, slug: slugify(nome), prefixo: m ? m[2].toUpperCase() : '' }; }).filter(t => t.slug);
}
async function gerarSorte(times) {
  const d = st.dados, agora = new Date(), ym = String(agora.getFullYear()).slice(2) + pad2(agora.getMonth() + 1);
  st.papel = 'gestor'; st.usos = ['tarefas', 'financas', 'ferias']; st.temChave = false;
  d.slug = slugify(d.nome); d.times = times;
  st.sorteTimes = times.map(t => ({ ...t, kTar: gerarChaveTexto(`${t.slug}-${ym}`), kFin: gerarChaveTexto(`${t.slug}-fin-${ym}`) }));
  // As chaves geradas entram como se tivessem sido coladas: o criarTudo põe cada uma no lugar certo.
  st.chaves = st.sorteTimes.flatMap(t => [{ texto: t.kTar, kid: `${t.slug}-${ym}`, slug: t.slug, tipo: 'tarefas', papel: 'tarefas', aviso: '', ignorar: false },
    { texto: t.kFin, kid: `${t.slug}-fin-${ym}`, slug: t.slug, tipo: 'fin', papel: 'fin', aviso: '', ignorar: false }]);
  await criarTudo();
  const iso = agora.toISOString(), pasta = st.raiz?.name || PASTA_COMUM, quadro = await lerEmbutido('quadroEmb'), fin = await lerEmbutido('finTimeEmb'), fer = await lerEmbutido('feriasEmb');
  for (const t of st.sorteTimes) {
    const dirT = await subpasta(st.dirLocal, ['para-os-times', t.slug], true);
    await gravarLocal(dirT, `quadro_${t.slug}.html`, aplicarPreset(quadro, 'QUADRO-PRESET', { schema: 'quadro-preset/1', generatedAt: isoComFuso(), team: { name: t.nome, slug: t.slug, ...(t.prefixo ? { prefix: t.prefixo } : {}) }, key: t.kTar }));
    await gravarLocal(dirT, `financas_${t.slug}.html`, aplicarPreset(fin, 'FIN-PRESET', { schema: 'financas-preset/1', team: { nome: t.nome, slug: t.slug, prefixo: t.prefixo }, ano: d.ano, anos: [d.ano], moeda: d.moeda, pasta, chave: t.kFin, contato: d.pessoa, geradoEm: iso }));
    await gravarLocal(dirT, 'ferias.html', aplicarPreset(fer, 'FERIAS-PRESET', { unidade: { nome: t.nome, slug: t.slug }, chave: t.kTar }));
    await gravarLocal(dirT, 'LEIA-ME.txt', `Ferramentas do time ${t.nome}, geradas por ${d.pessoa} em ${agora.toLocaleDateString('pt-BR')}.\r\n\r\n` +
      `1. Copie esta pasta para uma pasta do seu computador FORA do OneDrive e abra os HTMLs no Edge ou no Chrome.\r\n` +
      `2. quadro_${t.slug}.html: quadro de tarefas do time. financas_${t.slug}.html: finanças do time (só para quem cuida do dinheiro do time). ferias.html: Mapa de Férias (cada pessoa marca as suas; escolha "Time").\r\n` +
      `3. Na primeira abertura, crie a sua senha e guarde no cofre de senhas. As chaves do time já estão dentro dos HTMLs: guarde-as no cofre quando a ferramenta pedir.\r\n` +
      `4. Ligue a pasta sincronizada pelo OneDrive (${pasta}) quando a ferramenta pedir.\r\n\r\nNão coloque estes HTMLs na pasta compartilhada: eles levam a chave do time.\r\n`);
    st.criados.push({ nome: `para-os-times/${t.slug}/quadro_${t.slug}.html`, tipo: 'QT', desc: `Quadro do Time ${t.nome}, com a chave de tarefas.` }, { nome: `para-os-times/${t.slug}/financas_${t.slug}.html`, tipo: 'FT', desc: `Finanças do Time ${t.nome}, com a chave de finanças.` }, { nome: `para-os-times/${t.slug}/ferias.html`, tipo: 'FE', desc: `Mapa de Férias do time ${t.nome}, com a chave do time.` });
  }
  st.senha = null;
}
// Desenho do que foi gerado: a sua pasta (ferramentas do gestor e para-os-times) e a pasta sincronizada.
function mapaSorte() {
  const ts = st.sorteTimes, linha = 30, y0 = 54, sua = ['hub.html', 'gestao_pessoal.html', 'financas_grupo.html', 'ferias.html', 'onde-fica-cada-coisa.html'];
  const yT = y0 + sua.length * linha + 30, H = Math.max(yT + ts.length * linha, y0 + (ts.length + 1) * linha) + 16;
  const item = (x, y, w, txt, sub, forte) => `<rect class="${forte ? 's1 f1' : 'sl fw'}" x="${x}" y="${y}" width="${w}" height="24" rx="6"/><text class="t" x="${x + 10}" y="${y + 16}">${esc(txt)}</text>${sub ? `<text class="tm" x="${x + w - 8}" y="${y + 16}" text-anchor="end">${esc(sub)}</text>` : ''}`;
  let g = `<text class="t" x="10" y="20" style="font-size:12.5px">Sua pasta · ${esc(st.dirLocal.name)}</text><text class="tm" x="10" y="36">só neste computador, fora do OneDrive</text>`;
  g += sua.map((n, i) => item(10, y0 + i * linha, 300, n, ['tela inicial', 'tarefas', 'finanças', 'férias', 'mapa'][i], i < 4)).join('');
  g += `<text class="t" x="10" y="${yT - 8}">para-os-times/ · enviar a cada time</text>`;
  g += ts.map((t, i) => item(10, yT + i * linha, 300, `${t.slug}/`, 'quadro, finanças, férias + chave', false)).join('');
  const xr = 380;
  g += `<text class="t" x="${xr}" y="20" style="font-size:12.5px">Pasta sincronizada · ${esc(st.raiz?.name || PASTA_COMUM)}</text><text class="tm" x="${xr}" y="36">${st.raiz ? 'OneDrive, igual em todos os computadores' : 'ligue depois, dentro de cada ferramenta'}</text>`;
  g += item(xr, y0, 290, 'grupo/financas/', 'diretrizes', false);
  g += ts.map((t, i) => item(xr, y0 + (i + 1) * linha, 290, `times/${t.slug}/`, 'planos, status, férias, post-its', false)).join('');
  g += `<path class="sl" d="M318 ${y0 + 12}H${xr - 8}" stroke-dasharray="4 4"/><path class="sl" d="M${xr - 14} ${y0 + 7}l6 5l-6 5"/><text class="tm" x="${(318 + xr) / 2}" y="${y0 - 2}" text-anchor="middle">publica e lê</text>`;
  return `<svg class="mapa-svg" viewBox="0 0 680 ${H}" role="img" aria-label="O que foi gerado e onde fica">${g}</svg>`;
}
// Checklist do que falta para tudo funcionar. Marcações só neste navegador (conveniência).
function itensChecklist() {
  const g = st.papel === 'gestor', n = (st.dados.times || []).length, sorte = st.modo === 'sorte', pasta = st.raiz?.name || st.pastaDoLider || PASTA_COMUM, l = [];
  l.push(['cofre', 'A senha está guardada no cofre de senhas', 'Sem ela não há como abrir os dados: não existe recuperação.']);
  l.push(['local', `A pasta ${st.dirLocal?.name || 'local'} está fora do OneDrive`, 'Documentos e Área de Trabalho sincronizam quando o backup de pastas do OneDrive está ligado.']);
  l.push(['sync', `A pasta ${pasta} sincroniza neste computador`, 'No SharePoint, botão "Sincronizar" ou "Adicionar atalho ao Meu OneDrive". Ela precisa aparecer no Explorador de Arquivos.']);
  l.push(['hub', `Abri o hub.html e ele mostra ${g ? `os ${n} times` : 'o meu time'}`, 'O hub é a tela inicial: as outras ferramentas abrem a partir dele.']);
  if (g && st.usos.includes('tarefas')) l.push(['central', 'Na Central, liguei a pasta sincronizada', 'Integração › Pasta e chaves.']);
  if (g && st.usos.includes('financas')) l.push(['fg', 'No Finanças do Grupo, liguei a pasta e informei o orçamento do ano', 'Ajustes › orçamento aprovado; Times › teto de cada time.']);
  if (sorte) { l.push(['chaves', 'As chaves dos times estão no cofre', 'Use os botões "Copiar chave" acima.']); l.push(['envio', 'Mandei a cada time a pasta para-os-times/<time>', 'Por mensagem direta ou e-mail, nunca pela pasta compartilhada.']); }
  else if (g) l.push(['envio', 'Mandei a cada time o inicio.html e, por mensagem direta, a chave e o nome da pasta', 'O assistente do time sai configurado com a chave.']);
  else l.push(['chave', chavesUteis().length ? 'Guardei a chave do time no cofre' : 'Pedi a chave do time ao meu líder', 'A chave chega por mensagem direta; cole na ferramenta quando ela pedir.']);
  return l;
}
const CK_KEY = 'inicio-checklist';
function ckLer() { try { return JSON.parse(localStorage.getItem(CK_KEY) || '{}'); } catch { return {}; } }
function checklist(itens) {
  const f = ckLer(), feitos = itens.filter(([k]) => f[k]).length;
  return `<div class="ins" style="margin-bottom:8px"><div class="k">Feito</div><div class="v" id="ckV">${feitos} <span class="faint" style="font-size:15px">de ${itens.length}</span></div><div class="m"><i id="ckM" style="width:${feitos / itens.length * 100}%"></i></div></div>
    <div id="ckL">${itens.map(([k, t, h]) => `<label class="ck ${f[k] ? 'on' : ''}"><input type="checkbox" data-ck="${k}" ${f[k] ? 'checked' : ''}><span><span>${esc(t)}</span><small>${esc(h)}</small></span></label>`).join('')}</div>`;
}
function ligarChecklist() {
  $$('[data-ck]').forEach(c => c.onchange = () => {
    const f = ckLer(); f[c.dataset.ck] = c.checked; try { localStorage.setItem(CK_KEY, JSON.stringify(f)); } catch {}
    c.closest('.ck').classList.toggle('on', c.checked);
    const todos = $$('[data-ck]'), n = todos.filter(x => x.checked).length; $('#ckV').innerHTML = `${n} <span class="faint" style="font-size:15px">de ${todos.length}</span>`; $('#ckM').style.width = n / todos.length * 100 + '%';
  });
}
desenhar();
</script>

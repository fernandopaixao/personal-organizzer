<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Início da solução</title>
<style>
/*NUCLEO-CSS*/
.wz{max-width:720px;margin:6vh auto 80px;padding:0 20px}
.wz .card{padding:26px 28px}
.wz h1{font-family:var(--title);font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
.combo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.res:last-child{border:0}
.res .ic{width:28px;height:28px;border-radius:8px;background:var(--bv-soft);color:var(--bv);display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}
@media (max-width:720px){.combo{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wz"><div class="card" id="wz"></div><p class="small muted" style="text-align:center;margin-top:14px">Início da solução <span id="ver"></span> · nada sai do seu computador: as ferramentas são arquivos HTML e os dados ficam em arquivos cifrados.</p></div>
<dialog id="dlg"></dialog>
<script>
/*NUCLEO-JS*/
</script>
<script>
/* =====================================================================
   Início da solução · assistente
   Pergunta o uso esperado, cria o primeiro arquivo (sempre cifrado), gera os HTMLs
   desacoplados de cada uso e o cartão "Onde fica cada coisa".
   ===================================================================== */
const TOOL_NOME = 'Início da solução', TOOL_VERSION = '2.0.0';
$('#ver').textContent = TOOL_VERSION;
const st = { passo: 0, papel: '', usos: [], dados: {}, dirLocal: null, raiz: null, senha: null, criados: [], temChave: null, chaves: [], kErr: '', pastaDoLider: '', cofreChaves: false };
// Perfil: quem lidera, se quer finanças e tarefas, e se o líder já mandou chaves e a pasta.
const PAPEIS = [
  ['gestor', 'Sim, lidero 2 ou mais times', 'Você acompanha um grupo: consolida tarefas e finanças dos seus times e gera as chaves deles.'],
  ['responsavel', 'Sim, lidero 1 time', 'Você cuida do dia a dia de um time: quadro de tarefas e, se quiser, o plano financeiro.'],
  ['membro', 'Não, faço parte de um time', 'Você usa o quadro de tarefas do time.']
];
const USOS = [['tarefas', 'Tarefas', 'Iniciativas, quadro, backlog e acompanhamento.'], ['financas', 'Finanças', 'Orçado, previsto e realizado; contratos; previsão de vários anos.']];
// O que cada combinação gera. Cada HTML é desacoplado e tem o próprio arquivo de dados.
function plano() {
  const g = st.papel === 'gestor', out = [{ id: 'hb', nome: 'Hub da solução', desc: 'Tela inicial do dia a dia: abre as outras ferramentas, mostra os times e deixa post-its.', html: 'hub.html' }];
  if (st.usos.includes('financas')) out.push(g ? { id: 'fg', nome: 'Finanças do Grupo', desc: 'Consolidado: soma os planos publicados pelos times.', html: 'financas_grupo.html' }
                                             : { id: 'ft', nome: 'Finanças do Time', desc: 'Dia a dia e futuro das finanças do time.', html: `financas_${st.dados.slug || '<time>'}.html` });
  if (st.usos.includes('tarefas')) out.push(g ? { id: 'ct', nome: 'Central de Gestão', desc: 'Tarefas consolidado: iniciativas, times, rituais e pessoas.', html: 'gestao_pessoal.html' }
                                            : { id: 'qt', nome: 'Quadro do Time', desc: 'Tarefas de um time: quadro, backlog, sprints e métricas.', html: `quadro_${st.dados.slug || '<time>'}.html` });
  return out;
}
// Chaves coladas: o kid diz o que cada uma é. "<time>-AAMM" é de tarefas; "<time>-fin-AAMM" é de finanças.
// Para quem lidera vários times, uma chave de finanças vem da liderança (nível acima: grupos/<grupo>/financas/).
function classificarChave(texto) {
  const k = lerChaveTexto(texto), m = /^(.+?)(-fin)?-\d{4}(?:-\d+)?$/.exec(k.kid) || [null, k.kid, ''];
  const fin = !!m[2], slug = m[1], g = st.papel === 'gestor';
  let papel = fin ? (g ? 'acima' : 'fin') : 'tarefas', aviso = '';
  if (g && !fin) aviso = 'Chave de tarefas de um time. Como você lidera vários times, as chaves deles são geradas por você na Central; esta será ignorada.';
  if (!g && fin && st.papel === 'membro') aviso = 'Chave de finanças: as finanças do time ficam com quem lidera o time. Será ignorada.';
  if (!g && fin && !st.usos.includes('financas')) aviso = 'Chave de finanças, mas você não marcou Finanças. Será ignorada.';
  if (!g && !fin && !st.usos.includes('tarefas')) aviso = 'Chave de tarefas, mas você não marcou Tarefas. Será guardada só no hub, para post-its.';
  return { texto: texto.trim(), kid: k.kid, slug, tipo: fin ? 'fin' : 'tarefas', papel, aviso, ignorar: /ignorada/.test(aviso) };
}
const chavesUteis = () => st.chaves.filter(c => !c.ignorar);
const slugDasChaves = () => { const s = [...new Set(chavesUteis().filter(c => c.papel !== 'acima').map(c => c.slug))]; return s.length === 1 ? s[0] : ''; };
const ROTULO = { tarefas: 'Tarefas do time', fin: 'Finanças do time', acima: 'Finanças do nível acima (liderança)' };
const PASSOS = ['Boas-vindas', 'Perfil', 'Chaves', 'Dados', 'Pastas', 'Senha', 'Pronto'];
function desenhar() {
  const p = st.passo, el = $('#wz');
  const topo = `<div class="steps">${PASSOS.map((_, i) => `<i class="${i <= p ? 'on' : ''}"></i>`).join('')}</div>`;
  const nav = (proxOk = true, proxTxt = 'Continuar') => `<div class="row" style="margin-top:18px">${p > 0 && p < 6 ? '<button class="btn" id="vol">Voltar</button>' : ''}<span class="grow"></span>${p < 6 ? `<button class="btn pri" id="prox" ${proxOk ? '' : 'disabled'}>${proxTxt}</button>` : ''}</div>`;
  if (p === 0) el.innerHTML = `${topo}<h1>Vamos montar sua solução</h1><p class="muted">Três perguntas sobre o seu perfil e, se o seu líder já mandou, a chave e a pasta. Depois criamos as ferramentas certas, o primeiro arquivo já cifrado e o mapa de onde fica cada coisa.</p>
    <div class="map" style="margin:16px 0"><div><h4>Fica no seu computador</h4>Seus dados individuais, num arquivo cifrado com a sua senha, numa pasta <b>fora</b> do OneDrive.</div><div><h4>Vai para a pasta sincronizada</h4>Só o pedaço comum (planos, catálogos, status), cifrado com a chave do time, numa pasta do SharePoint sincronizada pelo OneDrive.</div></div>
    ${temFS() ? '' : '<div class="banner warn">Abra este arquivo no Microsoft Edge ou no Google Chrome.</div>'}
    <button class="btn ghost" id="mapa">Ver todas as ferramentas da solução</button>${nav(temFS(), 'Começar')}`;
  if (p === 1) el.innerHTML = `${topo}<h1>Seu perfil</h1>
    <p class="lbl">1 · Você lidera times?</p>
    ${PAPEIS.map(([k, n, d]) => `<button class="opt ${st.papel === k ? 'on' : ''}" data-p="${k}"><b>${n}</b><span>${d}</span></button>`).join('')}
    ${st.papel ? `<p class="lbl" style="margin-top:16px">2 · O que você quer organizar?</p>
    <div class="combo">${USOS.map(([k, n, d]) => `<button class="opt ${st.usos.includes(k) ? 'on' : ''}" data-u="${k}" ${st.papel === 'membro' && k === 'financas' ? 'disabled style="opacity:.5"' : ''}><b>${n}</b><span>${d}</span></button>`).join('')}</div>
    ${st.papel === 'membro' ? '<p class="small muted">As finanças do time ficam com quem lidera o time.</p>' : ''}` : ''}
    ${st.usos.length ? `<p class="lbl" style="margin-top:14px">Você vai receber</p>${plano().map(x => `<div class="res"><span class="ic">${x.id.toUpperCase()}</span><div><b>${x.nome}</b><br><span class="small muted">${x.desc}</span></div></div>`).join('')}` : ''}${nav(!!st.papel && st.usos.length > 0)}`;
  if (p === 2) {
    const g = st.papel === 'gestor';
    el.innerHTML = `${topo}<h1>Seu líder compartilhou chaves de integração?</h1>
    <p class="muted">${g ? 'Se a sua liderança também usa a solução, ela pode ter mandado uma <b>chave de finanças do grupo</b> para você publicar o consolidado para ela.' : 'Quem lidera o seu grupo gera uma <b>chave do time</b> (tarefas e, se for o caso, finanças) e manda por mensagem direta ou e-mail, junto com o nome da pasta sincronizada.'}</p>
    <div class="combo"><button class="opt ${st.temChave === true ? 'on' : ''}" data-k="sim"><b>Sim, recebi</b><span>Cole as chaves e a ferramenta já sai configurada.</span></button>
    <button class="opt ${st.temChave === false ? 'on' : ''}" data-k="nao"><b>Não, ainda não</b><span>Dá para colar depois, dentro de cada ferramenta.</span></button></div>
    ${st.temChave ? `<label class="field" style="margin-top:10px"><span>Chaves (uma por linha, começam com GK1.)</span><textarea class="sin code" id="kT" rows="3" placeholder="GK1.pagamentos-2611.…&#10;GK1.pagamentos-fin-2611.…">${esc(st.chaves.map(c => c.texto).join('\n'))}</textarea></label>
      <div class="row"><button class="btn sm" id="kLer">Conferir chaves</button><span class="small latec" id="kErr">${esc(st.kErr || '')}</span></div>
      ${st.chaves.map(c => `<div class="res"><span class="ic">${c.tipo === 'fin' ? 'FIN' : 'TAR'}</span><div><b>${esc(ROTULO[c.papel])}</b> · <span class="code">${esc(c.kid)}</span><br><span class="small ${c.aviso ? 'latec' : 'muted'}">${esc(c.aviso || (c.papel === 'acima' ? `Liderança do grupo "${c.slug}". Vai para Finanças do Grupo › Ajustes › Nível acima.` : `Time "${c.slug}". Vai pré-configurada na ferramenta do time e no hub.`))}</span></div></div>`).join('')}
      <label class="field" style="margin-top:10px"><span>Nome da pasta sincronizada que o líder indicou (opcional)</span><input class="sin" id="kP" value="${esc(st.pastaDoLider || '')}" placeholder="${PASTA_COMUM}"></label>` : ''}
    ${nav(st.temChave === false || (st.temChave === true && st.chaves.length > 0 && !st.kErr))}`;
  }
  if (p === 3) {
    const g = st.papel === 'gestor', d = st.dados, sk = slugDasChaves();
    el.innerHTML = `${topo}<h1>${g ? 'Sobre o grupo' : 'Sobre o time'}</h1>
      ${g ? `<label class="field"><span>Nome do grupo</span><input class="sin" id="dN" value="${esc(d.nome || '')}" placeholder="Ex.: Tecnologia de Pagamentos"></label>
        <label class="field"><span>Times que você lidera (um por linha: nome e, se quiser, prefixo de código)</span><textarea class="sin" id="dT" placeholder="Pagamentos PAG&#10;Cartões CAR">${esc(d.timesTxt || '')}</textarea></label>`
      : `<div class="f2"><label class="field"><span>Nome do time</span><input class="sin" id="dN" value="${esc(d.nome || '')}"></label><label class="field"><span>Identificador (pastas)${sk ? ' · veio da chave' : ''}</span><input class="sin code" id="dS" value="${esc(sk || d.slug || '')}" ${sk ? 'disabled' : ''}></label></div>
        <label class="field"><span>Prefixo de código (opcional, ex.: PAG)</span><input class="sin" id="dPx" value="${esc(d.prefixo || '')}" maxlength="5"></label>`}
      <div class="f2"><label class="field"><span>Seu nome</span><input class="sin" id="dP" value="${esc(d.pessoa || '')}"></label>
      ${st.usos.includes('financas') ? `<label class="field"><span>Ano fiscal e moeda</span><div class="row"><input class="sin" type="number" id="dA" value="${d.ano || new Date().getFullYear()}" style="width:100px"><select class="sel" id="dM"><option>BRL</option><option>USD</option><option>EUR</option></select></div></label>` : '<span></span>'}</div>
      ${nav(true)}`;
    if (!g && !sk) $('#dN').oninput = () => { $('#dS').value = slugify($('#dN').value); };
    if (!g && sk && !d.nome) $('#dN').value = sk.split('-').map(x => x[0].toUpperCase() + x.slice(1)).join(' ');
    if ($('#dM')) $('#dM').value = d.moeda || 'BRL';
  }
  if (p === 4) el.innerHTML = `${topo}<h1>Onde guardar</h1>
    <p class="lbl">1 · Pasta local (obrigatória)</p>
    <p class="small muted" style="margin-top:0">Fica só neste computador, <b>fora do OneDrive</b>: recebe os HTMLs e o seu arquivo de dados cifrado. Com o backup de pastas do OneDrive ligado, <b>Documentos</b> e <b>Área de Trabalho</b> também sincronizam; prefira algo como <span class="code">C:\\Users\\voce\\GestaoLocal</span>.</p>
    <div class="row"><button class="btn ${st.dirLocal ? '' : 'pri'}" id="pL">${st.dirLocal ? 'Trocar' : 'Escolher pasta local'}</button>${st.dirLocal ? `<span class="chip ok">${esc(st.dirLocal.name)}</span>` : ''}</div>
    <p class="lbl" style="margin-top:20px">2 · Pasta sincronizada pelo OneDrive ${chavesUteis().length ? '(recomendada agora)' : '(pode ser depois)'}</p>
    <p class="small muted" style="margin-top:0">${chavesUteis().length ? `A pasta que o seu líder compartilhou${st.pastaDoLider ? `: <b class="code">${esc(st.pastaDoLider)}</b>` : ` (normalmente <span class="code">${PASTA_COMUM}</span>)`}. Ela precisa estar sincronizada neste computador (botão "Sincronizar" ou "Adicionar atalho ao Meu OneDrive" no SharePoint).` : `A pasta comum da solução, <span class="code">${PASTA_COMUM}</span>: recomendamos uma biblioteca do SharePoint do grupo, sincronizada pelo OneDrive.`} O assistente cria só a estrutura de pastas e um LEIA-ME; nenhum dado vai para lá agora.</p>
    <div class="row"><button class="btn" id="pC">${st.raiz ? 'Trocar' : 'Escolher pasta sincronizada'}</button>${st.raiz ? `<span class="chip ok">${esc(st.raiz.name)}</span>` : '<span class="small faint">opcional agora</span>'}</div>${nav(!!st.dirLocal)}`;
  if (p === 5) el.innerHTML = `${topo}<h1>Senha</h1><p class="muted">Todos os arquivos de dados são cifrados. Não existe arquivo sem senha. ${plano().length > 1 ? 'Os arquivos criados agora usam a mesma senha; cada ferramenta permite trocar depois.' : ''}</p>
    <div class="cofre">A senha é a única forma de abrir seus dados e <b>não pode ser recuperada</b>. Você vai guardá-la no cofre de senhas no próximo passo.</div>
    ${st.senha ? '<p class="okc">Senha criada e guardada no cofre.</p>' : ''}<button class="btn ${st.senha ? '' : 'pri'}" id="sC">${st.senha ? 'Criar outra senha' : 'Criar senha'}</button>${nav(!!st.senha, 'Criar arquivos')}`;
  if (p === 6) el.innerHTML = `${topo}<h1>Pronto</h1><p class="muted">Criado na pasta local <span class="code">${esc(st.dirLocal.name)}</span>:</p>
    ${st.criados.map(c => `<div class="res"><span class="ic">${c.tipo}</span><div class="grow"><b class="code">${esc(c.nome)}</b><br><span class="small muted">${esc(c.desc)}</span></div></div>`).join('')}
    <p class="lbl" style="margin-top:18px">Próximos passos</p>${proximos()}
    <div class="row" style="margin-top:16px"><button class="btn pri" id="mapa2">Abrir "Onde fica cada coisa"</button><button class="btn" id="mapa">Ferramentas da solução</button></div>`;
  ligar();
}
function proximos() {
  const g = st.papel === 'gestor', l = [], ch = chavesUteis(), tem = tipo => ch.some(c => c.papel === tipo);
  l.push('Abra o hub.html (Edge ou Chrome) como tela inicial: ele mostra as ferramentas desta pasta e abre cada uma. Em cada ferramenta, escolha a pasta local e digite a senha.');
  if (g) {
    if (st.usos.includes('tarefas')) l.push('Na Central, em Times, cadastre o prefixo e a pasta de cada time e gere a chave de tarefas de cada um (guarde no cofre).');
    if (st.usos.includes('financas')) l.push('Em Finanças do Grupo › Times, gere a chave de finanças de cada time (guarde no cofre).');
    l.push('Para cada time, mande o inicio.html (está no pacote da solução) e, por mensagem direta, a chave e o nome da pasta sincronizada. O assistente do time já sai configurado com a chave.');
    l.push('No hub, use "Importar da Central" e "Importar do Finanças do Grupo" para ver os times e deixar post-its.');
    if (tem('acima')) l.push('A chave da sua liderança já está em Finanças do Grupo › Ajustes › Nível acima. Publique o consolidado quando ele estiver pronto.');
  } else {
    if (st.usos.includes('tarefas')) l.push(tem('tarefas') ? 'O Quadro do Time já tem a chave de tarefas: na primeira abertura, ligue a pasta sincronizada e diga quem é você.' : 'No Quadro do Time, cole a chave de tarefas do time (menu ··· › Central) quando o seu líder enviar.');
    if (st.usos.includes('financas')) l.push(tem('fin') ? 'O Finanças do Time já tem a chave de finanças: em Ajustes › Grupo e pasta, ligue a pasta sincronizada, crie as linhas do plano e publique.' : 'Em Finanças do Time › Ajustes › Grupo e pasta, cole a chave de finanças quando o seu líder enviar.');
  }
  if (!st.raiz) l.push(`Quando tiver a pasta sincronizada (${st.pastaDoLider || PASTA_COMUM}), ligue-a dentro de cada ferramenta.`);
  l.push('Guarde uma cópia deste assistente: ele gera de novo as ferramentas se você trocar de computador.');
  return l.map(x => `<div class="al"><span class="dot"></span><div>${esc(x)}</div></div>`).join('');
}
function lerChavesDigitadas() {
  const linhas = ($('#kT')?.value || '').split(/\s+/).map(x => x.trim()).filter(Boolean);
  st.kErr = ''; const out = [];
  for (const l of linhas) { try { const c = classificarChave(l); if (!out.some(x => x.kid === c.kid)) out.push(c); } catch (e) { st.kErr = `"${l.slice(0, 18)}…": ${e.message}`; } }
  const slugs = new Set(out.filter(c => !c.ignorar && c.papel !== 'acima').map(c => c.slug));
  if (!st.kErr && slugs.size > 1) st.kErr = `As chaves são de times diferentes (${[...slugs].join(', ')}). Cole só as do seu time.`;
  st.chaves = out; st.pastaDoLider = ($('#kP')?.value || '').trim();
}
function ligar() {
  const on = (id, f) => { const e = $('#' + id); if (e) e.onclick = f; };
  on('vol', () => { st.passo--; desenhar(); });
  on('mapa', () => ondeEstou({ ferramenta: TOOL_NOME, versao: TOOL_VERSION, arquivo: '', pastaLocal: st.dirLocal?.name, pastaComum: st.raiz?.name, writer: '',
    local: ['Os HTMLs das ferramentas', 'Arquivos de dados cifrados com a sua senha', 'Cópias de segurança (backup/)'], comum: ['Planos, diretrizes, catálogos e status cifrados com a chave de cada time', 'LEIA-ME.md (sem dados)'] }));
  on('mapa2', abrirCartao);
  $$('[data-p]').forEach(b => b.onclick = () => { st.papel = b.dataset.p; if (st.papel === 'membro') st.usos = ['tarefas']; st.chaves = st.chaves.map(c => classificarChave(c.texto)); desenhar(); });
  $$('[data-u]').forEach(b => b.onclick = () => { const k = b.dataset.u; st.usos = st.usos.includes(k) ? st.usos.filter(x => x !== k) : [...st.usos, k]; st.chaves = st.chaves.map(c => classificarChave(c.texto)); desenhar(); });
  $$('[data-k]').forEach(b => b.onclick = () => { st.temChave = b.dataset.k === 'sim'; if (!st.temChave) { st.chaves = []; st.kErr = ''; } desenhar(); });
  on('kLer', () => { lerChavesDigitadas(); desenhar(); });
  if ($('#kT')) $('#kT').onchange = () => { lerChavesDigitadas(); desenhar(); };
  on('pL', async () => { const h = await escolherPastaLocalAssist(); if (h) { st.dirLocal = h; desenhar(); } });
  on('pC', async () => { let h; try { h = await escolherPasta('fin-comum'); } catch { return; } if (!await permissao(h)) return; const v = await validarPastaComum(h);
    if (st.dirLocal && h.name === st.dirLocal.name && !v.tem) toast('Esta parece ser a mesma pasta local. Escolha a pasta sincronizada.');
    if (!v.tem && !v.nomeOk && h.name !== st.pastaDoLider && await perguntar('Esta é a pasta sincronizada?', `<p><b class="code">${esc(h.name)}</b> não tem a estrutura da solução nem o nome <span class="code">${PASTA_COMUM}</span>. Usar mesmo assim?</p>`, [['no', 'Escolher outra'], ['ok', 'Usar', 'pri']]) !== 'ok') return;
    st.raiz = h; desenhar(); });
  on('sC', async () => { const s = await criarSenhaDlg('Senha dos seus arquivos'); if (s) { st.senha = s; desenhar(); } });
  on('prox', async () => {
    if (st.passo === 2 && st.temChave) {
      lerChavesDigitadas(); if (st.kErr || !st.chaves.length) return desenhar();
      if (chavesUteis().length && !st.cofreChaves) { if (!await avisoCofre('chave', '<p class="small">As chaves vão para dentro dos arquivos cifrados que o assistente cria agora.</p>')) return; st.cofreChaves = true; }
    }
    if (st.passo === 3 && !lerDados()) return;
    if (st.passo === 5) { const b = $('#prox'); b.disabled = true; b.textContent = 'Criando…'; try { await criarTudo(); } catch (e) { b.disabled = false; b.textContent = 'Criar arquivos'; return toast('Erro: ' + e.message, 8000); } }
    st.passo++; desenhar();
  });
}
function lerDados() {
  const d = st.dados, g = st.papel === 'gestor', sk = slugDasChaves();
  d.nome = $('#dN').value.trim(); d.pessoa = $('#dP').value.trim();
  if ($('#dA')) { d.ano = +$('#dA').value; d.moeda = $('#dM').value; } else { d.ano ??= new Date().getFullYear(); d.moeda ??= 'BRL'; }
  if (g) { d.timesTxt = $('#dT').value; d.slug = slugify(d.nome); d.times = d.timesTxt.split('\n').map(x => x.trim()).filter(Boolean).map(x => { const m = /^(.*?)\s+([A-Za-z]{2,5})$/.exec(x); const nome = m ? m[1] : x; return { nome, slug: slugify(nome), prefixo: m ? m[2].toUpperCase() : '' }; }); }
  else { d.slug = sk || slugify($('#dS').value || d.nome); d.prefixo = $('#dPx').value.trim().toUpperCase(); }

}
async function escolherPastaLocalAssist() {
  let h; try { h = await escolherPasta('fin-local'); } catch { return null; }
  if (!await permissao(h)) return null;
  const s = await suspeitaDeSincronizada(h);
  if (s.length) { if (await perguntar('Esta pasta parece sincronizada', `<div class="cofre">A pasta <b>${esc(h.name)}</b> ${esc(s.join(', '))}. Dados individuais devem ficar fora do OneDrive.</div>`, [['no', 'Escolher outra'], ['ok', 'Usar mesmo assim']]) !== 'ok') return null; }
  return h;
}

    }
    if (x.id === 'fg') {

        orcamento: { total: 0 }, itens: [], times: d.times.map(t => ({ nome: t.nome, slug: t.slug, prefixo: t.prefixo, chaves: [], teto: { total: 0, caps: {} }, diretriz: {} })), retratos: {}, versoes: [], centros: [], seg, ...(chAcima.length ? { acima: { chaves: chAcima.map(reg) } } : {}) };
      await salvarNovo('financas_grupo.html', await lerEmbutido('finGrupoEmb'), 'FG', 'Ferramenta Finanças do Grupo (abra com dois cliques).');
      await salvarNovo(`financas-grupo-${d.slug}.json`, await cifrarLocal(db, await novoCtx(st.senha, 'financas-grupo')), 'DB', 'Dados das Finanças do Grupo, cifrados com a sua senha.');
    }
    if (x.id === 'ft') {
      const db = { schema: 'gestao-financas-local/1', version: 1, tool: 'financas-time', criadoEm: agora, team: { nome: d.nome, slug: d.slug, prefixo: d.prefixo }, ano: d.ano, moeda: d.moeda,

      const html = aplicarPreset(await lerEmbutido('finTimeEmb'), 'FIN-PRESET', { schema: 'financas-preset/1', team: { nome: d.nome, slug: d.slug, prefixo: d.prefixo }, ano: d.ano, moeda: d.moeda, geradoEm: agora });

// Formato do arquivo da Central (gestao-cripto/2): AES-GCM sem AAD, PBKDF2 600k.
async function cifrarCentral(obj, senha) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), key = await chaveDaSenha(senha, salt), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify(obj))));
  return JSON.stringify({ encrypted: true, format: 'gestao-cripto/2', algorithm: 'AES-GCM-256', kdf: 'PBKDF2-SHA256', iterations: PBKDF2_ITER, salt: b64.enc(salt), iv: b64.enc(iv), data: b64.enc(ct) }, null, 2);
}
// Formato do arquivo do Quadro (quadro-time-cifrado/1): AES-GCM com AAD = nome do formato.
async function cifrarQuadro(obj, senha) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), key = await chaveDaSenha(senha, salt), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: te.encode('quadro-time-cifrado/1') }, key, te.encode(JSON.stringify(obj))));
  return JSON.stringify({ schema: 'quadro-time-cifrado/1', kdf: { name: 'PBKDF2', hash: 'SHA-256', iter: PBKDF2_ITER, salt: b64.enc(salt) }, iv: b64.enc(iv), ct: b64.enc(ct) });
}

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finanças do Grupo</title>
<style>
:root{
  --bv:#223ad2; --bv-deep:#002bab; --bv-mid:#8e9de9; --bv-line:#d5dbf7; --bv-soft:#f2f4fd;
  --ink:#161a23; --muted:#6f7689; --faint:#aab0bf; --line:#eceef4; --bg:#fafafc; --card:#fff; --late:#c4574f; --late-soft:#fbefee;
  --ok:#2f7d5b; --ok-soft:#eaf5ef;
  --font:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --title:"BV Leve",Montserrat,Inter,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--bv)}
.hidden{display:none!important}
.muted{color:var(--muted)}.faint{color:var(--faint)}.grow{flex:1}.small{font-size:12px}.bvc{color:var(--bv)}.latec{color:var(--late)}.okc{color:var(--ok)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rail{position:fixed;left:0;top:0;bottom:0;width:84px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:2px;z-index:20}
.logo{width:36px;height:36px;border-radius:10px;background:var(--bv);color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--title);margin-bottom:12px;font-size:11px}
.nv{width:70px;padding:8px 0 6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;position:relative;text-align:center}
.nv svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nv:hover{color:var(--ink)}.nv.on{color:var(--bv);background:var(--bv-soft);font-weight:600}
.nv .b{position:absolute;top:3px;right:10px;min-width:15px;height:15px;border-radius:8px;background:var(--late);color:#fff;font-size:9.5px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.main{margin-left:84px;padding:0 clamp(18px,2.6vw,56px) 80px}
.top{position:sticky;top:0;z-index:10;background:rgba(250,250,252,.95);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:14px 0 12px;flex-wrap:wrap}
.top h1{margin:0;font-family:var(--title);font-size:20px;font-weight:600;letter-spacing:-.02em}
.top .sub{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.pill .led{width:7px;height:7px;border-radius:50%;background:var(--bv)}.pill .led.wait{background:var(--faint)}.pill .led.err{background:var(--late)}
button.pill:hover{border-color:#cfd3e0;color:var(--ink)}
.banner{background:var(--bv-soft);border:1px solid var(--bv-line);color:var(--bv-deep);border-radius:12px;padding:9px 14px;margin:0 0 14px;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--late-soft);border-color:#f0cfcc;color:#8a2f28}
.aviso-fs{margin-top:16px;line-height:1.5}.aviso-fs.pisca{animation:pisca-fs .9s ease 2}
@keyframes pisca-fs{50%{box-shadow:0 0 0 4px #e8a29b;transform:scale(1.01)}}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-weight:550;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:#cfd3e0}.btn.pri{background:var(--bv);border-color:var(--bv);color:#fff}.btn.pri:hover{background:var(--bv-deep)}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:8px}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.danger{color:var(--late)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}.btn.ghost:hover{color:var(--ink);background:#f0f1f6}
.sg{display:inline-flex;background:#f0f1f6;border-radius:10px;padding:2px;gap:2px;flex-wrap:wrap}
.sg button{padding:5px 12px;border-radius:8px;color:var(--muted);font-weight:550;font-size:12.5px}
.sg button.on{background:#fff;color:var(--bv);box-shadow:0 1px 2px rgba(20,30,70,.1)}
.sel,.sin,textarea.sin{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;outline:none;font-size:12.5px;min-width:0}
.sel:focus,.sin:focus{border-color:var(--bv);box-shadow:0 0 0 3px var(--bv-soft)}
textarea.sin{width:100%;resize:vertical;min-height:60px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:550;padding:1px 8px;border-radius:99px;background:#f2f3f8;color:var(--muted);white-space:nowrap}
.chip.bv{background:var(--bv-soft);color:var(--bv)}.chip.late{background:var(--late-soft);color:var(--late)}.chip.ok{background:var(--ok-soft);color:var(--ok)}
.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.lbl{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2{font-family:var(--title);font-size:16px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:14px;font-weight:650;margin:0}
.empty{color:var(--faint);padding:14px 0;font-size:12.5px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}.kpi b{display:block;font-family:var(--title);font-size:21px;font-weight:600;letter-spacing:-.02em}.kpi span{font-size:11.5px;color:var(--muted)}
.kpi.alert b{color:var(--late)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.tot td{font-weight:650;background:#f7f8fb}
table.t tr:hover td{background:#fbfbfe}
.scroll{overflow-x:auto}
.cell{width:92px;text-align:right;border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 5px;font-variant-numeric:tabular-nums}
.cell:hover{border-color:var(--line)}.cell:focus{border-color:var(--bv);background:#fff;outline:none}
.cell.closed{color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:12.5px;z-index:100;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
dialog{border:0;border-radius:18px;padding:0;width:min(620px,94vw);max-height:90vh;box-shadow:0 24px 64px rgba(20,30,70,.25)}
dialog.wide{width:min(900px,96vw)}
dialog::backdrop{background:rgba(22,26,35,.35)}
dialog[open]{display:flex;flex-direction:column}dialog>.mb{flex:1;min-height:0}
.mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);background:#fff}
.mb{padding:16px 20px;overflow:auto}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field>span{font-size:11.5px;font-weight:600;color:var(--muted)}
.field .sin,.field .sel{width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.cofre{border:1.5px solid var(--late);background:var(--late-soft);border-radius:14px;padding:12px 14px;color:#6d2620;font-size:12.5px;margin:6px 0 12px}
.cofre b{color:#8a2f28}
.quick{position:relative;margin-bottom:16px}
.quick input{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;font-size:13px}
.quick input:focus{border-color:var(--bv);box-shadow:0 0 0 3px var(--bv-soft)}
.quick .pl{position:absolute;left:13px;top:7px;color:var(--bv);font-weight:700;font-size:16px}
.quick .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.al{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}.al:last-child{border-bottom:0}
.al .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;background:var(--bv)}.al .dot.late{background:var(--late)}
.welcome{max-width:640px;margin:8vh auto;padding:0 20px}
.welcome .card{padding:26px 28px}
.steps{display:flex;gap:6px;margin:0 0 18px;flex-wrap:wrap}.steps i{height:4px;flex:1;min-width:30px;border-radius:2px;background:#e6e8f0}.steps i.on{background:var(--bv)}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;background:#fff}
.opt:hover{border-color:var(--bv-mid)}.opt.on{border-color:var(--bv);background:var(--bv-soft)}
.opt b{display:block;font-size:13.5px}.opt span{font-size:12px;color:var(--muted)}
.map{display:grid;grid-template-columns:1fr 1fr;gap:12px}.map>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px}
.map h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
svg.ch{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (max-width:720px){.rail{position:fixed;top:auto;bottom:0;width:100%;height:62px;flex-direction:row;justify-content:space-around;padding:0;border-right:0;border-top:1px solid var(--line)}.logo{display:none}.main{margin-left:0;padding-bottom:90px}.f2,.map{grid-template-columns:1fr}}
/* ---- Finanças 1.2: cards de leitura, medidores e gráficos (branco e azul, destaque discreto) ---- */
.top .sg{background:transparent;padding:0;gap:4px}.top .sg button{padding:4px 11px;border:1px solid transparent}.top .sg button.on{background:#fff;border-color:var(--bv-line);box-shadow:none}
.subnav{flex-basis:100%;display:flex;gap:4px;margin-top:-2px}
.subnav button{padding:5px 12px;border-radius:99px;color:var(--muted);font-weight:550;font-size:12.5px;border:1px solid transparent}
.subnav button:hover{color:var(--ink)}.subnav button.on{color:var(--bv);background:#fff;border-color:var(--bv-line)}
.inss{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.ins{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px 13px;display:flex;flex-direction:column;gap:7px;min-width:0}
.ins .k{font-size:11.5px;color:var(--muted);font-weight:550;display:flex;gap:6px;align-items:center}
.ins .v{font-family:var(--title);font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.ins .s{font-size:12px;color:var(--muted)}.ins .s b{color:var(--ink);font-weight:600}
.ins.hi{background:linear-gradient(160deg,var(--bv) 0%,var(--bv-deep) 100%);border-color:var(--bv);color:#fff}
.ins.hi .k,.ins.hi .s{color:rgba(255,255,255,.78)}.ins.hi .s b{color:#fff}.ins.hi .m{background:rgba(255,255,255,.22)}.ins.hi .m i{background:#fff}.ins.hi .m em{background:#fff}
.m{height:6px;border-radius:3px;background:var(--bv-soft);position:relative}
.m i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--bv);max-width:100%}
.m.over i{background:var(--bv-deep)}.m em{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--ink)}
.tag{font-size:10.5px;font-weight:650;padding:1px 7px;border-radius:99px;background:var(--bv-soft);color:var(--bv)}.tag.late{background:var(--late-soft);color:var(--late)}
.hb{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:9px 12px;align-items:center;font-size:12.5px}
.hb .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .val{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.hb .tr{height:10px;border-radius:5px;background:var(--bv-soft);position:relative}.hb .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--bv)}
.hb .tr em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}.hb .tr em.cap{background:var(--late)}
.g21{display:grid;gap:16px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}@media (max-width:980px){.g21{grid-template-columns:1fr}}
.card.flat{padding:14px 18px}
.al.compact{padding:6px 0}
svg.ch{max-height:280px}

</style>
<script id="tema">
/* Tema claro, escuro ou automático (segue o sistema), comum a todas as ferramentas da solução.
   Injetado no <head> de cada HTML por tools/build_financas.py e tools/injetar_seguranca.py.
   - A escolha fica só neste computador (localStorage 'gestao.tema') e vale para todas as ferramentas.
   - No escuro, as variáveis da identidade (--bv, --ink, --line...) ganham a paleta escura e as cores
     fixas das folhas de estilo, dos estilos inline e dos gráficos SVG são convertidas por papel
     (fundo, texto, borda), sem tocar no código de cada ferramenta. Voltar para o claro restaura tudo. */
(() => {
  if (window.gestaoTema) return;
  const CHAVE = 'gestao.tema', html = document.documentElement;
  const mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : { matches: false, addEventListener() {} };
  const ler = () => { try { const v = localStorage.getItem(CHAVE); return v === 'claro' || v === 'escuro' ? v : 'auto'; } catch { return 'auto'; } };
  let pref = ler(), escuro = false;

  // ---- Paleta escura: mesmo branco-e-azul, invertido para azul-noite, com o azul BV mais luminoso ----
  const VARS = '--bv:#5066ec;--bv-deep:#3a4fd6;--bv-t:#8d9cf9;--bv-deep-t:#a9b4ff;--bv-mid:#8190ee;--bv-line:#2f3a6b;--bv-soft:#1a2142;'
    + '--ink:#e6e9f2;--muted:#99a1b7;--faint:#68708a;--line:#262d40;--bg:#0e121c;--card:#161b29;'
    + '--late:#ec7d74;--late-soft:#3a1f24;--ok:#5cc292;--ok-soft:#15302a;--raised:#1e2436';
  const CSS = `:root[data-tema="escuro"]{${VARS};color-scheme:dark}
:root[data-tema="escuro"] body{background:var(--bg);color:var(--ink)}
:root[data-tema="escuro"] dialog{background:var(--card);color:var(--ink)}
:root[data-tema="escuro"] .toast{background:#2a3147!important;color:var(--ink)!important;box-shadow:0 8px 24px rgba(0,0,0,.5)!important}
:root[data-tema="escuro"] .ins.hi .m i,:root[data-tema="escuro"] .ins.hi .m em{background:#fff}
:root[data-tema="escuro"] img{filter:brightness(.92)}
:root[data-tema="escuro"] ::selection{background:#34407a}
#temaSel{position:fixed;right:14px;bottom:14px;z-index:90;font:500 12px/1 Inter,"Segoe UI",system-ui,sans-serif}
#temaSel>button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line,#eceef4);background:var(--card,#fff);color:var(--muted,#6f7689);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(20,30,70,.12);padding:0}
#temaSel>button:hover{color:var(--bv,#223ad2);border-color:var(--bv-line,#d5dbf7)}
#temaSel svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#temaSel .menu{position:absolute;right:0;bottom:42px;background:var(--card,#fff);border:1px solid var(--line,#eceef4);border-radius:12px;padding:4px;box-shadow:0 12px 32px rgba(20,30,70,.18);display:none;min-width:150px}
#temaSel.aberto .menu{display:block}
#temaSel .menu button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;color:var(--ink,#161a23);cursor:pointer;text-align:left;font:inherit;font-size:12.5px}
#temaSel .menu button:hover{background:var(--bv-soft,#f2f4fd)}
#temaSel .menu button.on{color:var(--bv,#223ad2);font-weight:650}
#temaSel .menu small{display:block;color:var(--muted,#6f7689);font-size:10.5px;padding:4px 10px 6px}
@media print{#temaSel{display:none}}`;

  // ---- Cores: leitura, HSL e conversão por papel ----
  const NOMES = { white: [255, 255, 255], black: [0, 0, 0] };
  function parse(s) {
    s = s.trim().toLowerCase();
    if (NOMES[s]) return [...NOMES[s], 1];
    let m = s.match(/^#([0-9a-f]{3,8})$/);
    if (m) {
      let h = m[1]; if (h.length === 3 || h.length === 4) h = [...h].map(c => c + c).join('');
      if (h.length !== 6 && h.length !== 8) return null;
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), h.length === 8 ? parseInt(h.slice(6), 16) / 255 : 1];
    }
    m = s.match(/^rgba?\(([^)]*)\)$/);
    if (m) {
      const p = m[1].split(/[\s,\/]+/).filter(Boolean); if (p.length < 3 || p.slice(0, 3).some(x => isNaN(parseFloat(x)))) return null;
      const a = p[3] == null ? 1 : (p[3].endsWith('%') ? parseFloat(p[3]) / 100 : parseFloat(p[3]));
      return [+p[0], +p[1], +p[2], a];
    }
    return null;
  }
  function hsl([r, g, b]) {
    r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
    if (!d) return [0, 0, l];
    const s = d / (1 - Math.abs(2 * l - 1));
    const h = mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [h * 60, s, l];
  }
  function rgb(h, s, l) {
    const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
    const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
    return [r, g, b].map(v => Math.round(Math.min(1, Math.max(0, v + m)) * 255));
  }
  const fmt = ([r, g, b], a) => a >= 1 ? `rgb(${r}, ${g}, ${b})` : `rgba(${r}, ${g}, ${b}, ${+a.toFixed(3)})`;
  const hex = c => '#' + c.slice(0, 3).map(v => v.toString(16).padStart(2, '0')).join('');
  // Cores da identidade com destino fixo, por papel (fundo, texto, borda).
  const FIXO = {
    '#ffffff': { f: '#161b29', b: '#262d40' }, '#fafafc': { f: '#0e121c' }, '#fbfbfd': { f: '#0e121c' },
    '#223ad2': { f: '#5066ec', t: '#8d9cf9', b: '#5066ec' }, '#002bab': { f: '#3a4fd6', t: '#a9b4ff', b: '#3a4fd6' },
    '#161a23': { f: '#2a3147', t: '#e6e9f2', b: '#3a4258' }, '#c4574f': { f: '#d9665d', t: '#ec7d74', b: '#c4574f' },
    '#f2f4fd': { f: '#1a2142', b: '#2f3a6b' }, '#d5dbf7': { f: '#2f3a6b', b: '#2f3a6b' }, '#8e9de9': { t: '#a3afef', b: '#5d6cc4' },
    '#eceef4': { f: '#232a3c', b: '#262d40' }, '#fbefee': { f: '#3a1f24', b: '#5a2c30' },
  };
  function converter(papel, c) {
    const [r, g, b, a] = c, fx = FIXO[hex(c)];
    if (fx && fx[papel]) return fmt(parse(fx[papel]), a);
    let [h, s, l] = hsl([r, g, b]);
    const croma = s * (1 - Math.abs(2 * l - 1)), neutro = croma < 0.09;
    if (papel === 't') {                                   // texto: claro sobre fundo escuro
      if (l > 0.9) return null;                            // texto branco (sobre azul, vermelho...) continua branco
      if (neutro) return fmt(rgb(h, Math.min(s, 0.18), 0.92 - l * 0.62), a);

<script id="sessao">
/* sessao 1.0 · uma senha por sessão (ADR-0029)
   Quem abre (hub, Central) guarda só em memória a senha que abriu o próprio arquivo. Quando a pessoa clica num link
   para outra ferramenta (target=_blank rel=opener), a janela nova pede a senha e o abridor responde uma vez, só nos
   90 segundos seguintes ao clique e só para uma janela aberta por ele (e.source.opener === window).
   A ferramenta aberta usa a senha só para abrir o próprio arquivo; se não servir, pede a senha como sempre.
   Nada vai para disco, localStorage ou para a pasta. Injetado em todos os HTMLs pelo build, junto com o tema. */
(() => {
  if (window.gestaoSessao) return;
  const SC = 'gestao-sessao/1', JANELA = 90e3;
  let senha = null, cliqueEm = 0, recebida = null, usada = false;
  document.addEventListener('click', e => {
    const a = e.target && e.target.closest && e.target.closest('a[target="_blank"][rel~="opener"]');
    if (a && senha) cliqueEm = Date.now();
  }, true);
  window.addEventListener('message', e => {
    const m = e.data; if (!m || m.schema !== SC) return;
    if (m.tipo === 'pedir') {

      let filha = false; try { filha = !!e.source && e.source.opener === window; } catch {}
      if (!filha) return;
      cliqueEm = 0;

    } else if (m.tipo === 'senha') {
      if (!window.opener || e.source !== window.opener || recebida !== null || typeof m.senha !== 'string' || !m.senha) return;
      recebida = m.senha.slice(0, 500);
      window.dispatchEvent(new Event('gestao-sessao'));
    }
  });
  if (window.opener) try { window.opener.postMessage({ schema: SC, tipo: 'pedir' }, '*'); } catch {}
  window.gestaoSessao = {
    definir(s) { senha = s ? String(s) : null; if (!s) cliqueEm = 0; },
    get recebida() { return recebida; },
    // Entrega a senha recebida uma única vez (para abrir o próprio arquivo).
    usar() { if (recebida == null || usada) return null; usada = true; return recebida; },
    get usada() { return usada; }
  };
})();

/* -------------------- cópias de conflito do OneDrive / SharePoint -------------------- */
// O cliente do OneDrive não sobrescreve quando dois computadores gravam o mesmo arquivo:

  if (!dir) return res;
  for (const a of await arquivosDoNome(dir, base)) {

    if (p) res.validos.push(item); else res.invalidos.push(item);

async function lerEmbutido(id) {
  const el = document.getElementById(id); if (!el) throw new Error('HTML embutido não encontrado: ' + id);
  const bytes = b64.dec(el.textContent.trim());
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(s).text();
}
// Troca o bloco entre /*<MARCA>*/ e /*FIM-<MARCA>*/ por um JSON (escapado para <script>).
function aplicarPreset(html, marca, obj) {
  const ini = `/*${marca}*/`, fim = `/*FIM-${marca}*/`, i = html.indexOf(ini), j = html.indexOf(fim);
  if (i < 0 || j < i) throw new Error('O HTML não tem o marcador de pré-configuração ' + marca);
  const json = JSON.stringify(obj).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
  return html.slice(0, i + ini.length) + json + html.slice(j);
}
function baixar(nome, texto, tipo = 'application/json') {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([texto], { type: tipo })); a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

// Card de leitura: rótulo, número, medidor (pct de 0 a 1+, marca opcional) e uma frase que interpreta.
function cardLeitura({ k, v, pct = null, marca = null, s = '', tag = '', hi = false }) {
  const p = pct == null ? '' : `<div class="m ${pct > 1 ? 'over' : ''}"><i style="width:${Math.max(0, Math.min(1, pct)) * 100}%"></i>${marca != null ? `<em style="left:${Math.max(0, Math.min(1, marca)) * 100}%"></em>` : ''}</div>`;
  return `<div class="ins ${hi ? 'hi' : ''}"><div class="k">${k}${tag}</div><div class="v">${v}</div>${p}${s ? `<div class="s">${s}</div>` : ''}</div>`;

// Barras horizontais: [{ nome, valor, ref (marca preta), cap (marca de teto), rotulo, attrs }]
function barrasH(itens, fmt) {
  if (!itens.length) return '<div class="empty">Nada para mostrar ainda.</div>';
  const max = Math.max(1, ...itens.map(x => Math.max(x.valor || 0, x.ref || 0, x.cap || 0)));
  const pc = v => (v / max * 100).toFixed(2) + '%';
  return `<div class="hb">${itens.map(x => `<div class="n" title="${esc(x.titulo || '')}">${x.nome}</div><div class="tr" title="${esc(x.titulo || '')}"><i style="width:${pc(x.valor || 0)}${x.cor ? ';background:' + x.cor : ''}"></i>${x.ref ? `<em style="left:${pc(x.ref)}"></em>` : ''}${x.cap ? `<em class="cap" style="left:${pc(x.cap)}"></em>` : ''}</div><div class="val">${x.rotulo ?? fmt(x.valor || 0)}</div>`).join('')}</div>`;
}
// Curva acumulada do ano: séries [{ nome, cor, v: [por mês], ate (índice do último mês com dado), tracejada, area }]
function curvaAcumulada(ms, series, fmt, hojeIdx = -1) {
  const acc = series.map(s => { let a = 0; return { ...s, c: s.v.map((x, i) => (s.ate != null && i > s.ate) ? null : (a += x || 0)) }; });
  const max = Math.max(1, ...acc.flatMap(s => s.c.filter(x => x != null)));
  const W = 760, H = 230, pl = 10, pr = 96, pt = 12, pb = 26, X = i => pl + i * (W - pl - pr) / Math.max(1, ms.length - 1), Y = v => H - pb - (v / max) * (H - pt - pb);
  let svg = [0.25, 0.5, 0.75, 1].map(f => `<line x1="${pl}" x2="${W - pr}" y1="${Y(max * f)}" y2="${Y(max * f)}" stroke="var(--line)"/>`).join('');
  if (hojeIdx >= 0 && hojeIdx < ms.length) svg += `<line x1="${X(hojeIdx)}" x2="${X(hojeIdx)}" y1="${pt}" y2="${H - pb}" stroke="var(--bv-line)" stroke-dasharray="3 3"/><text x="${X(hojeIdx)}" y="${pt + 8}" text-anchor="middle" font-size="10" fill="var(--faint)">hoje</text>`;
  const ocupados = [];
  for (const s of acc) {
    const pts = s.c.map((v, i) => v == null ? null : [X(i), Y(v)]).filter(Boolean); if (!pts.length) continue;
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    if (s.area) svg += `<path d="${d} L${pts.at(-1)[0].toFixed(1)} ${H - pb} L${pts[0][0].toFixed(1)} ${H - pb} Z" fill="${s.cor}" opacity=".08"/>`;
    svg += `<path d="${d}" fill="none" stroke="${s.cor}" stroke-width="${s.fina ? 1.5 : 2.4}" ${s.tracejada ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
    const u = pts.at(-1), ult = s.c.filter(x => x != null).at(-1); let ty = u[1] + 4; while (ocupados.some(o => Math.abs(o - ty) < 13)) ty += 13; ocupados.push(ty);
    svg += `<circle cx="${u[0]}" cy="${u[1]}" r="3.2" fill="${s.cor}"/><text x="${u[0] + 8}" y="${ty}" font-size="11" fill="${s.cor}" font-weight="600">${esc(fmt(ult))}</text>`;
  }
  svg += ms.map((m, i) => `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${nomeMes(m)}</text>`).join('');
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva acumulada do ano">${svg}</svg><div class="legend">${series.map(s => `<span><i style="background:${s.cor};${s.tracejada ? 'height:2px' : ''}"></i>${esc(s.nome)}</span>`).join('')}</div>`;
}

function tabelaAgrupada(dim) {

/* --- Times --- */

      ${c ? `<span class="chip ok">chave ${esc(c.kid)}</span>` : '<span class="chip late">sem chave</span>'}${t.diretriz.revision ? `<span class="chip">diretriz rev. ${t.diretriz.revision}</span>` : ''}</div>
      <div class="row" style="margin-top:10px"><button class="btn sm" data-ed="${t.slug}">Teto e diretriz</button>${c ? `<button class="btn sm" data-cp="${t.slug}">Copiar chave</button><button class="btn sm danger" data-rv="${t.slug}">Revogar chave</button>` : `<button class="btn sm pri" data-gk="${t.slug}">Gerar chave</button>`}
      ${ehGrupo(t) ? '' : `<button class="btn sm" data-ht="${t.slug}">HTML de finanças do time</button>`}<button class="btn sm" data-pd="${t.slug}" ${c && raiz ? '' : 'disabled'}>Publicar diretriz</button></div></div>`; }).join('') || '<div class="card empty">Nenhum time. Adicione os times que vão publicar plano financeiro.</div>'}`;
  $('#tNovo').onclick = () => timeDlg(null);

  $$('[data-rv]', el).forEach(b => b.onclick = () => revogarChave(timePorSlug(b.dataset.rv)));

function timeDlg(slug, tipo = 'time') {
  const t = slug ? timePorSlug(slug) : { nome: '', slug: '', tipo, prefixo: '', chaves: [], teto: { total: 0, caps: {} }, tetos: {}, diretriz: {}, publishBy: '', nota: '' };
  const v = c => c ? (c / 100).toLocaleString('pt-BR') : '';
  const d = modal(`<div class="mh"><h2>${slug ? esc(t.nome) : ehGrupo(t) ? 'Novo grupo de outro gestor' : 'Novo time'}</h2></div><div class="mb">${ehGrupo(t) && !slug ? '<p class="small muted" style="margin-top:0">Use como identificador o mesmo do grupo do gestor (aparece em Ajustes das Finanças do Grupo dele). Depois gere a chave e envie a ele por mensagem direta.</p>' : ''}
    <div class="f2"><label class="field"><span>Nome</span><input class="sin" id="mN" value="${esc(t.nome)}"></label><label class="field"><span>Identificador (pasta)</span><input class="sin code" id="mS" value="${esc(t.slug)}" ${slug ? 'disabled' : ''}></label></div>
    <div class="f2"><label class="field"><span>Prefixo de código (opcional)</span><input class="sin" id="mP" value="${esc(t.prefixo || '')}" maxlength="5"></label><label class="field"><span>Publicar plano até</span><input class="sin" type="date" id="mD" value="${esc(t.publishBy || '')}"></label></div>
    <p class="lbl">Teto de ${anoV()} (vai na diretriz; troque o ano no topo para os outros anos)</p>
    <label class="field"><span>Teto total</span><input class="sin" id="mT" value="${v(tetoAno(t).total)}"></label>
    <div class="f2">${db.categorias.map(c => `<label class="field"><span>${esc(c.nome)}</span><input class="sin" data-cap="${c.id}" value="${v(tetoAno(t).caps?.[c.id])}"></label>`).join('')}</div>
    <label class="field"><span>Recado para o time (vai cifrado na diretriz)</span><textarea class="sin" id="mR">${esc(t.nota || '')}</textarea></label></div>
    <div class="mf">${slug ? '<button class="btn danger" id="mX">Remover</button><span class="grow"></span>' : ''}<button class="btn" id="mNo">Cancelar</button><button class="btn pri" id="mOk">Salvar</button></div>`, 'wide');
  $('#mN', d).oninput = () => { if (!slug) $('#mS', d).value = slugify($('#mN', d).value); };
  $('#mNo', d).onclick = fecharModal;
  if (slug) $('#mX', d).onclick = async () => { fecharModal(); if (await perguntar('Remover time?', '<p>O time sai do consolidado e as chaves dele são apagadas deste arquivo. Os arquivos na pasta não são apagados.</p>', [['no', 'Cancelar'], ['ok', 'Remover', 'danger']]) !== 'ok') return; db.times = db.times.filter(x => x.slug !== slug); delete db.retratos[slug]; agendarSalvar(); };
  $('#mOk', d).onclick = () => {
    const nome = clamp($('#mN', d).value.trim(), 80), s = slugify($('#mS', d).value);
    if (!nome || !s) return toast('Preencha nome e identificador.'); if (!slug && timePorSlug(s)) return toast('Já existe um time com esse identificador.');
    t.nome = nome; t.prefixo = clamp($('#mP', d).value.trim().toUpperCase(), 5); t.publishBy = $('#mD', d).value; t.nota = clamp($('#mR', d).value.trim(), 500);
    const te = tetoEditavel(t); te.total = parseValor($('#mT', d).value) || 0; te.caps = {}; $$('[data-cap]', d).forEach(i => { const x = parseValor(i.value); if (x) te.caps[i.dataset.cap] = x; });
    if (anoV() === db.ano) t.teto = structuredClone(te);   // compatibilidade com arquivos 1.0
    if (!db.anos.includes(anoV())) db.anos = [...db.anos, anoV()].sort();
    if (!slug) { t.slug = s; db.times.push(t); }
    fecharModal(); agendarSalvar();
    if (slug && t.diretriz.revision) toast('Lembre de publicar a diretriz de novo para o time ver o teto atualizado.', 5000);
  };
}

/* --- Versões do plano --- */
function retratoAtual() { const r = {}; for (const t of db.times) { const p = db.retratos[t.slug]?.payload; if (somavel(p)) r[t.slug] = { revision: p.revision, planVersion: p.planVersion, meses: Object.fromEntries(anosG().flatMap(a => mesesAno(a)).map(m => [m, totaisPlano(p, [m])])) }; } r._grupo = { meses: Object.fromEntries(anosG().flatMap(a => mesesAno(a)).map(m => [m, totaisItens([m])])) }; return r; }
const totVersao = (rt, slug, a = anoV()) => Object.entries(rt[slug]?.meses || {}).filter(([m]) => m.startsWith(a + '-')).map(([, v]) => v).reduce((a, b) => soma(a, b), { orcado: 0, previsto: 0, realizado: 0 });
function vVersoes(el) {
  const v = db.versoes.find(x => x.id === verVersao), atual = retratoAtual();
  el.innerHTML = `<div class="bar"><span class="muted">Feche uma versão para guardar o retrato do dia (ex.: "Orçamento original", "Reforecast 1") e comparar depois.</span><span class="grow"></span><button class="btn pri" id="vNova">Fechar versão</button></div>
    <div class="card"><p class="lbl">Versões</p>${db.versoes.length ? db.versoes.map(x => `<div class="al"><span class="dot"></span><div class="grow"><b>${esc(x.nome)}</b> · ${fmtData(x.em)} · previsto ${anoV()} ${fm(Object.keys(x.retratos).reduce((s, k) => s + totVersao(x.retratos, k).previsto, 0))}</div><button class="btn sm ${verVersao === x.id ? 'pri' : ''}" data-vv="${x.id}">Comparar com hoje</button></div>`).join('') : '<div class="empty">Nenhuma versão fechada.</div>'}</div>
    ${v ? `<div class="card"><p class="lbl">${esc(v.nome)} × hoje · ${anoV()}</p><div class="scroll"><table class="t"><tr><th>Time</th><th class="n">Previsto em ${esc(v.nome)}</th><th class="n">Previsto hoje</th><th class="n">Diferença</th></tr>
      ${[...db.times.map(t => [t.slug, t.nome]), ['_grupo', 'Itens do grupo']].map(([s, n]) => { const a = totVersao(v.retratos, s).previsto, b = totVersao(atual, s).previsto; return a || b ? `<tr><td>${esc(n)}</td><td class="n">${fm(a)}</td><td class="n">${fm(b)}</td><td class="n ${b - a > 0 ? 'latec' : 'okc'}">${b - a >= 0 ? '+' : ''}${fm(b - a)}</td></tr>` : ''; }).join('')}</table></div></div>` : ''}`;
  $('#vNova').onclick = async () => {
    const r = await perguntar('Fechar versão', `<label class="field"><span>Nome</span><input class="sin" id="vN" value="${esc(db.versaoAtual || 'Orçamento original')}"></label><label class="row"><input type="checkbox" id="vProx" checked> <span>A próxima diretriz pede a versão seguinte aos times</span></label>`, [['no', 'Cancelar'], ['ok', 'Fechar versão', 'pri']]);
    if (r !== 'ok') return;
    const nome = clamp(document.getElementById('vN')?.value.trim() || 'Versão', 40);
    db.versoes.push({ id: uid('V'), nome, em: new Date().toISOString(), retratos: retratoAtual() });
    if (document.getElementById('vProx')?.checked) { const n = db.versoes.filter(x => /^Reforecast/i.test(x.nome)).length + 1; db.versaoAtual = `Reforecast ${n}`; }
    agendarSalvar(); toast(`Versão "${nome}" fechada.`);
  };
  $$('[data-vv]', el).forEach(b => b.onclick = () => { verVersao = verVersao === b.dataset.vv ? '' : b.dataset.vv; render(); });
}

/* ---------------------------- abertura e criação ---------------------------- */
async function telaInicial(msg = '') {
  const ult = await arquivoLembrado(LEMBRAR);
  $('#app').innerHTML = `<div class="welcome"><div class="card">
    <div class="row"><div class="logo" style="margin:0">GRP</div><div><h2 style="margin:0">Finanças do Grupo</h2><div class="small muted">Consolidado dos planos financeiros dos times</div></div></div>
    ${msg ? `<div class="banner warn" style="margin-top:12px">${esc(msg)}</div>` : ''}
    ${avisoFS()}
    ${botaoUltimo(ult)}
    <p class="lbl" style="margin-top:20px">É a primeira vez?</p>
    <button class="opt" id="iNovo"><b>Criar o arquivo do grupo</b><span>Pasta pessoal só sua (de preferência no seu OneDrive), senha guardada no cofre, depois times e chaves.</span></button>
    <p class="lbl" style="margin-top:16px">Já tenho o arquivo</p>
    <button class="opt" id="iAbrir"><b>Abrir a pasta local</b><span>Onde está <span class="code">financas-grupo-&lt;nome&gt;.json</span>.</span></button>
  </div></div>`;
  $('#iNovo').onclick = criarDlg; $('#iAbrir').onclick = abrirPasta; ligarUltimo(ult, abrirArquivo, telaInicial);
}
async function abrirPasta() {
  let h; try { h = await escolherPasta('fin-local'); } catch (e) { return; }
  if (!await permissao(h)) return;
  const cand = [];
  for await (const [n, f] of h.entries()) if (f.kind === 'file' && /^financas-grupo-.*\.json$/.test(n)) { try { const o = JSON.parse(await (await f.getFile()).text()); if (o.schema === LOCAL_ENC && o.app === TOOL) cand.push(n); } catch {} }
  if (!cand.length) return telaInicial('Não encontrei um arquivo das Finanças do Grupo nesta pasta.');
  let nome = cand[0];
  if (cand.length > 1) { const r = await perguntar('Qual arquivo?', cand.map((n, i) => `<button class="opt" data-r="${i}"><b class="code">${esc(n)}</b></button>`).join(''), [['no', 'Cancelar']]); if (r == null || r === 'no') return; nome = cand[+r]; }
  await abrirArquivo(h, nome);
}
async function abrirArquivo(h, nome) {
  const texto = await lerTexto(h, nome);
  for (let i = 0; i < 3 && !db; i++) {
    const s = await pedirSenhaDlg('Senha das Finanças do Grupo', i > 0, { sessao: true }); if (s == null) return;
    try { const r = await decifrarLocal(texto, s); db = normalizar(r.dados); ctx = r.ctx; dirLocal = h; arquivo = nome; } catch (e) { if (e.code !== 'SENHA') return telaInicial(e.message); }
  }
  if (!db) return telaInicial('Senha incorreta três vezes.');
  await aposAbrir();
}
async function aposAbrir() {
  render();
  if (await lembreteTesteSenha(db.seg, ctx)) agendarSalvar();
  lembrarArquivo(LEMBRAR, dirLocal, arquivo);
  { const h = await pastaLembrada('fin-grupo-raiz:' + db.grupo.slug); if (h && await permissao(h, false)) await ligarPasta(h, true); }
}
async function criarDlg() {
  if (semFS()) return;
  const p = PRESET || {};
  const d = modal(`<div class="mh"><h2>Criar o arquivo do grupo</h2></div><div class="mb">
    <label class="field"><span>Nome do grupo</span><input class="sin" id="cN" value="${esc(p.grupo?.nome || '')}"></label>
    <div class="f2"><label class="field"><span>Ano fiscal</span><input class="sin" type="number" id="cA" value="${p.ano || new Date().getFullYear()}"></label><label class="field"><span>Moeda</span><select class="sel" id="cM"><option>BRL</option><option>USD</option><option>EUR</option></select></label></div>
    <label class="field"><span>Seu nome</span><input class="sin" id="cP" value="${esc(p.pessoa || '')}"></label></div>
    <div class="mf"><button class="btn" id="cNo">Cancelar</button><button class="btn pri" id="cOk">Escolher pasta local</button></div>`);
  $('#cNo', d).onclick = fecharModal;
  $('#cOk', d).onclick = async () => {
    const nome = $('#cN', d).value.trim(), pessoa = $('#cP', d).value.trim(), ano = +$('#cA', d).value, moeda = $('#cM', d).value;
    if (!nome || !pessoa) return toast('Preencha o nome do grupo e o seu nome.');
    fecharModal();
    if (!await criarArquivo({ nome, pessoa, ano, moeda })) telaInicial();
  };
}
async function escolherPastaLocal() {
  await perguntar('Pasta local', `<p>Escolha a sua <b>pasta pessoal</b>: só sua, de preferência no <b>seu OneDrive</b> (backup se trocar de computador), como <span class="code">OneDrive - Empresa\\GestaoPessoal</span>. Pode ser a mesma das outras ferramentas. Nunca a pasta compartilhada com os times.</p><div class="banner">O arquivo é cifrado com a sua senha: no OneDrive, ninguém consegue ler sem ela.</div>`, [['ok', 'Escolher pasta', 'pri']]);
  let h; try { h = await escolherPasta('fin-local'); } catch { return null; }
  if (!await permissao(h)) return null;
  const s = await suspeitaDeSincronizada(h);
  if (s.length) { if (await perguntar('Esta parece ser a pasta compartilhada', `<div class="cofre">A pasta <b>${esc(h.name)}</b> ${esc(s.join(', '))}. ${AVISO_PASTA_PESSOAL}</div>`, [['no', 'Escolher outra'], ['ok', 'Usar mesmo assim']]) !== 'ok') return escolherPastaLocal(); }
  return h;
}
async function criarArquivo({ nome, pessoa, ano, moeda, dir, senha, times = [] }) {
  const h = dir || await escolherPastaLocal(); if (!h) return false;
  const nomeArq = `financas-grupo-${slugify(nome)}.json`;
  if (await lerTexto(h, nomeArq)) { if (await perguntar('Arquivo já existe', `<p>Já existe <span class="code">${esc(nomeArq)}</span>. Abrir?</p>`, [['no', 'Cancelar'], ['ok', 'Abrir', 'pri']]) === 'ok') { await abrirArquivo(h, nomeArq); return true; } return false; }
  senha ??= await criarSenhaDlg(); if (!senha) return false;
  db = novoDb({ nome, ano, moeda, pessoa }); db.seg.cofreConfirmadoEm = new Date().toISOString();
  for (const t of times) db.times.push({ nome: t.nome, slug: t.slug, prefixo: t.prefixo || '', chaves: [], teto: { total: 0, caps: {} }, tetos: {}, diretriz: {} });
  ctx = await novoCtx(senha, TOOL); dirLocal = h; arquivo = nomeArq;
  await gravarLocal(h, nomeArq, await cifrarLocal(db, ctx));
  view = 'times'; await aposAbrir();
  toast('Arquivo do grupo criado e cifrado. Cadastre os times e gere as chaves.', 5000);
  return true;
}
(async () => { if (!await abrirLembradoSePuder(LEMBRAR, abrirArquivo) || (!db && !$('#app').children.length)) telaInicial(); })();
</script>

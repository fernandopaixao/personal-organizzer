<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finanças do Time</title>
<style>
:root{
  --bv:#223ad2; --bv-deep:#002bab; --bv-mid:#8e9de9; --bv-line:#d5dbf7; --bv-soft:#f2f4fd;
  --ink:#161a23; --muted:#6f7689; --faint:#aab0bf; --line:#eceef4; --bg:#fafafc; --card:#fff; --late:#c4574f; --late-soft:#fbefee;
  --ok:#2f7d5b; --ok-soft:#eaf5ef;
  --font:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --title:"BV Leve",Montserrat,Inter,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--bv)}
.hidden{display:none!important}
.muted{color:var(--muted)}.faint{color:var(--faint)}.grow{flex:1}.small{font-size:12px}.bvc{color:var(--bv)}.latec{color:var(--late)}.okc{color:var(--ok)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rail{position:fixed;left:0;top:0;bottom:0;width:84px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:2px;z-index:20}
.logo{width:36px;height:36px;border-radius:10px;background:var(--bv);color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--title);margin-bottom:12px;font-size:11px}
.nv{width:70px;padding:8px 0 6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;position:relative;text-align:center}
.nv svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nv:hover{color:var(--ink)}.nv.on{color:var(--bv);background:var(--bv-soft);font-weight:600}
.nv .b{position:absolute;top:3px;right:10px;min-width:15px;height:15px;border-radius:8px;background:var(--late);color:#fff;font-size:9.5px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.main{margin-left:84px;padding:0 clamp(18px,2.6vw,56px) 80px}
.top{position:sticky;top:0;z-index:10;background:rgba(250,250,252,.95);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:14px 0 12px;flex-wrap:wrap}
.top h1{margin:0;font-family:var(--title);font-size:20px;font-weight:600;letter-spacing:-.02em}
.top .sub{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.pill .led{width:7px;height:7px;border-radius:50%;background:var(--bv)}.pill .led.wait{background:var(--faint)}.pill .led.err{background:var(--late)}
button.pill:hover{border-color:#cfd3e0;color:var(--ink)}
.banner{background:var(--bv-soft);border:1px solid var(--bv-line);color:var(--bv-deep);border-radius:12px;padding:9px 14px;margin:0 0 14px;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--late-soft);border-color:#f0cfcc;color:#8a2f28}
.aviso-fs{margin-top:16px;line-height:1.5}.aviso-fs.pisca{animation:pisca-fs .9s ease 2}
@keyframes pisca-fs{50%{box-shadow:0 0 0 4px #e8a29b;transform:scale(1.01)}}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-weight:550;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:#cfd3e0}.btn.pri{background:var(--bv);border-color:var(--bv);color:#fff}.btn.pri:hover{background:var(--bv-deep)}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:8px}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.danger{color:var(--late)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}.btn.ghost:hover{color:var(--ink);background:#f0f1f6}
.sg{display:inline-flex;background:#f0f1f6;border-radius:10px;padding:2px;gap:2px;flex-wrap:wrap}
.sg button{padding:5px 12px;border-radius:8px;color:var(--muted);font-weight:550;font-size:12.5px}
.sg button.on{background:#fff;color:var(--bv);box-shadow:0 1px 2px rgba(20,30,70,.1)}
.sel,.sin,textarea.sin{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;outline:none;font-size:12.5px;min-width:0}
.sel:focus,.sin:focus{border-color:var(--bv);box-shadow:0 0 0 3px var(--bv-soft)}
textarea.sin{width:100%;resize:vertical;min-height:60px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:550;padding:1px 8px;border-radius:99px;background:#f2f3f8;color:var(--muted);white-space:nowrap}
.chip.bv{background:var(--bv-soft);color:var(--bv)}.chip.late{background:var(--late-soft);color:var(--late)}.chip.ok{background:var(--ok-soft);color:var(--ok)}
.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.lbl{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2{font-family:var(--title);font-size:16px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:14px;font-weight:650;margin:0}
.empty{color:var(--faint);padding:14px 0;font-size:12.5px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}.kpi b{display:block;font-family:var(--title);font-size:21px;font-weight:600;letter-spacing:-.02em}.kpi span{font-size:11.5px;color:var(--muted)}
.kpi.alert b{color:var(--late)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.tot td{font-weight:650;background:#f7f8fb}
table.t tr:hover td{background:#fbfbfe}
.scroll{overflow-x:auto}
.cell{width:92px;text-align:right;border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 5px;font-variant-numeric:tabular-nums}
.cell:hover{border-color:var(--line)}.cell:focus{border-color:var(--bv);background:#fff;outline:none}
.cell.closed{color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:12.5px;z-index:100;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
dialog{border:0;border-radius:18px;padding:0;width:min(620px,94vw);max-height:90vh;box-shadow:0 24px 64px rgba(20,30,70,.25)}
dialog.wide{width:min(900px,96vw)}
dialog::backdrop{background:rgba(22,26,35,.35)}
dialog[open]{display:flex;flex-direction:column}dialog>.mb{flex:1;min-height:0}
.mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);background:#fff}
.mb{padding:16px 20px;overflow:auto}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field>span{font-size:11.5px;font-weight:600;color:var(--muted)}
.field .sin,.field .sel{width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.cofre{border:1.5px solid var(--late);background:var(--late-soft);border-radius:14px;padding:12px 14px;color:#6d2620;font-size:12.5px;margin:6px 0 12px}
.cofre b{color:#8a2f28}
.quick{position:relative;margin-bottom:16px}
.quick input{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;font-size:13px}
.quick input:focus{border-color:var(--bv);box-shadow:0 0 0 3px var(--bv-soft)}
.quick .pl{position:absolute;left:13px;top:7px;color:var(--bv);font-weight:700;font-size:16px}
.quick .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.al{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}.al:last-child{border-bottom:0}
.al .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;background:var(--bv)}.al .dot.late{background:var(--late)}
.welcome{max-width:640px;margin:8vh auto;padding:0 20px}
.welcome .card{padding:26px 28px}
.steps{display:flex;gap:6px;margin:0 0 18px;flex-wrap:wrap}.steps i{height:4px;flex:1;min-width:30px;border-radius:2px;background:#e6e8f0}.steps i.on{background:var(--bv)}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;background:#fff}
.opt:hover{border-color:var(--bv-mid)}.opt.on{border-color:var(--bv);background:var(--bv-soft)}
.opt b{display:block;font-size:13.5px}.opt span{font-size:12px;color:var(--muted)}
.map{display:grid;grid-template-columns:1fr 1fr;gap:12px}.map>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px}
.map h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
svg.ch{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (max-width:720px){.rail{position:fixed;top:auto;bottom:0;width:100%;height:62px;flex-direction:row;justify-content:space-around;padding:0;border-right:0;border-top:1px solid var(--line)}.logo{display:none}.main{margin-left:0;padding-bottom:90px}.f2,.map{grid-template-columns:1fr}}
/* ---- Finanças 1.2: cards de leitura, medidores e gráficos (branco e azul, destaque discreto) ---- */
.top .sg{background:transparent;padding:0;gap:4px}.top .sg button{padding:4px 11px;border:1px solid transparent}.top .sg button.on{background:#fff;border-color:var(--bv-line);box-shadow:none}
.subnav{flex-basis:100%;display:flex;gap:4px;margin-top:-2px}
.subnav button{padding:5px 12px;border-radius:99px;color:var(--muted);font-weight:550;font-size:12.5px;border:1px solid transparent}
.subnav button:hover{color:var(--ink)}.subnav button.on{color:var(--bv);background:#fff;border-color:var(--bv-line)}
.inss{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.ins{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px 13px;display:flex;flex-direction:column;gap:7px;min-width:0}
.ins .k{font-size:11.5px;color:var(--muted);font-weight:550;display:flex;gap:6px;align-items:center}
.ins .v{font-family:var(--title);font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.ins .s{font-size:12px;color:var(--muted)}.ins .s b{color:var(--ink);font-weight:600}
.ins.hi{background:linear-gradient(160deg,var(--bv) 0%,var(--bv-deep) 100%);border-color:var(--bv);color:#fff}
.ins.hi .k,.ins.hi .s{color:rgba(255,255,255,.78)}.ins.hi .s b{color:#fff}.ins.hi .m{background:rgba(255,255,255,.22)}.ins.hi .m i{background:#fff}.ins.hi .m em{background:#fff}
.m{height:6px;border-radius:3px;background:var(--bv-soft);position:relative}
.m i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--bv);max-width:100%}
.m.over i{background:var(--bv-deep)}.m em{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--ink)}
.tag{font-size:10.5px;font-weight:650;padding:1px 7px;border-radius:99px;background:var(--bv-soft);color:var(--bv)}.tag.late{background:var(--late-soft);color:var(--late)}
.hb{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:9px 12px;align-items:center;font-size:12.5px}
.hb .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .val{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.hb .tr{height:10px;border-radius:5px;background:var(--bv-soft);position:relative}.hb .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--bv)}
.hb .tr em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}.hb .tr em.cap{background:var(--late)}
.g21{display:grid;gap:16px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}@media (max-width:980px){.g21{grid-template-columns:1fr}}
.card.flat{padding:14px 18px}
.al.compact{padding:6px 0}
svg.ch{max-height:280px}

</style>
<script id="tema">
/* Tema claro, escuro ou automático (segue o sistema), comum a todas as ferramentas da solução.
   Injetado no <head> de cada HTML por tools/build_financas.py e tools/injetar_seguranca.py.
   - A escolha fica só neste computador (localStorage 'gestao.tema') e vale para todas as ferramentas.
   - No escuro, as variáveis da identidade (--bv, --ink, --line...) ganham a paleta escura e as cores
     fixas das folhas de estilo, dos estilos inline e dos gráficos SVG são convertidas por papel
     (fundo, texto, borda), sem tocar no código de cada ferramenta. Voltar para o claro restaura tudo. */
(() => {
  if (window.gestaoTema) return;
  const CHAVE = 'gestao.tema', html = document.documentElement;
  const mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : { matches: false, addEventListener() {} };
  const ler = () => { try { const v = localStorage.getItem(CHAVE); return v === 'claro' || v === 'escuro' ? v : 'auto'; } catch { return 'auto'; } };
  let pref = ler(), escuro = false;

  // ---- Paleta escura: mesmo branco-e-azul, invertido para azul-noite, com o azul BV mais luminoso ----
  const VARS = '--bv:#5066ec;--bv-deep:#3a4fd6;--bv-t:#8d9cf9;--bv-deep-t:#a9b4ff;--bv-mid:#8190ee;--bv-line:#2f3a6b;--bv-soft:#1a2142;'
    + '--ink:#e6e9f2;--muted:#99a1b7;--faint:#68708a;--line:#262d40;--bg:#0e121c;--card:#161b29;'
    + '--late:#ec7d74;--late-soft:#3a1f24;--ok:#5cc292;--ok-soft:#15302a;--raised:#1e2436';
  const CSS = `:root[data-tema="escuro"]{${VARS};color-scheme:dark}
:root[data-tema="escuro"] body{background:var(--bg);color:var(--ink)}
:root[data-tema="escuro"] dialog{background:var(--card);color:var(--ink)}
:root[data-tema="escuro"] .toast{background:#2a3147!important;color:var(--ink)!important;box-shadow:0 8px 24px rgba(0,0,0,.5)!important}
:root[data-tema="escuro"] .ins.hi .m i,:root[data-tema="escuro"] .ins.hi .m em{background:#fff}
:root[data-tema="escuro"] img{filter:brightness(.92)}
:root[data-tema="escuro"] ::selection{background:#34407a}
#temaSel{position:fixed;right:14px;bottom:14px;z-index:90;font:500 12px/1 Inter,"Segoe UI",system-ui,sans-serif}
#temaSel>button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line,#eceef4);background:var(--card,#fff);color:var(--muted,#6f7689);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(20,30,70,.12);padding:0}
#temaSel>button:hover{color:var(--bv,#223ad2);border-color:var(--bv-line,#d5dbf7)}
#temaSel svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#temaSel .menu{position:absolute;right:0;bottom:42px;background:var(--card,#fff);border:1px solid var(--line,#eceef4);border-radius:12px;padding:4px;box-shadow:0 12px 32px rgba(20,30,70,.18);display:none;min-width:150px}
#temaSel.aberto .menu{display:block}
#temaSel .menu button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;color:var(--ink,#161a23);cursor:pointer;text-align:left;font:inherit;font-size:12.5px}
#temaSel .menu button:hover{background:var(--bv-soft,#f2f4fd)}
#temaSel .menu button.on{color:var(--bv,#223ad2);font-weight:650}
#temaSel .menu small{display:block;color:var(--muted,#6f7689);font-size:10.5px;padding:4px 10px 6px}
@media print{#temaSel{display:none}}`;

  // ---- Cores: leitura, HSL e conversão por papel ----
  const NOMES = { white: [255, 255, 255], black: [0, 0, 0] };
  function parse(s) {
    s = s.trim().toLowerCase();
    if (NOMES[s]) return [...NOMES[s], 1];
    let m = s.match(/^#([0-9a-f]{3,8})$/);
    if (m) {
      let h = m[1]; if (h.length === 3 || h.length === 4) h = [...h].map(c => c + c).join('');
      if (h.length !== 6 && h.length !== 8) return null;
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), h.length === 8 ? parseInt(h.slice(6), 16) / 255 : 1];
    }
    m = s.match(/^rgba?\(([^)]*)\)$/);
    if (m) {
      const p = m[1].split(/[\s,\/]+/).filter(Boolean); if (p.length < 3 || p.slice(0, 3).some(x => isNaN(parseFloat(x)))) return null;
      const a = p[3] == null ? 1 : (p[3].endsWith('%') ? parseFloat(p[3]) / 100 : parseFloat(p[3]));
      return [+p[0], +p[1], +p[2], a];
    }
    return null;
  }
  function hsl([r, g, b]) {
    r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
    if (!d) return [0, 0, l];
    const s = d / (1 - Math.abs(2 * l - 1));
    const h = mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [h * 60, s, l];
  }
  function rgb(h, s, l) {
    const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
    const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
    return [r, g, b].map(v => Math.round(Math.min(1, Math.max(0, v + m)) * 255));
  }
  const fmt = ([r, g, b], a) => a >= 1 ? `rgb(${r}, ${g}, ${b})` : `rgba(${r}, ${g}, ${b}, ${+a.toFixed(3)})`;
  const hex = c => '#' + c.slice(0, 3).map(v => v.toString(16).padStart(2, '0')).join('');
  // Cores da identidade com destino fixo, por papel (fundo, texto, borda).
  const FIXO = {
    '#ffffff': { f: '#161b29', b: '#262d40' }, '#fafafc': { f: '#0e121c' }, '#fbfbfd': { f: '#0e121c' },
    '#223ad2': { f: '#5066ec', t: '#8d9cf9', b: '#5066ec' }, '#002bab': { f: '#3a4fd6', t: '#a9b4ff', b: '#3a4fd6' },
    '#161a23': { f: '#2a3147', t: '#e6e9f2', b: '#3a4258' }, '#c4574f': { f: '#d9665d', t: '#ec7d74', b: '#c4574f' },
    '#f2f4fd': { f: '#1a2142', b: '#2f3a6b' }, '#d5dbf7': { f: '#2f3a6b', b: '#2f3a6b' }, '#8e9de9': { t: '#a3afef', b: '#5d6cc4' },
    '#eceef4': { f: '#232a3c', b: '#262d40' }, '#fbefee': { f: '#3a1f24', b: '#5a2c30' },
  };
  function converter(papel, c) {
    const [r, g, b, a] = c, fx = FIXO[hex(c)];
    if (fx && fx[papel]) return fmt(parse(fx[papel]), a);
    let [h, s, l] = hsl([r, g, b]);
    const croma = s * (1 - Math.abs(2 * l - 1)), neutro = croma < 0.09;
    if (papel === 't') {                                   // texto: claro sobre fundo escuro
      if (l > 0.9) return null;                            // texto branco (sobre azul, vermelho...) continua branco
      if (neutro) return fmt(rgb(h, Math.min(s, 0.18), 0.92 - l * 0.62), a);

<script id="sessao">
/* sessao 1.1 · uma senha por sessão (ADR-0029, ADR-0035)
   Quem abre (hub, Central) guarda só em memória a senha que abriu o próprio arquivo. Quando a pessoa clica num link
   para outra ferramenta (target=_blank rel=opener), a janela nova pede a senha e o abridor responde uma vez, só nos
   90 segundos seguintes ao clique e só para uma janela aberta por ele (e.source.opener === window).
   1.1: o abridor também pode guardar a senha de uma ferramenta específica (definir(senha, 'central')); o link com
   data-sessao="central" leva essa senha em vez da senha da sessão. Serve para a Central com senha própria.
   A ferramenta aberta usa a senha só para abrir o próprio arquivo; se não servir, pede a senha como sempre.
   Nada vai para disco, localStorage ou para a pasta. Injetado em todos os HTMLs pelo build, junto com o tema. */
(() => {
  if (window.gestaoSessao) return;
  const SC = 'gestao-sessao/1', JANELA = 90e3;
  let senha = null, cliqueEm = 0, alvo = '', recebida = null, usada = false;
  const porAlvo = {};
  const temAlguma = () => !!senha || Object.keys(porAlvo).length > 0;
  document.addEventListener('click', e => {
    const a = e.target && e.target.closest && e.target.closest('a[target="_blank"][rel~="opener"]');
    if (a && temAlguma()) { cliqueEm = Date.now(); alvo = (a.dataset && a.dataset.sessao) || ''; }
  }, true);
  window.addEventListener('message', e => {
    const m = e.data; if (!m || m.schema !== SC) return;
    if (m.tipo === 'pedir') {
      const s = (alvo && porAlvo[alvo]) || senha;
      if (!s || !cliqueEm || Date.now() - cliqueEm > JANELA) return;
      let filha = false; try { filha = !!e.source && e.source.opener === window; } catch {}
      if (!filha) return;
      cliqueEm = 0; alvo = '';
      try { e.source.postMessage({ schema: SC, tipo: 'senha', senha: s }, '*'); } catch {}
    } else if (m.tipo === 'senha') {
      if (!window.opener || e.source !== window.opener || recebida !== null || typeof m.senha !== 'string' || !m.senha) return;
      recebida = m.senha.slice(0, 500);
      window.dispatchEvent(new Event('gestao-sessao'));
    }
  });
  if (window.opener) try { window.opener.postMessage({ schema: SC, tipo: 'pedir' }, '*'); } catch {}
  window.gestaoSessao = {
    // definir(senha) troca a senha da sessão; definir(null) esquece todas; definir(senha, 'central') guarda a de uma ferramenta.
    definir(s, para) {
      if (para) { if (s) porAlvo[para] = String(s); else delete porAlvo[para]; return; }
      senha = s ? String(s) : null;
      if (!s) { cliqueEm = 0; alvo = ''; for (const k of Object.keys(porAlvo)) delete porAlvo[k]; }
    },
    get recebida() { return recebida; },
    // Entrega a senha recebida uma única vez (para abrir o próprio arquivo).
    usar() { if (recebida == null || usada) return null; usada = true; return recebida; },
    get usada() { return usada; }
  };
})();
</script>

<script>
/* ======================================================================
   nucleo-sync 1.0 · bloco comum das ferramentas da solução
   (finanças do grupo, finanças do time, assistente inicial)
   - criptografia: arquivo local com senha (PBKDF2 600k + AES-256-GCM)
     e envelope gestao-envelope/1 com chave aleatória por time
   - pasta sincronizada (OneDrive/SharePoint): escrita segura, um dono por
     arquivo, revisão monotônica, confere-antes-de-gravar, cópias de conflito
   - aviso de senha e cofre, lembrete de teste da senha, "Onde estou?"
   Este arquivo é injetado no HTML pelo build (tools/build_financas.py).
   ====================================================================== */
const NUCLEO_VERSION = '1.0.0';
const te = new TextEncoder(), td = new TextDecoder();
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const clamp = (s, n) => String(s ?? '').slice(0, n);

  enc: u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); },

/* ---------------------------- dinheiro e datas ---------------------------- */
// Valores sempre em centavos inteiros.
const fmtMoeda = (c, moeda = 'BRL', dec = false) => ((c || 0) / 100).toLocaleString('pt-BR', { style: 'currency', currency: moeda, minimumFractionDigits: dec ? 2 : 0, maximumFractionDigits: dec ? 2 : 0 });
const fmtCurto = (c) => { const v = (c || 0) / 100, a = Math.abs(v); return a >= 1e6 ? (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi' : a >= 1e3 ? (v / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' mil' : v.toLocaleString('pt-BR', { maximumFractionDigits: 0 }); };

function parseValor(txt) {
  let s = String(txt ?? '').trim().toLowerCase().replace(/r\$\s*/g, '').replace(/\s+/g, ' ');
  if (!s) return null;

  const m = /^(-?[\d.,]+)\s*(k|mil|mi|milh[oõ]es|milh[aã]o)?$/.exec(s);

const hojeISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };

const NOMES_MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const nomeMes = m => NOMES_MES[+m.slice(5, 7) - 1] + (m.slice(0, 4) !== String(new Date().getFullYear()) ? '/' + m.slice(2, 4) : '');

  const o = -d.getTimezoneOffset(), s = o >= 0 ? '+' : '-', a = Math.abs(o);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}${s}${pad2(Math.floor(a / 60))}:${pad2(a % 60)}`;

/* ------------------------------ IndexedDB kv ------------------------------ */
const kv = (() => {
  let dbp = null;
  const open = () => dbp ??= new Promise((ok, err) => { const r = indexedDB.open('nucleo-sync', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => err(r.error); });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((ok, err) => { const t = db.transaction('kv', mode); const st = t.objectStore('kv'); const r = fn(st); t.oncomplete = () => ok(r?.result); t.onerror = () => err(t.error); }); };
  return { get: k => tx('readonly', s => s.get(k)).catch(() => undefined), set: (k, v) => tx('readwrite', s => s.put(v, k)).catch(() => {}), del: k => tx('readwrite', s => s.delete(k)).catch(() => {}) };

/* ---------------------- arquivo e pastas lembrados (ADR-0030) ---------------------- */
// O assistente grava, neste navegador, onde ficou o arquivo de cada ferramenta e a pasta sincronizada;

const lembrarAtivo = () => !navigator.webdriver || window.__lembrar === true;
async function lembrarArquivo(chave, dir, arquivo) { if (lembrarAtivo() && dir && arquivo) await kv.set('local:' + chave, { dir, arquivo }); }

async function pastaLembrada(chave) { if (!lembrarAtivo()) return null; return (await kv.get(chave)) || null; }

async function abrirLembradoSePuder(chave, abrir) {
  const u = await arquivoLembrado(chave); if (!u) return false;
  try { if (!await permissao(u.dir, false) || !await lerTexto(u.dir, u.arquivo)) return false; } catch { return false; }
  await abrir(u.dir, u.arquivo); return true;
}
// Botão "Abrir <arquivo>" da tela inicial (um clique libera a pasta quando a permissão expirou).
function botaoUltimo(u) {
  return u ? `<button class="opt" id="iUlt" style="margin-top:18px"><b>Abrir ${esc(u.arquivo)}</b><span>Pasta pessoal <span class="code">${esc(u.dir.name)}</span>, usada por último neste computador.</span></button>` : '';
}
function ligarUltimo(u, abrir, tela) { const b = document.getElementById('iUlt'); if (b && u) b.onclick = async () => { if (!await permissao(u.dir)) return tela('Sem permissão na pasta.'); await abrir(u.dir, u.arquivo); }; }

/* ---------------------- identidade do computador (dispositivo) ---------------------- */
// Identificador aleatório e curto, guardado no navegador. Junto com a pessoa forma o "dono"
// de um arquivo comum: ana-k3f9. Nunca usa o nome real do computador.
function dispositivo() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem('nucleo.dispositivo') || 'null'); } catch {}
  if (!d?.id) { d = { id: Array.from(crypto.getRandomValues(new Uint8Array(3)), x => x.toString(36).padStart(2, '0')).join('').slice(0, 5), nome: '' }; try { localStorage.setItem('nucleo.dispositivo', JSON.stringify(d)); } catch {} }
  return d;
}
function nomearDispositivo(nome) { const d = dispositivo(); d.nome = clamp(nome, 40); try { localStorage.setItem('nucleo.dispositivo', JSON.stringify(d)); } catch {} }

/* ---------------------- relógio lógico híbrido (HLC) ---------------------- */
// "<ms>.<contador>": cresce sempre, mesmo se o relógio do computador voltar.
function hlcAgora(visto) {
  let ult = { t: 0, c: 0 };
  try { ult = JSON.parse(localStorage.getItem('nucleo.hlc') || '{"t":0,"c":0}'); } catch {}
  const vis = hlcLer(visto);

// O cliente do OneDrive não sobrescreve quando dois computadores gravam o mesmo arquivo:

async function lerEmbutido(id) {
  const el = document.getElementById(id); if (!el) throw new Error('HTML embutido não encontrado: ' + id);
  const bytes = b64.dec(el.textContent.trim());
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(s).text();
}
// Troca o bloco entre /*<MARCA>*/ e /*FIM-<MARCA>*/ por um JSON (escapado para <script>).
function aplicarPreset(html, marca, obj) {
  const ini = `/*${marca}*/`, fim = `/*FIM-${marca}*/`, i = html.indexOf(ini), j = html.indexOf(fim);
  if (i < 0 || j < i) throw new Error('O HTML não tem o marcador de pré-configuração ' + marca);
  const json = JSON.stringify(obj).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
  return html.slice(0, i + ini.length) + json + html.slice(j);
}
function baixar(nome, texto, tipo = 'application/json') {

}

// Card de leitura: rótulo, número, medidor (pct de 0 a 1+, marca opcional) e uma frase que interpreta.
function cardLeitura({ k, v, pct = null, marca = null, s = '', tag = '', hi = false }) {
  const p = pct == null ? '' : `<div class="m ${pct > 1 ? 'over' : ''}"><i style="width:${Math.max(0, Math.min(1, pct)) * 100}%"></i>${marca != null ? `<em style="left:${Math.max(0, Math.min(1, marca)) * 100}%"></em>` : ''}</div>`;

// Barras horizontais: [{ nome, valor, ref (marca preta), cap (marca de teto), rotulo, attrs }]
function barrasH(itens, fmt) {
  if (!itens.length) return '<div class="empty">Nada para mostrar ainda.</div>';
  const max = Math.max(1, ...itens.map(x => Math.max(x.valor || 0, x.ref || 0, x.cap || 0)));
  const pc = v => (v / max * 100).toFixed(2) + '%';
  return `<div class="hb">${itens.map(x => `<div class="n" title="${esc(x.titulo || '')}">${x.nome}</div><div class="tr" title="${esc(x.titulo || '')}"><i style="width:${pc(x.valor || 0)}${x.cor ? ';background:' + x.cor : ''}"></i>${x.ref ? `<em style="left:${pc(x.ref)}"></em>` : ''}${x.cap ? `<em class="cap" style="left:${pc(x.cap)}"></em>` : ''}</div><div class="val">${x.rotulo ?? fmt(x.valor || 0)}</div>`).join('')}</div>`;
}
// Curva acumulada do ano: séries [{ nome, cor, v: [por mês], ate (índice do último mês com dado), tracejada, area }]
function curvaAcumulada(ms, series, fmt, hojeIdx = -1) {
  const acc = series.map(s => { let a = 0; return { ...s, c: s.v.map((x, i) => (s.ate != null && i > s.ate) ? null : (a += x || 0)) }; });
  const max = Math.max(1, ...acc.flatMap(s => s.c.filter(x => x != null)));
  const W = 760, H = 230, pl = 10, pr = 96, pt = 12, pb = 26, X = i => pl + i * (W - pl - pr) / Math.max(1, ms.length - 1), Y = v => H - pb - (v / max) * (H - pt - pb);
  let svg = [0.25, 0.5, 0.75, 1].map(f => `<line x1="${pl}" x2="${W - pr}" y1="${Y(max * f)}" y2="${Y(max * f)}" stroke="var(--line)"/>`).join('');
  if (hojeIdx >= 0 && hojeIdx < ms.length) svg += `<line x1="${X(hojeIdx)}" x2="${X(hojeIdx)}" y1="${pt}" y2="${H - pb}" stroke="var(--bv-line)" stroke-dasharray="3 3"/><text x="${X(hojeIdx)}" y="${pt + 8}" text-anchor="middle" font-size="10" fill="var(--faint)">hoje</text>`;
  const ocupados = [];
  for (const s of acc) {
    const pts = s.c.map((v, i) => v == null ? null : [X(i), Y(v)]).filter(Boolean); if (!pts.length) continue;
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    if (s.area) svg += `<path d="${d} L${pts.at(-1)[0].toFixed(1)} ${H - pb} L${pts[0][0].toFixed(1)} ${H - pb} Z" fill="${s.cor}" opacity=".08"/>`;
    svg += `<path d="${d}" fill="none" stroke="${s.cor}" stroke-width="${s.fina ? 1.5 : 2.4}" ${s.tracejada ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
    const u = pts.at(-1), ult = s.c.filter(x => x != null).at(-1); let ty = u[1] + 4; while (ocupados.some(o => Math.abs(o - ty) < 13)) ty += 13; ocupados.push(ty);
    svg += `<circle cx="${u[0]}" cy="${u[1]}" r="3.2" fill="${s.cor}"/><text x="${u[0] + 8}" y="${ty}" font-size="11" fill="${s.cor}" font-weight="600">${esc(fmt(ult))}</text>`;
  }
  svg += ms.map((m, i) => `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${nomeMes(m)}</text>`).join('');
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva acumulada do ano">${svg}</svg><div class="legend">${series.map(s => `<span><i style="background:${s.cor};${s.tracejada ? 'height:2px' : ''}"></i>${esc(s.nome)}</span>`).join('')}</div>`;
}

<script>

function totais(meses = mesesAno(), filtro = () => true) {
  const t = { orcado: 0, previsto: 0, realizado: 0 };
  for (const l of db.linhas.filter(filtro)) for (const m of meses) { t.orcado += orcado(l, m); t.previsto += previsto(l, m); t.realizado += realizado(l.id, m); }
  return t;
}
const fm = c => fmtMoeda(c, db.moeda);

/* ----------------------------- plano publicado ----------------------------- */
function montarPlano(meta) {
  const ms = todosMeses(), ult = Math.max(...db.anos), prox = Array.from({ length: 12 }, (_, i) => somaMeses(`${ult}-12`, i + 1));
  const lines = db.linhas.map(l => {
    const c = catPorId(l.cat) || { id: l.cat, tipo: 'OPEX' };
    const months = {};
    for (const m of [...ms, ...prox]) {
      const v = { budget: orcado(l, m), forecast: previsto(l, m), actual: realizado(l.id, m) };
      if (v.budget || v.forecast || v.actual) months[m] = v;
    }
    return { id: l.id, name: clamp(l.nome, 120), category: c.id, kind: c.tipo, costCenter: l.centro || undefined, initiative: l.iniciativa || undefined, supplier: l.fornecedor || undefined, months };
  });
  const t = totais(mesesAno(db.ano));
  const porAno = Object.fromEntries(db.anos.map(a => { const x = totais(mesesAno(a)); return [a, { budget: x.orcado, forecast: x.previsto, actual: x.realizado }]; }));
  return {
    schema: PLANO_SCHEMA, ...meta,
    source: { team: db.team.slug, tool: TOOL, toolVersion: TOOL_VERSION },
    team: { name: db.team.nome, slug: db.team.slug },
    fiscalYear: db.ano, fiscalYears: [...db.anos], currency: db.moeda, planVersion: db.versaoPlano, closedMonths: [...db.fechados].sort(),
    categories: db.categorias.map(c => ({ id: c.id, name: c.nome, kind: c.tipo })),
    lines,
    commitments: db.compromissos.map(c => ({ name: clamp(c.nome, 120), line: c.linha, monthly: c.valor, start: c.inicio, end: c.fim || undefined })),
    totals: { budget: t.orcado, forecast: t.previsto, actual: t.realizado }, totalsByYear: porAno,
    directiveRevision: db.diretriz?.revision || undefined
  };
}
const assinaturaPlano = () => JSON.stringify(montarPlano({ revision: 0, generatedAt: '', hlc: '' }));

function agendarSalvar() { sujo = true; clearTimeout(salvarT); salvarT = setTimeout(salvar, 1200); render(); }
async function salvar() {
  if (!db || !ctx || !dirLocal || salvando) return;
  salvando = true;
  try { await gravarLocal(dirLocal, arquivo, await cifrarLocal(db, ctx)); sujo = false; }
  catch (e) { toast('Não foi possível salvar: ' + e.message, 6000); }
  finally { salvando = false; renderTopo(); }

window.addEventListener('beforeunload', e => { if (!db) return; if (sujo) { salvar(); e.preventDefault(); e.returnValue = ''; } desmarcarAberto(dirPlano, writer()); });
async function carregarChaves() {
  chaves = new Map();
  for (const c of db.chaves) { try { const k = lerChaveTexto(c.texto); chaves.set(k.kid, await importarChave(k.raw)); } catch {} }
}
const chaveAtual = () => { const c = db.chaves.filter(x => !x.revogada).at(-1); return c && chaves.has(c.kid) ? { kid: c.kid, key: chaves.get(c.kid) } : null; };
async function cadastrarChave(texto, origem = 'colada') {
  const k = lerChaveTexto(texto);
  if (!db.chaves.some(c => c.kid === k.kid)) db.chaves.push({ kid: k.kid, texto: texto.trim(), em: new Date().toISOString(), origem });
  await carregarChaves(); agendarSalvar();
  return k.kid;
}

let dirPlano = null, dirDiretriz = null, pollT = null, abertoT = null;
async function ligarPasta(h, silencioso = false) {
  if (!await permissao(h, !silencioso)) { if (!silencioso) toast('Sem permissão na pasta.'); return false; }
  const v = await validarPastaComum(h);
  if (!v.tem && !silencioso) {
    const r = await perguntar('Esta é a pasta compartilhada?', `<p>A pasta <b class="code">${esc(h.name)}</b> ainda não tem a estrutura da solução (pastas <span class="code">times/</span> e <span class="code">grupo/</span>).</p>
      <p class="muted small">Escolha a pasta raiz sincronizada pelo OneDrive (normalmente <span class="code">${PASTA_COMUM}</span>, de uma biblioteca do SharePoint). Se for esta mesma, a ferramenta cria só <span class="code">times/${esc(db.team.slug)}/financas/</span>.</p>`, [['no', 'Escolher outra'], ['ok', 'É esta, criar', 'pri']]);
    if (r !== 'ok') return false;
  }
  raiz = h;
  dirPlano = await subpasta(raiz, ['times', db.team.slug, 'financas'], true);
  dirDiretriz = await subpasta(raiz, ['grupo', 'financas'], false);
  db.pastaComum = h.name; agendarSalvar();
  lembrarPasta('fin-time-raiz:' + db.team.slug, h);
  await lerPasta(); iniciarPolling();
  return true;
}
function iniciarPolling() {
  clearInterval(pollT); clearInterval(abertoT);
  pollT = setInterval(() => lerPasta(true), 45000);
  marcarAberto(dirPlano, writer(), TOOL); abertoT = setInterval(() => marcarAberto(dirPlano, writer(), TOOL), 60000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && raiz) lerPasta(true); });
async function lerPasta(silencioso = false) {
  if (!raiz) return;
  situacao.erro = '';
  try {
    dirDiretriz ??= await subpasta(raiz, ['grupo', 'financas'], false);
    const dlida = await lerEnvelopes(dirDiretriz, `diretriz-${db.team.slug}`, chaves, { team: db.team.slug, content: DIRETRIZ_SCHEMA });
    if (dlida.melhor) {
      const p = dlida.melhor.payload;
      if (!db.diretriz || p.revision > db.diretriz.revision) {
        db.diretriz = p; agendarSalvar();
        if (!silencioso) toast(`Diretriz do grupo lida (revisão ${p.revision}).`);
        aplicarCategoriasDiretriz();
      }
    }
    const plido = await lerEnvelopes(dirPlano, 'plano', chaves, { team: db.team.slug, content: PLANO_SCHEMA });
    situacao.lida = plido.melhor?.payload || null;
    situacao.conflitos = plido.copias;
    situacao.invalidos = plido.invalidos.filter(x => x.principal);
    situacao.outros = await abertosEmOutros(dirPlano, writer());
    situacao.diretrizInvalida = dlida.invalidos.length && !dlida.melhor ? dlida.invalidos[0].erro : '';
  } catch (e) { situacao.erro = e.message; }
  render();
}
function aplicarCategoriasDiretriz() {
  const cs = db.diretriz?.categories; if (!Array.isArray(cs) || !cs.length) return;
  for (const c of cs) {
    const id = slugify(c.id || c.name); if (!id) continue;
    const ex = catPorId(id);
    if (ex) { ex.nome = clamp(c.name, 60) || ex.nome; ex.tipo = c.kind === 'CAPEX' ? 'CAPEX' : 'OPEX'; ex.doGrupo = true; }
    else db.categorias.push({ id, nome: clamp(c.name, 60), tipo: c.kind === 'CAPEX' ? 'CAPEX' : 'OPEX', doGrupo: true });
  }
  if (Array.isArray(db.diretriz.costCenters)) db.centros = [...new Set([...db.centros, ...db.diretriz.costCenters.map(x => clamp(x, 40))])];
}
async function publicar(assumir = false) {
  const ch = chaveAtual();
  if (!ch) return toast('Cadastre a chave de finanças do time (aba Grupo) antes de publicar.', 5000);
  if (!raiz) return toast('Ligue a pasta sincronizada antes de publicar.', 5000);
  try {
    const r = await publicarUnico({ dir: dirPlano, base: 'plano', chave: ch, team: db.team.slug, writer: writer(), assumir, ultimaRevisao: db.publicacao.revision || 0,
      montar: { schema: PLANO_SCHEMA, payload: meta => montarPlano(meta) } });
    db.publicacao = { revision: r.revision, em: r.generatedAt, assinatura: assinaturaPlano(), dono: writer() };
    agendarSalvar(); await lerPasta(true);
    toast(`Plano publicado (revisão ${r.revision})${r.removidas.length ? ` · ${r.removidas.length} cópia(s) de conflito resolvida(s)` : ''}.`, 5000);
  } catch (e) {
    if (e.code === 'DONO' || e.code === 'DISPOSITIVO') {
      const r = await perguntar('Assumir a publicação?', `<p>${esc(e.message)}</p><p class="muted small">Cada arquivo comum tem um único dono para evitar conflitos do OneDrive. ${e.code === 'DISPOSITIVO' ? 'Se você trocou de computador, assuma a publicação aqui e pare de publicar do outro.' : 'Combine com essa pessoa antes: depois de assumir, só você publica o plano do time.'}</p>`, [['no', 'Cancelar'], ['ok', 'Assumir e publicar', 'pri']]);
      if (r === 'ok') return publicar(true);
    } else toast('Não foi possível publicar: ' + e.message, 7000);
  }
}

/* -------------------------------- alertas -------------------------------- */
function alertas() {
  const out = [], hoje = hojeISO(), m = mesAtual(), ms = mesesAno();
  const ant = somaMeses(m, -1);
  if (ms.includes(ant) && !fechado(ant)) out.push(['late', `${nomeMes(ant)} ainda não foi fechado.`, 'fechar']);
  if (ms.includes(m) && +hoje.slice(8) > 10 && !db.lancamentos.some(x => x.data.startsWith(m))) out.push(['', `Nenhum lançamento em ${nomeMes(m)} até agora.`]);
  const t = totais();
  if (t.orcado && t.previsto > t.orcado * 1.05) out.push(['late', `Previsto do ano ${fm(t.previsto)} está ${Math.round((t.previsto / t.orcado - 1) * 100)}% acima do orçado (${fm(t.orcado)}).`]);
  const { caps, capTotal } = tetosDoAno();
  for (const [cat, teto] of Object.entries(caps)) {
    const v = totais(ms, l => l.cat === cat).previsto;
    if (teto && v > teto) out.push(['late', `${catPorId(cat)?.nome || cat}: previsto ${fm(v)} acima do teto do grupo (${fm(teto)}).`]);
  }
  if (capTotal && t.previsto > capTotal) out.push(['late', `Previsto total de ${anoV()} acima do teto do grupo (${fm(capTotal)}).`]);
  for (const a of db.anos.filter(a => a > db.ano)) if (!db.linhas.some(l => mesesAno(a).some(m => l.orcado[m] || l.previsto[m]))) { out.push(['', `${a} está no horizonte do plano, mas ainda não tem orçado nem previsto.`, 'anos']); break; }
  for (const c of db.compromissos) if (c.fim && c.fim >= m && c.fim <= somaMeses(m, 2)) out.push(['', `Contrato "${c.nome}" termina em ${nomeMes(c.fim)}: renovar ou encerrar?`]);
  for (const l of db.linhas) for (const mm of ms.filter(fechado)) { const o = orcado(l, mm), r = realizado(l.id, mm); if (o && r > o * 1.1) { out.push(['', `${l.nome}: realizado de ${nomeMes(mm)} ${Math.round((r / o - 1) * 100)}% acima do orçado.`]); break; } }
  if (db.publicacao.revision && db.publicacao.assinatura !== assinaturaPlano()) out.push(['', 'Há mudanças no plano ainda não publicadas para o grupo.', 'publicar']);
  if (!db.publicacao.revision && db.linhas.length) out.push(['', 'O plano ainda não foi publicado para o grupo.', 'publicar']);
  if (situacao.conflitos.length) out.push(['late', `${situacao.conflitos.length} cópia(s) de conflito do OneDrive na pasta do plano. Publicar de novo resolve.`, 'publicar']);
  for (const o of situacao.outros) out.push(['late', `As Finanças do time estão abertas em outro computador (${o.writer}). Evite publicar dos dois.`]);
  if (db.diretriz?.publishBy && db.diretriz.publishBy >= hoje && db.publicacao.assinatura !== assinaturaPlano()) out.push(['', `O grupo pediu o plano até ${fmtData(db.diretriz.publishBy)}.`, 'publicar']);
  return out;
}

function adicionarAno(ano, modo = 'vazio', pct = 0) {
  if (db.anos.includes(ano)) return;
  const ref = ano > db.anos[0] ? ano - 1 : ano + 1;
  if (modo !== 'vazio' && db.anos.includes(ref)) for (const l of db.linhas) for (let i = 0; i < 12; i++) {
    const mRef = `${ref}-${pad2(i + 1)}`, m = `${ano}-${pad2(i + 1)}`;
    const v = modo === 'orc' ? orcado(l, mRef) : previsto(l, mRef);
    if (v) l.orcado[m] = Math.round(v * (1 + pct / 100));
  }
  db.anos = [...db.anos, ano].sort();
}

function tabelaCategorias() {

  const linhas = db.categorias.map(c => ({ c, t: totais(ms, l => l.cat === c.id) })).filter(x => x.t.orcado || x.t.previsto || x.t.realizado || caps[x.c.id]).sort((a, b) => b.t.previsto - a.t.previsto);

}
function grafico(ms, extras = {}) {
  const dados = ms.map(m => { let o = 0, p = 0, r = 0; for (const l of db.linhas) { o += orcado(l, m); p += previsto(l, m) + (extras[m] || 0); r += realizado(l.id, m); } return { m, o, p, r }; });
  const max = Math.max(1, ...dados.map(d => Math.max(d.o, d.p, d.r)));
  const W = 760, H = 200, pl = 8, bw = (W - pl * 2) / dados.length, y = v => H - 24 - (v / max) * (H - 40);
  const bars = dados.map((d, i) => {
    const x = pl + i * bw + bw * 0.18, w = bw * 0.64, f = fechado(d.m);
    return `<rect x="${x}" y="${y(d.p)}" width="${w}" height="${H - 24 - y(d.p)}" rx="3" fill="${f ? 'var(--bv-deep)' : 'var(--bv-mid)'}" opacity="${f ? 1 : .75}"><title>${nomeMes(d.m)}: previsto ${fm(d.p)} · realizado ${fm(d.r)} · orçado ${fm(d.o)}</title></rect>
      ${d.o ? `<line x1="${x - 3}" x2="${x + w + 3}" y1="${y(d.o)}" y2="${y(d.o)}" stroke="var(--ink)" stroke-width="2"/>` : ''}

  }).join('');
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Previsto e orçado por mês">${bars}</svg>
    <div class="legend"><span><i style="background:var(--bv-deep)"></i>Realizado (mês fechado)</span><span><i style="background:var(--bv-mid)"></i>Previsto</span><span><i style="background:var(--ink);height:2px"></i>Orçado</span></div>`;
}

function barraRapida() {

function ligarBarraRapida(el) { const i = $('#qk', el); if (i) i.onkeydown = e => { if (e.key === 'Enter' && i.value.trim()) { lancDlg(null, interpretar(i.value)); i.value = ''; } }; }
function interpretar(txt) {
  let s = ' ' + txt + ' ', o = { descricao: '', valor: null, linha: '', data: hojeISO(), iniciativa: '' };
  s = s.replace(/\s#([\wÀ-ú-]+)/g, (_, t) => { const k = slugify(t); const l = db.linhas.find(x => slugify(x.nome).startsWith(k)) || db.linhas.find(x => x.cat === k || slugify(catPorId(x.cat)?.nome || '').startsWith(k)); if (l) o.linha = l.id; return ' '; });
  s = s.replace(/\s([A-Z]{2,5}-\d{1,4})(?=\s)/g, (_, c) => { o.iniciativa = c; return ' '; });
  s = s.replace(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/g, (_, d, m, a) => { const ano = a ? (a.length === 2 ? '20' + a : a) : db.ano; o.data = `${ano}-${pad2(m)}-${pad2(d)}`; return ' '; });
  s = s.replace(/\s(?:hoje)(?=\s)/gi, ' ').replace(/\s(ontem)(?=\s)/gi, () => { const d = new Date(Date.now() - 864e5); o.data = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; return ' '; });
  const vals = [...s.matchAll(/\s(?:R\$\s*)?(-?\d[\d.,]*(?:\s?(?:k|mil|mi)(?=\s))?)(?=\s)/gi)];
  for (const mv of vals.reverse()) { const c = parseValor(mv[1]); if (c != null) { o.valor = c; s = s.slice(0, mv.index) + ' ' + s.slice(mv.index + mv[0].length); break; } }
  o.descricao = s.replace(/\s+/g, ' ').trim();
  return o;
}

async function fecharMesDlg() {
  const abertos = mesesAno().filter(m => m < mesAtual() && !fechado(m));
  const prox = abertos[0] || mesesAno().find(m => !fechado(m));
  if (!prox) return toast('Todos os meses do ano estão fechados.');
  const t = totais([prox]);
  const r = await perguntar(`Fechar ${nomeMes(prox)}?`, `<p>Ao fechar, o previsto de ${nomeMes(prox)} passa a ser o realizado e o mês sai da previsão.</p>
    <div class="kpis">${kpi('Orçado', fm(t.orcado))}${kpi('Previsto', fm(t.previsto))}${kpi('Realizado', fm(t.realizado))}</div>
    <p class="small muted">Confira se todos os lançamentos do mês estão registrados. Dá para reabrir depois em Ajustes.</p>`, [['no', 'Cancelar'], ['so', 'Fechar'], ['pub', 'Fechar e publicar', 'pri']]);
  if (!r || r === 'no') return;
  db.fechados.push(prox); db.fechados.sort(); agendarSalvar();
  if (r === 'pub') await publicar(); else toast(`${nomeMes(prox)} fechado.`);
}

/* --- Futuro: previsão rolante e cenários --- */
let cenarioSel = '';
function ajustesCenario(cen) {
  const out = {}; if (!cen) return out;
  for (const a of cen.ajustes) for (let m = a.de; m <= (a.ate || a.de); m = somaMeses(m, 1)) if (!fechado(m)) out[m] = (out[m] || 0) + a.valor;
  return out;
}
function vFuturo(el) {
  const m = mesAtual(), base = mesesAno(), horizonte = Array.from({ length: 12 }, (_, i) => somaMeses(m, i));
  const cen = db.cenarios.find(c => c.id === cenarioSel), ex = ajustesCenario(cen);
  const restAno = base.filter(x => x >= m), t = totais(), tr = totais(restAno);
  const delta = Object.entries(ex).filter(([k]) => base.includes(k)).reduce((s, [, v]) => s + v, 0);
  el.innerHTML = `<div class="inss">${cardLeitura({ hi: true, k: `Ainda por vir em ${anoV()}`, v: fm(tr.previsto), pct: t.previsto ? tr.previsto / t.previsto : null, s: `${restAno.length} mes(es) abertos · <b>${pctTxt(tr.previsto, t.previsto)}</b> do ano` })}
    ${cardLeitura({ k: 'Ano inteiro (realizado + previsto)', v: fm(t.previsto), pct: t.orcado ? t.previsto / t.orcado : null, s: t.orcado ? `${pctTxt(t.previsto, t.orcado)} do orçado de <b>${fmtCurto(t.orcado)}</b>` : 'Sem orçado' })}
    ${cen ? cardLeitura({ k: `Com "${esc(cen.nome)}"`, v: fm(t.previsto + delta), pct: t.orcado ? (t.previsto + delta) / t.orcado : null, s: `${delta > 0 ? '+' : ''}${fm(delta)} no ano`, tag: t.orcado && t.previsto + delta > t.orcado ? '<span class="tag late">acima</span>' : '' }) : cardLeitura({ k: 'Cenários', v: String(db.cenarios.length), s: db.cenarios.length ? 'Escolha um no gráfico para simular' : 'Simule contratações ou cortes abaixo' })}</div>
    <div class="card"><div class="row"><p class="lbl" style="margin:0">Próximos 12 meses</p><span class="grow"></span>
      <select class="sel" id="fC"><option value="">Sem cenário</option>${db.cenarios.map(c => `<option value="${c.id}" ${c.id === cenarioSel ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</select></div>${grafico(horizonte, ex)}
      <p class="small muted">Meses do próximo ano usam contratos e valores digitados no plano daquele ano (se houver).</p></div>
    <div class="card"><div class="row"><p class="lbl" style="margin:0">Vários anos</p><span class="grow"></span><button class="btn sm" id="fAno">+ Ano</button></div>${graficoAnos(ex)}</div>

function graficoAnos(ex = {}) {
  const dados = db.anos.map(a => { const t = totais(mesesAno(a)); const d = Object.entries(ex).filter(([k]) => k.startsWith(a + '-')).reduce((s, [, v]) => s + v, 0); return { a, ...t, cen: t.previsto + d }; });
  const max = Math.max(1, ...dados.map(d => Math.max(d.orcado, d.previsto, d.cen)));
  const W = 760, H = 190, bw = Math.min(160, (W - 16) / Math.max(dados.length, 1)), y = v => H - 26 - (v / max) * (H - 44);
  const svg = dados.map((d, i) => { const x = 8 + i * bw + bw * 0.2, w = bw * 0.6; return `<rect x="${x}" y="${y(d.previsto)}" width="${w}" height="${H - 26 - y(d.previsto)}" rx="4" fill="var(--bv-mid)"><title>${d.a}: previsto ${fm(d.previsto)} · orçado ${fm(d.orcado)} · realizado ${fm(d.realizado)}</title></rect>
    ${d.orcado ? `<line x1="${x - 4}" x2="${x + w + 4}" y1="${y(d.orcado)}" y2="${y(d.orcado)}" stroke="var(--ink)" stroke-width="2"/>` : ''}${d.cen !== d.previsto ? `<line x1="${x - 4}" x2="${x + w + 4}" y1="${y(d.cen)}" y2="${y(d.cen)}" stroke="var(--late)" stroke-width="2" stroke-dasharray="4 3"/>` : ''}
    <text x="${x + w / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.a}</text>`; }).join('');
  const tab = `<div class="scroll"><table class="t"><tr><th>Ano</th><th class="n">Orçado</th><th class="n">Previsto</th><th class="n">Realizado</th><th class="n">Previsto × ano anterior</th></tr>${dados.map((d, i) => { const pr = dados[i - 1]; const v = pr && pr.previsto ? Math.round((d.previsto / pr.previsto - 1) * 100) : null; return `<tr><td>${d.a}${d.a === db.ano ? ' <span class="faint small">base</span>' : ''}</td><td class="n">${fm(d.orcado)}</td><td class="n ${d.orcado && d.previsto > d.orcado ? 'latec' : ''}">${fm(d.previsto)}</td><td class="n">${fm(d.realizado)}</td><td class="n">${v == null ? '—' : (v > 0 ? '+' : '') + v + '%'}</td></tr>`; }).join('')}
    <tr class="tot"><td>Horizonte</td><td class="n">${fm(dados.reduce((s, d) => s + d.orcado, 0))}</td><td class="n">${fm(dados.reduce((s, d) => s + d.previsto, 0))}</td><td class="n">${fm(dados.reduce((s, d) => s + d.realizado, 0))}</td><td></td></tr></table></div>`;
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Previsto e orçado por ano">${svg}</svg><div class="legend"><span><i style="background:var(--bv-mid)"></i>Previsto</span><span><i style="background:var(--ink);height:2px"></i>Orçado</span>${Object.keys(ex).length ? '<span><i style="background:var(--late);height:2px"></i>Com o cenário</span>' : ''}</div>${tab}`;
}

        : `<p class="muted">${situacao.diretrizInvalida ? 'Diretriz encontrada, mas não abriu: ' + esc(situacao.diretrizInvalida) : 'Nenhuma diretriz do grupo ainda. Quando o gestor publicar, ela aparece aqui com tetos e categorias.'}</p>`}</div>

      <p>${db.publicacao.revision ? `Última publicação: revisão ${db.publicacao.revision}, ${fmtDataHora(db.publicacao.em)}` : 'Ainda não publicado.'} ${pend ? '<span class="chip late">mudanças não publicadas</span>' : db.publicacao.revision ? '<span class="chip ok">em dia</span>' : ''}</p>
      ${lida ? `<p class="small muted">Na pasta: revisão ${lida.revision}, publicada por <span class="code">${esc(lida.source?.writer || '?')}</span>${lida.source?.writer !== writer() ? ' <b class="latec">(outro dono)</b>' : ''}.</p>` : ''}
      ${situacao.conflitos.length ? `<div class="banner warn">Cópias de conflito do OneDrive encontradas: ${situacao.conflitos.map(c => `<span class="code">${esc(c.nome)}</span>`).join(', ')}. A mais nova vale; publicar de novo apaga as suas.</div>` : ''}
      ${situacao.outros.length ? `<div class="banner warn">Aberto também em: ${situacao.outros.map(o => esc(o.writer)).join(', ')}.</div>` : ''}
      <label class="field"><span>Versão do plano</span><input class="sin" id="gVer" value="${esc(db.versaoPlano)}" list="vers"><datalist id="vers"><option value="Orçamento original"><option value="Reforecast 1"><option value="Reforecast 2"><option value="Reforecast 3"></datalist></label>
      <div class="row"><button class="btn pri" id="gPub" ${ch && raiz ? '' : 'disabled'}>Publicar plano</button><button class="btn" id="gVer2">Ver o que vai</button></div>
      <p class="small muted">Você é <span class="code">${esc(writer())}</span>. Só um dono publica o plano do time, para o OneDrive nunca ter duas versões.</p></div>
  </div>`;
  $('#gPasta').onclick = async () => { try { const h = await escolherPasta('fin-comum'); await ligarPasta(h); } catch (e) { if (e.name !== 'AbortError') toast(e.message); } };
  if ($('#gLer')) $('#gLer').onclick = () => lerPasta();
  $('#gChOk').onclick = async () => {
    const v = $('#gCh').value.trim(); if (!v) return;
    try { lerChaveTexto(v); } catch (e) { return toast(e.message, 5000); }
    if (!await avisoCofre('chave')) return;
    try { const kid = await cadastrarChave(v); toast('Chave cadastrada: ' + kid); await lerPasta(); } catch (e) { toast(e.message, 5000); }
  };
  $('#gVer').onchange = e => { db.versaoPlano = clamp(e.target.value.trim(), 40) || 'Orçamento original'; agendarSalvar(); };
  $('#gPub').onclick = () => publicar();
  $('#gVer2').onclick = () => modal(`<div class="mh"><h2>O que vai para a pasta</h2></div><div class="mb"><p class="small muted" style="margin-top:0">Conteúdo que será cifrado com a chave do time. Lançamentos individuais não vão.</p><pre class="code" style="white-space:pre-wrap;max-height:60vh;overflow:auto">${esc(JSON.stringify(montarPlano({ revision: (db.publicacao.revision || 0) + 1, generatedAt: isoComFuso(), hlc: '' }), null, 2))}</pre></div><div class="mf"><button class="btn pri" onclick="fecharModal()">Fechar</button></div>`, 'wide');
}

/* --- Ajustes --- */
function vAjustes(el) {
  el.innerHTML = `<div class="grid g2">
    <div class="card"><p class="lbl">Time e ano</p>
      <label class="field"><span>Nome do time</span><input class="sin" id="aN" value="${esc(db.team.nome)}"></label>
      <div class="f2"><label class="field"><span>Identificador (slug)</span><input class="sin code" value="${esc(db.team.slug)}" disabled></label><label class="field"><span>Ano base (o ano em curso)</span><select class="sel" id="aA">${db.anos.map(a => `<option ${a === db.ano ? 'selected' : ''}>${a}</option>`).join('')}</select></label></div>
      <div class="f2"><label class="field"><span>Seu nome</span><input class="sin" id="aP" value="${esc(db.pessoa.nome)}"></label><label class="field"><span>Este computador</span><input class="sin" id="aD" value="${esc(dispositivo().nome)}" placeholder="Ex.: notebook do trabalho"></label></div>
      <p class="lbl" style="margin-top:10px">Anos do plano</p><div class="row">${db.anos.map(a => `<span class="chip">${a}${a === db.ano ? ' · base' : ` <button data-ra="${a}" title="Tirar do horizonte (os valores ficam guardados)">×</button>`}</span>`).join(' ')}<button class="btn sm" id="aAno">+ Ano</button></div>
      <p class="small muted">Os anos do horizonte vão juntos na publicação para o grupo. Tirar um ano não apaga os valores: ele volta igual se for adicionado de novo.</p></div>
    <div class="card"><p class="lbl">Categorias</p>
      ${db.categorias.map(c => `<div class="row" style="margin-bottom:6px"><input class="sin grow" data-cn="${c.id}" value="${esc(c.nome)}" ${c.doGrupo ? 'disabled title="Definida pelo grupo"' : ''}><select class="sel" data-ct="${c.id}" ${c.doGrupo ? 'disabled' : ''}><option ${c.tipo === 'OPEX' ? 'selected' : ''}>OPEX</option><option ${c.tipo === 'CAPEX' ? 'selected' : ''}>CAPEX</option></select>${c.doGrupo ? '<span class="chip bv">grupo</span>' : ''}</div>`).join('')}
      <div class="row"><input class="sin grow" id="aNC" placeholder="Nova categoria"><button class="btn" id="aNCb">Adicionar</button></div></div>
    <div class="card"><p class="lbl">Segurança</p>
      <p class="small">Arquivo <span class="code">${esc(arquivo)}</span> cifrado com AES-256 (senha, PBKDF2 600 mil). ${db.seg.cofreConfirmadoEm ? `Senha guardada no cofre em ${fmtData(db.seg.cofreConfirmadoEm)}.` : ''}</p>
      <div class="row"><button class="btn" id="aSenha">Trocar senha</button><button class="btn" id="aBk">Baixar cópia cifrada</button><button class="btn" id="aTeste">Testar minha senha</button></div>
      <p class="small muted">A pasta local guarda as 5 últimas versões em <span class="code">backup/</span>. Como ela não vai para a nuvem, baixe uma cópia cifrada de vez em quando e guarde onde preferir.</p></div>
    <div class="card"><p class="lbl">Meses fechados</p>
      ${db.fechados.length ? db.fechados.map(m => `<span class="chip">${nomeMes(m)} ${m.slice(0, 4)} <button data-rf="${m}" title="Reabrir">×</button></span>`).join(' ') : '<div class="empty">Nenhum.</div>'}</div>
  </div>`;
  $('#aN').onchange = e => { db.team.nome = clamp(e.target.value.trim(), 80) || db.team.nome; agendarSalvar(); };
  $('#aA').onchange = e => { db.ano = +e.target.value; agendarSalvar(); };
  $('#aAno').onclick = novoAnoDlg;
  $$('[data-ra]', el).forEach(b => b.onclick = () => { const a = +b.dataset.ra; db.anos = db.anos.filter(x => x !== a); if (anoVista === a) anoVista = null; agendarSalvar(); });
  $('#aP').onchange = e => { db.pessoa.nome = clamp(e.target.value.trim(), 80); agendarSalvar(); };
  $('#aD').onchange = e => { nomearDispositivo(e.target.value.trim()); };
  $$('[data-cn]', el).forEach(i => i.onchange = () => { catPorId(i.dataset.cn).nome = clamp(i.value.trim(), 60); agendarSalvar(); });
  $$('[data-ct]', el).forEach(i => i.onchange = () => { catPorId(i.dataset.ct).tipo = i.value; agendarSalvar(); });
  $('#aNCb').onclick = () => { const n = $('#aNC').value.trim(), id = slugify(n); if (!id || catPorId(id)) return; db.categorias.push({ id, nome: clamp(n, 60), tipo: 'OPEX' }); agendarSalvar(); };
  $$('[data-rf]', el).forEach(b => b.onclick = () => { db.fechados = db.fechados.filter(m => m !== b.dataset.rf); agendarSalvar(); });
  $('#aSenha').onclick = async () => { const s = await criarSenhaDlg('Nova senha do arquivo'); if (!s) return; ctx = await novoCtx(s, TOOL); db.seg = { cofreConfirmadoEm: new Date().toISOString(), ultimoTesteEm: null }; await salvar(); toast('Senha trocada. Use a nova a partir de agora.'); render(); };
  $('#aBk').onclick = async () => baixar(arquivo.replace(/\.json$/, '') + '-copia-' + hojeISO() + '.json', await cifrarLocal(db, ctx));
  $('#aTeste').onclick = async () => { const s = await pedirSenhaDlg('Testar minha senha'); if (s == null) return; if (await senhaConfere(s, ctx)) { db.seg.ultimoTesteEm = new Date().toISOString(); agendarSalvar(); toast('Senha correta.'); } else toast('Senha não confere. Troque a senha enquanto o arquivo está aberto.', 6000); };
}

/* ---------------------------- abertura e criação ---------------------------- */
async function telaInicial(msg = '') {
  const ult = await arquivoLembrado(LEMBRAR);
  $('#app').innerHTML = `<div class="welcome"><div class="card">
    <div class="row"><div class="logo" style="margin:0">FIN</div><div><h2 style="margin:0">Finanças do Time</h2><div class="small muted">Acompanhamento do dia a dia e planejamento do futuro</div></div></div>
    ${PRESET ? `<div class="banner" style="margin-top:16px">Pré-configurado pelo gestor para o time <b>${esc(PRESET.team?.nome)}</b>.${PRESET.chave ? ' A chave do time vem junto: você vai guardá-la no cofre no primeiro uso.' : ''}</div>` : ''}
    ${msg ? `<div class="banner warn" style="margin-top:12px">${esc(msg)}</div>` : ''}
    ${avisoFS()}
    ${botaoUltimo(ult)}
    <p class="lbl" style="margin-top:20px">É a primeira vez?</p>
    <button class="opt" id="iNovo"><b>Criar o arquivo do time</b><span>Passo a passo: pasta local, senha guardada no cofre e o primeiro plano.</span></button>
    <p class="lbl" style="margin-top:16px">Já tenho o arquivo</p>
    <button class="opt" id="iAbrir"><b>Abrir a pasta local</b><span>Escolha a pasta deste computador onde está o arquivo <span class="code">financas-&lt;time&gt;.json</span>.</span></button>
    <p class="small muted" style="margin-top:16px">Seus dados ficam num arquivo cifrado neste computador. Só o plano agregado vai para a pasta sincronizada pelo OneDrive.</p>
  </div></div>`;
  $('#iNovo').onclick = criarDlg;
  $('#iAbrir').onclick = abrirPasta; ligarUltimo(ult, abrirArquivo, telaInicial);
}
async function abrirPasta() {
  let h; try { h = await escolherPasta('fin-local'); } catch (e) { if (e.name !== 'AbortError') toast(e.message); return; }
  if (!await permissao(h)) return;
  const cand = [];
  for await (const [n, f] of h.entries()) if (f.kind === 'file' && /^financas-.*\.json$/.test(n)) { try { const o = JSON.parse(await (await f.getFile()).text()); if (o.schema === LOCAL_ENC && o.app === TOOL) cand.push(n); } catch {} }
  if (!cand.length) return telaInicial('Não encontrei um arquivo das Finanças do Time nesta pasta.');
  let nome = cand[0];
  if (cand.length > 1) { const r = await perguntar('Qual arquivo?', cand.map((n, i) => `<button class="opt" data-r="${i}"><b class="code">${esc(n)}</b></button>`).join(''), [['no', 'Cancelar']]); if (r == null || r === 'no') return; nome = cand[+r]; }
  await abrirArquivo(h, nome);
}
async function abrirArquivo(h, nome) {
  const texto = await lerTexto(h, nome);
  for (let i = 0; i < 3; i++) {
    const s = await pedirSenhaDlg('Senha das Finanças do Time', i > 0, { sessao: true }); if (s == null) return;
    try { const r = await decifrarLocal(texto, s); db = normalizar(r.dados); ctx = r.ctx; dirLocal = h; arquivo = nome; break; }
    catch (e) { if (e.code !== 'SENHA') return telaInicial(e.message); }
  }
  if (!db) return telaInicial('Senha incorreta três vezes.');
  await aposAbrir();
}
async function aposAbrir() {
  await carregarChaves();
  render();
  if (await lembreteTesteSenha(db.seg, ctx)) agendarSalvar();
  lembrarArquivo(LEMBRAR, dirLocal, arquivo);
  { const h = await pastaLembrada('fin-time-raiz:' + db.team.slug); if (h && await permissao(h, false)) await ligarPasta(h, true); }
}
async function criarDlg() {
  if (semFS()) return;
  const p = PRESET || {};
  const d = modal(`<div class="mh"><h2>Criar o arquivo do time</h2></div><div class="mb">
    <div class="steps"><i class="on"></i><i></i><i></i></div>
    <label class="field"><span>Nome do time</span><input class="sin" id="cN" value="${esc(p.team?.nome || '')}" ${p.team ? 'disabled' : ''}></label>
    <div class="f2"><label class="field"><span>Identificador (usado nas pastas)</span><input class="sin code" id="cS" value="${esc(p.team?.slug || '')}" ${p.team ? 'disabled' : ''}></label>
    <label class="field"><span>Ano fiscal</span><input class="sin" type="number" id="cA" value="${p.ano || new Date().getFullYear()}"></label></div>
    <div class="f2"><label class="field"><span>Seu nome</span><input class="sin" id="cP"></label><label class="field"><span>Moeda</span><select class="sel" id="cM"><option>BRL</option><option>USD</option><option>EUR</option></select></label></div>
    <p class="small muted">Depois você escolhe a pasta local (só sua; de preferência no seu OneDrive) e cria a senha.</p></div>
    <div class="mf"><button class="btn" id="cNo">Cancelar</button><button class="btn pri" id="cOk">Escolher pasta local</button></div>`);
  $('#cN', d).oninput = () => { if (!p.team) $('#cS', d).value = slugify($('#cN', d).value); };
  if (p.moeda) $('#cM', d).value = p.moeda;
  $('#cNo', d).onclick = fecharModal;
  $('#cOk', d).onclick = async () => {
    const nome = $('#cN', d).value.trim(), slug = slugify($('#cS', d).value), pessoa = $('#cP', d).value.trim(), ano = +$('#cA', d).value, moeda = $('#cM', d).value;
    if (!nome || !slug || !pessoa) return toast('Preencha nome do time, identificador e seu nome.');
    fecharModal();
    const r = await criarArquivo({ nome, slug, pessoa, ano, moeda });
    if (!r) telaInicial();
  };
}
// Usado também pelo assistente (inicio.html) com a mesma lógica.
async function escolherPastaLocal() {
  await perguntar('Pasta local', `<p>Escolha a sua <b>pasta pessoal</b>: só sua, de preferência no <b>seu OneDrive</b> (backup se trocar de computador), como <span class="code">OneDrive - Empresa\\GestaoPessoal</span>. Pode ser a mesma das outras ferramentas. Nunca a pasta compartilhada com os times.</p><div class="banner">O arquivo é cifrado com a sua senha: no OneDrive, ninguém consegue ler sem ela.</div>`, [['ok', 'Escolher pasta', 'pri']]);
  let h; try { h = await escolherPasta('fin-local'); } catch { return null; }
  if (!await permissao(h)) return null;
  const s = await suspeitaDeSincronizada(h);
  if (s.length) { const r = await perguntar('Esta parece ser a pasta compartilhada', `<div class="cofre">A pasta <b>${esc(h.name)}</b> ${esc(s.join(', '))}. ${AVISO_PASTA_PESSOAL}</div>`, [['no', 'Escolher outra'], ['ok', 'Usar mesmo assim']]); if (r !== 'ok') return escolherPastaLocal(); }
  return h;
}
async function criarArquivo({ nome, slug, pessoa, ano, moeda }) {
  const h = await escolherPastaLocal(); if (!h) return false;
  const nomeArq = `financas-${slug}.json`;
  if (await lerTexto(h, nomeArq)) { const r = await perguntar('Arquivo já existe', `<p>Já existe <span class="code">${esc(nomeArq)}</span> nesta pasta. Abrir o existente?</p>`, [['no', 'Cancelar'], ['ok', 'Abrir', 'pri']]); if (r === 'ok') { await abrirArquivo(h, nomeArq); return true; } return false; }
  const senha = await criarSenhaDlg(); if (!senha) return false;
  db = novoDb({ nome, slug, ano, moeda, pessoa });
  db.seg.cofreConfirmadoEm = new Date().toISOString();
  if (PRESET) {
    if (Array.isArray(PRESET.categorias) && PRESET.categorias.length) { db.categorias = PRESET.categorias.map(c => ({ id: slugify(c.id || c.nome), nome: clamp(c.nome, 60), tipo: c.tipo === 'CAPEX' ? 'CAPEX' : 'OPEX', doGrupo: true })); }
    if (Array.isArray(PRESET.centros)) db.centros = PRESET.centros.map(x => clamp(x, 40));
    if (Array.isArray(PRESET.anos)) db.anos = [...new Set([...db.anos, ...PRESET.anos.map(Number).filter(a => a >= db.ano && a < 2100)])].sort();
    db.team.prefixo = clamp(PRESET.team?.prefixo || '', 5);
    if (PRESET.chave) { if (await avisoCofre('chave', `<p class="small">Chave do time: <span class="code">${esc(lerChaveTexto(PRESET.chave).kid)}</span>. Copie-a para o cofre:</p><input class="sin code" style="width:100%" readonly value="${esc(PRESET.chave)}" onclick="this.select()">`)) db.chaves.push({ kid: lerChaveTexto(PRESET.chave).kid, texto: PRESET.chave, em: new Date().toISOString(), origem: 'preset' }); }
  }
  ctx = await novoCtx(senha, TOOL); dirLocal = h; arquivo = nomeArq;
  await gravarLocal(h, nomeArq, await cifrarLocal(db, ctx));
  view = 'plano'; await aposAbrir();
  toast('Arquivo criado e cifrado. Agora crie as linhas do plano.', 5000);
  return true;
}
(async () => { if (!await abrirLembradoSePuder(LEMBRAR, abrirArquivo) || (!db && !$('#app').children.length)) telaInicial(); })();
</script>

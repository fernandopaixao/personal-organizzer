<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa de Férias</title>
<style>
:root{
  --bv:#223ad2; --bv-deep:#002bab; --bv-mid:#8e9de9; --bv-line:#d5dbf7; --bv-soft:#f2f4fd;
  --ink:#161a23; --muted:#6f7689; --faint:#aab0bf; --line:#eceef4; --bg:#fafafc; --card:#fff; --late:#c4574f; --late-soft:#fbefee;
  --ok:#2f7d5b; --ok-soft:#eaf5ef;
  --font:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --title:"BV Leve",Montserrat,Inter,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--bv)}
.hidden{display:none!important}
.muted{color:var(--muted)}.faint{color:var(--faint)}.grow{flex:1}.small{font-size:12px}.bvc{color:var(--bv)}.latec{color:var(--late)}.okc{color:var(--ok)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rail{position:fixed;left:0;top:0;bottom:0;width:84px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:2px;z-index:20}
.logo{width:36px;height:36px;border-radius:10px;background:var(--bv);color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--title);margin-bottom:12px;font-size:11px}
.nv{width:70px;padding:8px 0 6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;position:relative;text-align:center}
.nv svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nv:hover{color:var(--ink)}.nv.on{color:var(--bv);background:var(--bv-soft);font-weight:600}
.nv .b{position:absolute;top:3px;right:10px;min-width:15px;height:15px;border-radius:8px;background:var(--late);color:#fff;font-size:9.5px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.main{margin-left:84px;padding:0 clamp(18px,2.6vw,56px) 80px}
.top{position:sticky;top:0;z-index:10;background:rgba(250,250,252,.95);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:14px 0 12px;flex-wrap:wrap}
.top h1{margin:0;font-family:var(--title);font-size:20px;font-weight:600;letter-spacing:-.02em}
.top .sub{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.pill .led{width:7px;height:7px;border-radius:50%;background:var(--bv)}.pill .led.wait{background:var(--faint)}.pill .led.err{background:var(--late)}
button.pill:hover{border-color:#cfd3e0;color:var(--ink)}
.banner{background:var(--bv-soft);border:1px solid var(--bv-line);color:var(--bv-deep);border-radius:12px;padding:9px 14px;margin:0 0 14px;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--late-soft);border-color:#f0cfcc;color:#8a2f28}
.aviso-fs{margin-top:16px;line-height:1.5}.aviso-fs.pisca{animation:pisca-fs .9s ease 2}
@keyframes pisca-fs{50%{box-shadow:0 0 0 4px #e8a29b;transform:scale(1.01)}}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-weight:550;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:#cfd3e0}.btn.pri{background:var(--bv);border-color:var(--bv);color:#fff}.btn.pri:hover{background:var(--bv-deep)}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:8px}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.danger{color:var(--late)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}.btn.ghost:hover{color:var(--ink);background:#f0f1f6}
.sg{display:inline-flex;background:#f0f1f6;border-radius:10px;padding:2px;gap:2px;flex-wrap:wrap}
.sg button{padding:5px 12px;border-radius:8px;color:var(--muted);font-weight:550;font-size:12.5px}
.sg button.on{background:#fff;color:var(--bv);box-shadow:0 1px 2px rgba(20,30,70,.1)}
.sel,.sin,textarea.sin{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;outline:none;font-size:12.5px;min-width:0}
.sel:focus,.sin:focus{border-color:var(--bv);box-shadow:0 0 0 3px var(--bv-soft)}
textarea.sin{width:100%;resize:vertical;min-height:60px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:550;padding:1px 8px;border-radius:99px;background:#f2f3f8;color:var(--muted);white-space:nowrap}
.chip.bv{background:var(--bv-soft);color:var(--bv)}.chip.late{background:var(--late-soft);color:var(--late)}.chip.ok{background:var(--ok-soft);color:var(--ok)}
.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.lbl{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2{font-family:var(--title);font-size:16px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:14px;font-weight:650;margin:0}
.empty{color:var(--faint);padding:14px 0;font-size:12.5px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}.kpi b{display:block;font-family:var(--title);font-size:21px;font-weight:600;letter-spacing:-.02em}.kpi span{font-size:11.5px;color:var(--muted)}
.kpi.alert b{color:var(--late)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.tot td{font-weight:650;background:#f7f8fb}
table.t tr:hover td{background:#fbfbfe}
.scroll{overflow-x:auto}
.cell{width:92px;text-align:right;border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 5px;font-variant-numeric:tabular-nums}
.cell:hover{border-color:var(--line)}.cell:focus{border-color:var(--bv);background:#fff;outline:none}
.cell.closed{color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:12.5px;z-index:100;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
dialog{border:0;border-radius:18px;padding:0;width:min(620px,94vw);max-height:90vh;box-shadow:0 24px 64px rgba(20,30,70,.25)}
dialog.wide{width:min(900px,96vw)}
dialog::backdrop{background:rgba(22,26,35,.35)}
dialog[open]{display:flex;flex-direction:column}dialog>.mb{flex:1;min-height:0}
.mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);background:#fff}
.mb{padding:16px 20px;overflow:auto}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field>span{font-size:11.5px;font-weight:600;color:var(--muted)}
.field .sin,.field .sel{width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.cofre{border:1.5px solid var(--late);background:var(--late-soft);border-radius:14px;padding:12px 14px;color:#6d2620;font-size:12.5px;margin:6px 0 12px}
.cofre b{color:#8a2f28}
.quick{position:relative;margin-bottom:16px}
.quick input{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;font-size:13px}
.quick input:focus{border-color:var(--bv);box-shadow:0 0 0 3px var(--bv-soft)}
.quick .pl{position:absolute;left:13px;top:7px;color:var(--bv);font-weight:700;font-size:16px}
.quick .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.al{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}.al:last-child{border-bottom:0}
.al .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;background:var(--bv)}.al .dot.late{background:var(--late)}
.welcome{max-width:640px;margin:8vh auto;padding:0 20px}
.welcome .card{padding:26px 28px}
.steps{display:flex;gap:6px;margin:0 0 18px;flex-wrap:wrap}.steps i{height:4px;flex:1;min-width:30px;border-radius:2px;background:#e6e8f0}.steps i.on{background:var(--bv)}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;background:#fff}
.opt:hover{border-color:var(--bv-mid)}.opt.on{border-color:var(--bv);background:var(--bv-soft)}
.opt b{display:block;font-size:13.5px}.opt span{font-size:12px;color:var(--muted)}
.map{display:grid;grid-template-columns:1fr 1fr;gap:12px}.map>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px}
.map h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
svg.ch{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (max-width:720px){.rail{position:fixed;top:auto;bottom:0;width:100%;height:62px;flex-direction:row;justify-content:space-around;padding:0;border-right:0;border-top:1px solid var(--line)}.logo{display:none}.main{margin-left:0;padding-bottom:90px}.f2,.map{grid-template-columns:1fr}}
/* ---- Finanças 1.2: cards de leitura, medidores e gráficos (branco e azul, destaque discreto) ---- */
.top .sg{background:transparent;padding:0;gap:4px}.top .sg button{padding:4px 11px;border:1px solid transparent}.top .sg button.on{background:#fff;border-color:var(--bv-line);box-shadow:none}
.subnav{flex-basis:100%;display:flex;gap:4px;margin-top:-2px}
.subnav button{padding:5px 12px;border-radius:99px;color:var(--muted);font-weight:550;font-size:12.5px;border:1px solid transparent}
.subnav button:hover{color:var(--ink)}.subnav button.on{color:var(--bv);background:#fff;border-color:var(--bv-line)}
.inss{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.ins{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px 13px;display:flex;flex-direction:column;gap:7px;min-width:0}
.ins .k{font-size:11.5px;color:var(--muted);font-weight:550;display:flex;gap:6px;align-items:center}
.ins .v{font-family:var(--title);font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.ins .s{font-size:12px;color:var(--muted)}.ins .s b{color:var(--ink);font-weight:600}
.ins.hi{background:linear-gradient(160deg,var(--bv) 0%,var(--bv-deep) 100%);border-color:var(--bv);color:#fff}
.ins.hi .k,.ins.hi .s{color:rgba(255,255,255,.78)}.ins.hi .s b{color:#fff}.ins.hi .m{background:rgba(255,255,255,.22)}.ins.hi .m i{background:#fff}.ins.hi .m em{background:#fff}
.m{height:6px;border-radius:3px;background:var(--bv-soft);position:relative}
.m i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--bv);max-width:100%}
.m.over i{background:var(--bv-deep)}.m em{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--ink)}
.tag{font-size:10.5px;font-weight:650;padding:1px 7px;border-radius:99px;background:var(--bv-soft);color:var(--bv)}.tag.late{background:var(--late-soft);color:var(--late)}
.hb{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:9px 12px;align-items:center;font-size:12.5px}
.hb .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .val{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.hb .tr{height:10px;border-radius:5px;background:var(--bv-soft);position:relative}.hb .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--bv)}
.hb .tr em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}.hb .tr em.cap{background:var(--late)}
.g21{display:grid;gap:16px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}@media (max-width:980px){.g21{grid-template-columns:1fr}}
.card.flat{padding:14px 18px}
.al.compact{padding:6px 0}
svg.ch{max-height:280px}

/* ---- Mapa de Férias: mapa de calor, linha do tempo e rankings ---- */
.hm{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.hm .mes h4{margin:0 0 6px;font-size:12px;font-weight:650;color:var(--muted)}
.hm .gr{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.hm .gr span{font-size:9.5px;color:var(--faint);text-align:center}
.hm .d{aspect-ratio:1;border-radius:5px;font-size:10px;display:grid;place-items:center;color:var(--muted);background:#fff;border:1px solid var(--line);position:relative}
.hm .d.v{visibility:hidden}.hm .d.fds{background:#f4f5f8;border-color:transparent;color:var(--faint)}
.hm .d.fer{background:#f4f5f8;border-color:transparent;color:var(--faint);text-decoration:line-through}
.hm .d.h1{background:#e6e9fb;border-color:#e6e9fb;color:var(--bv-deep)}.hm .d.h2{background:#bcc5f3;border-color:#bcc5f3;color:var(--bv-deep)}
.hm .d.h3{background:#7d8ee6;border-color:#7d8ee6;color:#fff}.hm .d.h4{background:var(--bv);border-color:var(--bv);color:#fff}
.hm .d.over{background:var(--late);border-color:var(--late);color:#fff}
.hm .d.hoje{outline:2px solid var(--ink);outline-offset:1px}
.hm button.d:hover{filter:brightness(.95)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.tl{border-collapse:separate;border-spacing:0;font-size:11.5px}
.tl th,.tl td{padding:0;height:24px;min-width:22px;text-align:center;border-bottom:1px solid var(--line)}
.tl th{font-weight:550;color:var(--muted);font-size:10.5px;position:sticky;top:0;background:#fff;z-index:1}
.tl .nm{position:sticky;left:0;background:#fff;text-align:left;padding:0 10px 0 0;min-width:170px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2}
.tl th.nm{z-index:3}
.tl tr.un td{background:#f7f8fb;font-weight:650;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);height:22px}
.tl tr.un td.nm{background:#f7f8fb}
.tl td.fds,.tl th.fds{background:#f7f8fb}
.tl td.c{cursor:default}.tl td.c.ed{cursor:pointer}.tl td.c.ed:hover{background:var(--bv-soft)}
.tl td i{display:block;height:14px;margin:0 -1px;background:var(--bv)}
.tl td i.folga{background:var(--bv-mid)}.tl td i.treinamento{background:#5d6fd9;opacity:.65}.tl td i.outro{background:var(--faint)}
.tl td i.ini{border-radius:7px 0 0 7px;margin-left:2px}.tl td i.fim{border-radius:0 7px 7px 0;margin-right:2px}
.tl tr.cnt td{font-weight:650;font-variant-numeric:tabular-nums;height:26px}
.tl tr.cnt td.over{color:var(--late)}
.tl th.hoje{color:var(--bv);font-weight:700}
.rk{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:12.5px}.rk b{font-variant-numeric:tabular-nums}
.pp{display:flex;flex-wrap:wrap;gap:6px}
/* Dentro da Central (ADR-0033): menu em abas no topo, sem a barra lateral (a Central já tem a dela) */
.embutido .rail{position:sticky;top:0;bottom:auto;width:auto;height:auto;flex-direction:row;justify-content:flex-start;gap:4px;padding:6px 0;border-right:0;border-top:0;border-bottom:1px solid var(--line);z-index:5}
.embutido .rail .logo{display:none}
.embutido .nv{width:auto;flex-direction:row;gap:6px;padding:6px 12px;font-size:12.5px}
.embutido .nv .b{position:static;margin-left:2px}
.embutido .main{margin-left:0;padding:0 2px 40px}
.embutido #temaSel{display:none!important}
</style>
<script id="tema">
/* Tema claro, escuro ou automático (segue o sistema), comum a todas as ferramentas da solução.
   Injetado no <head> de cada HTML por tools/build_financas.py e tools/injetar_seguranca.py.
   - A escolha fica só neste computador (localStorage 'gestao.tema') e vale para todas as ferramentas.
   - No escuro, as variáveis da identidade (--bv, --ink, --line...) ganham a paleta escura e as cores
     fixas das folhas de estilo, dos estilos inline e dos gráficos SVG são convertidas por papel
     (fundo, texto, borda), sem tocar no código de cada ferramenta. Voltar para o claro restaura tudo. */
(() => {
  if (window.gestaoTema) return;
  const CHAVE = 'gestao.tema', html = document.documentElement;
  const mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : { matches: false, addEventListener() {} };
  const ler = () => { try { const v = localStorage.getItem(CHAVE); return v === 'claro' || v === 'escuro' ? v : 'auto'; } catch { return 'auto'; } };
  let pref = ler(), escuro = false;

  // ---- Paleta escura: mesmo branco-e-azul, invertido para azul-noite, com o azul BV mais luminoso ----
  const VARS = '--bv:#5066ec;--bv-deep:#3a4fd6;--bv-t:#8d9cf9;--bv-deep-t:#a9b4ff;--bv-mid:#8190ee;--bv-line:#2f3a6b;--bv-soft:#1a2142;'
    + '--ink:#e6e9f2;--muted:#99a1b7;--faint:#68708a;--line:#262d40;--bg:#0e121c;--card:#161b29;'
    + '--late:#ec7d74;--late-soft:#3a1f24;--ok:#5cc292;--ok-soft:#15302a;--raised:#1e2436';
  const CSS = `:root[data-tema="escuro"]{${VARS};color-scheme:dark}
:root[data-tema="escuro"] body{background:var(--bg);color:var(--ink)}
:root[data-tema="escuro"] dialog{background:var(--card);color:var(--ink)}
:root[data-tema="escuro"] .toast{background:#2a3147!important;color:var(--ink)!important;box-shadow:0 8px 24px rgba(0,0,0,.5)!important}
:root[data-tema="escuro"] .ins.hi .m i,:root[data-tema="escuro"] .ins.hi .m em{background:#fff}
:root[data-tema="escuro"] img{filter:brightness(.92)}
:root[data-tema="escuro"] ::selection{background:#34407a}
#temaSel{position:fixed;right:14px;bottom:14px;z-index:90;font:500 12px/1 Inter,"Segoe UI",system-ui,sans-serif}
#temaSel>button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line,#eceef4);background:var(--card,#fff);color:var(--muted,#6f7689);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(20,30,70,.12);padding:0}
#temaSel>button:hover{color:var(--bv,#223ad2);border-color:var(--bv-line,#d5dbf7)}
#temaSel svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#temaSel .menu{position:absolute;right:0;bottom:42px;background:var(--card,#fff);border:1px solid var(--line,#eceef4);border-radius:12px;padding:4px;box-shadow:0 12px 32px rgba(20,30,70,.18);display:none;min-width:150px}
#temaSel.aberto .menu{display:block}
#temaSel .menu button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;color:var(--ink,#161a23);cursor:pointer;text-align:left;font:inherit;font-size:12.5px}
#temaSel .menu button:hover{background:var(--bv-soft,#f2f4fd)}
#temaSel .menu button.on{color:var(--bv,#223ad2);font-weight:650}
#temaSel .menu small{display:block;color:var(--muted,#6f7689);font-size:10.5px;padding:4px 10px 6px}
@media print{#temaSel{display:none}}`;

  // ---- Cores: leitura, HSL e conversão por papel ----
  const NOMES = { white: [255, 255, 255], black: [0, 0, 0] };
  function parse(s) {
    s = s.trim().toLowerCase();

<script id="sessao">
/* sessao 1.1 · uma senha por sessão (ADR-0029, ADR-0035)
   Quem abre (hub, Central) guarda só em memória a senha que abriu o próprio arquivo. Quando a pessoa clica num link
   para outra ferramenta (target=_blank rel=opener), a janela nova pede a senha e o abridor responde uma vez, só nos
   90 segundos seguintes ao clique e só para uma janela aberta por ele (e.source.opener === window).
   1.1: o abridor também pode guardar a senha de uma ferramenta específica (definir(senha, 'central')); o link com
   data-sessao="central" leva essa senha em vez da senha da sessão. Serve para a Central com senha própria.
   A ferramenta aberta usa a senha só para abrir o próprio arquivo; se não servir, pede a senha como sempre.
   Nada vai para disco, localStorage ou para a pasta. Injetado em todos os HTMLs pelo build, junto com o tema. */
(() => {
  if (window.gestaoSessao) return;
  const SC = 'gestao-sessao/1', JANELA = 90e3;
  let senha = null, cliqueEm = 0, alvo = '', recebida = null, usada = false;
  const porAlvo = {};
  const temAlguma = () => !!senha || Object.keys(porAlvo).length > 0;
  document.addEventListener('click', e => {
    const a = e.target && e.target.closest && e.target.closest('a[target="_blank"][rel~="opener"]');
    if (a && temAlguma()) { cliqueEm = Date.now(); alvo = (a.dataset && a.dataset.sessao) || ''; }
  }, true);
  window.addEventListener('message', e => {
    const m = e.data; if (!m || m.schema !== SC) return;
    if (m.tipo === 'pedir') {

      if (!s || !cliqueEm || Date.now() - cliqueEm > JANELA) return;
      let filha = false; try { filha = !!e.source && e.source.opener === window; } catch {}

      cliqueEm = 0; alvo = '';
      try { e.source.postMessage({ schema: SC, tipo: 'senha', senha: s }, '*'); } catch {}
    } else if (m.tipo === 'senha') {
      if (!window.opener || e.source !== window.opener || recebida !== null || typeof m.senha !== 'string' || !m.senha) return;
      recebida = m.senha.slice(0, 500);
      window.dispatchEvent(new Event('gestao-sessao'));
    }
  });

    // definir(senha) troca a senha da sessão; definir(null) esquece todas; definir(senha, 'central') guarda a de uma ferramenta.
    definir(s, para) {
      if (para) { if (s) porAlvo[para] = String(s); else delete porAlvo[para]; return; }
      senha = s ? String(s) : null;
      if (!s) { cliqueEm = 0; alvo = ''; for (const k of Object.keys(porAlvo)) delete porAlvo[k]; }
    },

    // Entrega a senha recebida uma única vez (para abrir o próprio arquivo).
    usar() { if (recebida == null || usada) return null; usada = true; return recebida; },
    get usada() { return usada; }
  };
})();

/* -------------------- cópias de conflito do OneDrive / SharePoint -------------------- */
// O cliente do OneDrive não sobrescreve quando dois computadores gravam o mesmo arquivo:
// renomeia um deles ("plano-NOTEBOOK01.json", "plano-NOTEBOOK01-2.json", "plano (1).json").
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  if (!dir) return res;
  for (const a of await arquivosDoNome(dir, base)) {
    let texto = null;

    let env = null, p = null, erro = null;

    if (p && (env.team !== team || p.source?.team !== team || p.schema !== content)) { if (!a.principal) continue; erro = 'Arquivo de outro time ou de outro tipo'; p = null; }
    const item = { nome: a.nome, principal: a.principal, env, payload: p, erro };
    if (!a.principal) res.copias.push(item);
    if (p) res.validos.push(item); else res.invalidos.push(item);

  res.melhor = res.validos[0] || null;

}

  }
  const maxRev = Math.max(ultimaRevisao, ...lido.validos.map(v => v.payload.revision), ...lido.invalidos.map(v => +v.env?.revision || 0), 0);
  const payload = montar.payload({ revision: maxRev + 1, generatedAt: isoComFuso(), hlc: hlcAgora(lido.melhor?.payload.hlc) });
  payload.source = { ...(payload.source || {}), team, writer };
  const env = await cifrarEnv(payload, { key: chave.key, kid: chave.kid, team });
  const texto = JSON.stringify(env, null, 1);
  await gravarSeguro(dir, base + '.json', texto);
  const conf = await decifrarEnv(JSON.parse(await lerTexto(dir, base + '.json')), new Map([[chave.kid, chave.key]]));
  if (conf.revision !== payload.revision) throw new Error('Outro computador gravou ao mesmo tempo. Leia a pasta e publique de novo.');
  const removidas = [];
  for (const c of lido.copias) {
    const cd = c.payload?.source?.writer;
    if (cd === writer || (assumir && c.payload && c.payload.revision <= payload.revision) || (!c.payload && c.erro && !c.env?.ct)) {
      try { await dir.removeEntry(c.nome); removidas.push(c.nome); } catch {}
    }
  }
  return { revision: payload.revision, generatedAt: payload.generatedAt, removidas, conflitos: lido.copias.length, payload };
}
// Aviso de "aberto em outro computador": arquivo pequeno renovado a cada minuto.
// É só aviso (o atraso do OneDrive torna trava pouco confiável). Só ids e horário, sem dados.
async function marcarAberto(dir, writer, ferramenta) {
  if (!dir) return;
  try { await gravarSeguro(dir, `.aberto-${writer.replace('~', '-')}.json`, JSON.stringify({ writer, ferramenta, ate: Date.now() + 3 * 60000 })); } catch {}
}
async function abertosEmOutros(dir, writer) {
  const out = []; if (!dir) return out;
  try {
    for await (const [n, h] of dir.entries()) {
      if (h.kind !== 'file' || !/^\.aberto-.*\.json$/.test(n)) continue;
      try { const o = JSON.parse(await (await h.getFile()).text()); if (o.writer !== writer && o.ate > Date.now()) out.push(o); } catch {}
    }
  } catch {}
  return out;
}

async function lerEmbutido(id) {
  const el = document.getElementById(id); if (!el) throw new Error('HTML embutido não encontrado: ' + id);
  const bytes = b64.dec(el.textContent.trim());
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(s).text();
}
// Troca o bloco entre /*<MARCA>*/ e /*FIM-<MARCA>*/ por um JSON (escapado para <script>).
function aplicarPreset(html, marca, obj) {
  const ini = `/*${marca}*/`, fim = `/*FIM-${marca}*/`, i = html.indexOf(ini), j = html.indexOf(fim);
  if (i < 0 || j < i) throw new Error('O HTML não tem o marcador de pré-configuração ' + marca);
  const json = JSON.stringify(obj).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
  return html.slice(0, i + ini.length) + json + html.slice(j);
}
function baixar(nome, texto, tipo = 'application/json') {

// Card de leitura: rótulo, número, medidor (pct de 0 a 1+, marca opcional) e uma frase que interpreta.
function cardLeitura({ k, v, pct = null, marca = null, s = '', tag = '', hi = false }) {
  const p = pct == null ? '' : `<div class="m ${pct > 1 ? 'over' : ''}"><i style="width:${Math.max(0, Math.min(1, pct)) * 100}%"></i>${marca != null ? `<em style="left:${Math.max(0, Math.min(1, marca)) * 100}%"></em>` : ''}</div>`;
  return `<div class="ins ${hi ? 'hi' : ''}"><div class="k">${k}${tag}</div><div class="v">${v}</div>${p}${s ? `<div class="s">${s}</div>` : ''}</div>`;
}
// Barras horizontais: [{ nome, valor, ref (marca preta), cap (marca de teto), rotulo, attrs }]
function barrasH(itens, fmt) {
  if (!itens.length) return '<div class="empty">Nada para mostrar ainda.</div>';
  const max = Math.max(1, ...itens.map(x => Math.max(x.valor || 0, x.ref || 0, x.cap || 0)));
  const pc = v => (v / max * 100).toFixed(2) + '%';
  return `<div class="hb">${itens.map(x => `<div class="n" title="${esc(x.titulo || '')}">${x.nome}</div><div class="tr" title="${esc(x.titulo || '')}"><i style="width:${pc(x.valor || 0)}${x.cor ? ';background:' + x.cor : ''}"></i>${x.ref ? `<em style="left:${pc(x.ref)}"></em>` : ''}${x.cap ? `<em class="cap" style="left:${pc(x.cap)}"></em>` : ''}</div><div class="val">${x.rotulo ?? fmt(x.valor || 0)}</div>`).join('')}</div>`;
}
// Curva acumulada do ano: séries [{ nome, cor, v: [por mês], ate (índice do último mês com dado), tracejada, area }]
function curvaAcumulada(ms, series, fmt, hojeIdx = -1) {
  const acc = series.map(s => { let a = 0; return { ...s, c: s.v.map((x, i) => (s.ate != null && i > s.ate) ? null : (a += x || 0)) }; });
  const max = Math.max(1, ...acc.flatMap(s => s.c.filter(x => x != null)));
  const W = 760, H = 230, pl = 10, pr = 96, pt = 12, pb = 26, X = i => pl + i * (W - pl - pr) / Math.max(1, ms.length - 1), Y = v => H - pb - (v / max) * (H - pt - pb);
  let svg = [0.25, 0.5, 0.75, 1].map(f => `<line x1="${pl}" x2="${W - pr}" y1="${Y(max * f)}" y2="${Y(max * f)}" stroke="var(--line)"/>`).join('');
  if (hojeIdx >= 0 && hojeIdx < ms.length) svg += `<line x1="${X(hojeIdx)}" x2="${X(hojeIdx)}" y1="${pt}" y2="${H - pb}" stroke="var(--bv-line)" stroke-dasharray="3 3"/><text x="${X(hojeIdx)}" y="${pt + 8}" text-anchor="middle" font-size="10" fill="var(--faint)">hoje</text>`;
  const ocupados = [];
  for (const s of acc) {
    const pts = s.c.map((v, i) => v == null ? null : [X(i), Y(v)]).filter(Boolean); if (!pts.length) continue;
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    if (s.area) svg += `<path d="${d} L${pts.at(-1)[0].toFixed(1)} ${H - pb} L${pts[0][0].toFixed(1)} ${H - pb} Z" fill="${s.cor}" opacity=".08"/>`;
    svg += `<path d="${d}" fill="none" stroke="${s.cor}" stroke-width="${s.fina ? 1.5 : 2.4}" ${s.tracejada ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
    const u = pts.at(-1), ult = s.c.filter(x => x != null).at(-1); let ty = u[1] + 4; while (ocupados.some(o => Math.abs(o - ty) < 13)) ty += 13; ocupados.push(ty);
    svg += `<circle cx="${u[0]}" cy="${u[1]}" r="3.2" fill="${s.cor}"/><text x="${u[0] + 8}" y="${ty}" font-size="11" fill="${s.cor}" font-weight="600">${esc(fmt(ult))}</text>`;
  }
  svg += ms.map((m, i) => `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${nomeMes(m)}</text>`).join('');
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva acumulada do ano">${svg}</svg><div class="legend">${series.map(s => `<span><i style="background:${s.cor};${s.tracejada ? 'height:2px' : ''}"></i>${esc(s.nome)}</span>`).join('')}</div>`;
}
const pctTxt = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';

   ===================================================================== */
const TOOL = 'ferias', TOOL_NOME = 'Mapa de Férias', TOOL_VERSION = '1.3.0';

/* ------------------------------- datas ------------------------------- */
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const dataDe = iso => new Date(iso + 'T12:00:00');
const addDias = (iso, n) => { const d = dataDe(iso); d.setDate(d.getDate() + n); return ymd(d); };
const diaSem = iso => dataDe(iso).getDay();
const fmtDia = iso => `${DIAS_SEM[diaSem(iso)]} ${iso.slice(8)}/${iso.slice(5, 7)}`;
const fmtCurta = iso => `${iso.slice(8)}/${iso.slice(5, 7)}`;
const mesAno = m => { const t = new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); return t[0].toUpperCase() + t.slice(1); };
const fimDoMes = m => ymd(new Date(+m.slice(0, 4), +m.slice(5, 7), 0));
function dias(ini, fim) { const out = []; for (let d = ini; d <= fim; d = addDias(d, 1)) out.push(d); return out; }
const feriado = iso => db.feriados.find(f => f.data === iso);

function intervalo() {

  if (periodo === 'ano') return { ini: `${a}-01-01`, fim: `${a}-12-31`, nome: String(a) };
  if (periodo === 'prox-ano') return { ini: `${a + 1}-01-01`, fim: `${a + 1}-12-31`, nome: String(a + 1) };
  return { ini: h, fim: fimDoMes(somaMeses(h.slice(0, 7), 2)), nome: 'próximos 3 meses' };
}
// Interpreta "dd/mm", "dd/mm/aa" e "dd/mm/aaaa"; sem ano, usa o próximo dd/mm a partir de hoje.
function lerData(txt, ref = hojeISO()) {
  const m = /^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/.exec(String(txt).trim()); if (!m) return null;
  let a = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : +ref.slice(0, 4);
  let iso = `${a}-${pad2(m[2])}-${pad2(m[1])}`;
  if (!m[3] && iso < ref && addDias(iso, 60) < ref) iso = `${a + 1}-${pad2(m[2])}-${pad2(m[1])}`;
  return dataDe(iso).getDate() === +m[1] ? iso : null;
}

async function importarTextos(lista) {
  for (const c of lista) { if (chavesMem.has(c.kid)) continue; try { const k = lerChaveTexto(c.texto); chavesMem.set(k.kid, await importarChave(k.raw)); } catch {} }
}
async function carregarChaves() { await importarTextos(db.chaves); for (const u of db.unidades) await importarTextos(u.chaves); }
const mapaDe = lista => new Map(lista.filter(c => chavesMem.has(c.kid)).map(c => [c.kid, chavesMem.get(c.kid)]));
const chaveMinha = () => { const c = db.chaves.filter(x => !x.revogada).at(-1); return c && chavesMem.has(c.kid) ? { kid: c.kid, key: chavesMem.get(c.kid) } : null; };
// A chave de um nível começa pelo identificador dele: GK1.<slug>.… ou GK1.<slug>-fin-AAMM.… (a mesma das Finanças do Grupo).
const chaveDoSlug = (kid, slug) => kid === slug || kid.startsWith(slug + '-');
async function cadastrarChave(lista, texto, slug, origem = 'colada') {
  const k = lerChaveTexto(texto);
  if (!chaveDoSlug(k.kid, slug)) throw new Error(`A chave "${k.kid}" não é de "${slug}". Peça a chave gerada para o identificador ${slug}.`);
  // A última chave colada passa a valer para publicar; as anteriores continuam servindo para ler arquivos antigos.
  const i = lista.findIndex(c => c.kid === k.kid); if (i >= 0) lista.splice(i, 1);
  lista.push({ kid: k.kid, texto: texto.trim(), em: new Date().toISOString(), origem });
  await carregarChaves(); agendarSalvar();
  return k.kid;
}

/* ---------------------- visão unificada (eu + pares + unidades) ---------------------- */
// Cada pessoa vira { key, nome, un (unidade no meu nível; '' = eu e meus diretos), sub (unidade de origem), editavel, id }.
function visao() {
  const pessoas = new Map(), aus = [], un0 = db.unidade.slug;
  const addP = (key, p) => { if (!pessoas.has(key)) pessoas.set(key, p); return key; };
  const addA = (key, a) => { const sig = `${key}|${a.inicio}|${a.fim}`; if (!aus.some(x => x.sig === sig)) aus.push({ ...a, key, sig }); };
  for (const p of db.pessoas.filter(p => p.ativo)) addP(`${un0}/${slugify(p.nome)}`, { key: `${un0}/${slugify(p.nome)}`, nome: p.nome, un: '', sub: db.unidade.nome, editavel: true, id: p.id });
  for (const a of db.ausencias) { const p = pessoaPorId(a.pessoa); if (p?.ativo) addA(`${un0}/${slugify(p.nome)}`, { inicio: a.inicio, fim: a.fim, tipo: a.tipo, id: a.id, editavel: true }); }
  // Time: os outros membros publicam o próprio arquivo na mesma pasta; somam aqui.
  const pares = db.retratos['.'];
  if (pares && !ehGrupo()) for (const p of pares.pessoas) { const k = `${un0}/${p.id}`; addP(k, { key: k, nome: p.name, un: '', sub: db.unidade.nome, editavel: false }); }
  if (pares && !ehGrupo()) for (const a of pares.ausencias) addA(`${un0}/${a.person}`, { inicio: a.start, fim: a.end, tipo: a.kind, editavel: false });
  if (ehGrupo()) for (const u of db.unidades) {
    const r = db.retratos[u.slug]; if (!r) continue;
    const nomesUn = new Map((r.units || []).map(x => [x.slug, x.name]));
    for (const p of r.pessoas) { const k = `${u.slug}:${p.id}`; addP(k, { key: k, nome: p.name, un: u.slug, sub: nomesUn.get(p.unit) || u.nome, editavel: false }); }
    for (const a of r.ausencias) addA(`${u.slug}:${a.person}`, { inicio: a.start, fim: a.end, tipo: a.kind, editavel: false });
  }
  return { pessoas: [...pessoas.values()], ausencias: aus.filter(a => pessoas.has(a.key)) };
}
const nomeUn = s => s ? (unPorSlug(s)?.nome || s) : (ehGrupo() ? `${db.unidade.nome} · você e diretos` : db.unidade.nome);
function filtrada(v = visao()) {
  if (!filtroUn) return v;
  const un = filtroUn === '.' ? '' : filtroUn;
  const ps = v.pessoas.filter(p => p.un === un), ks = new Set(ps.map(p => p.key));
  return { pessoas: ps, ausencias: v.ausencias.filter(a => ks.has(a.key)) };
}
// Mapa dia → chaves das pessoas fora (só dias do intervalo).
function mapaDias(v, ini, fim) {
  const m = new Map(dias(ini, fim).map(d => [d, new Set()]));
  for (const a of v.ausencias) {
    const i = a.inicio > ini ? a.inicio : ini, f = a.fim < fim ? a.fim : fim;
    for (let d = i; d <= f; d = addDias(d, 1)) m.get(d)?.add(a.key);
  }
  return m;
}
const limiteFr = () => (db.config.limite || 30) / 100;
function estatisticas(v, ini, fim) {
  const m = mapaDias(v, ini, fim), n = v.pessoas.length || 1, uteis = [...m.keys()].filter(util);
  const serie = uteis.map(d => ({ d, n: m.get(d).size, pct: m.get(d).size / n }));
  const pico = serie.reduce((a, b) => b.n > (a?.n ?? -1) ? b : a, null);
  const acima = serie.filter(x => x.pct > limiteFr() && x.n > 0);
  const vazios = serie.filter(x => x.n === 0);
  const pessoaDias = serie.reduce((s, x) => s + x.n, 0);
  return { m, serie, pico, acima, vazios, pessoaDias, total: v.pessoas.length, uteis: uteis.length };
}
// Semanas (segunda a domingo) com média de pessoas fora por dia útil.
function semanas(serie) {
  const g = new Map();
  for (const x of serie) { const d = dataDe(x.d), seg = ymd(new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7))); const w = g.get(seg) || { seg, soma: 0, dias: 0, max: 0 }; w.soma += x.n; w.dias++; w.max = Math.max(w.max, x.n); g.set(seg, w); }
  return [...g.values()].map(w => ({ ...w, media: w.soma / w.dias }));
}

function montarPayload(meta) {

  const anon = new Map(), nome = (id, n) => db.config.nomesAcima || !ehGrupo() ? clamp(n, 80) : (anon.get(id) || (anon.set(id, `Pessoa ${anon.size + 1}`), anon.get(id)));
  for (const p of db.pessoas.filter(p => p.ativo)) people.push({ id: slugify(p.nome) || p.id, name: nome(p.id, p.nome), unit: un0 });
  for (const a of db.ausencias) { const p = pessoaPorId(a.pessoa); if (p?.ativo) absences.push({ person: slugify(p.nome) || p.id, start: a.inicio, end: a.fim, kind: a.tipo }); }
  if (ehGrupo()) for (const u of db.unidades) {
    const r = db.retratos[u.slug]; if (!r) continue;
    units.push({ slug: u.slug, name: u.nome, kind: u.tipo, parent: un0 });
    for (const x of r.units || []) if (x.slug !== u.slug) units.push({ slug: x.slug, name: x.name, kind: x.kind, parent: x.parent === r.slugRaiz ? u.slug : x.parent });
    for (const p of r.pessoas) people.push({ id: `${u.slug}.${p.id}`, name: nome(`${u.slug}.${p.id}`, p.name), unit: p.unit || u.slug });
    for (const a of r.ausencias) absences.push({ person: `${u.slug}.${a.person}`, start: a.start, end: a.end, kind: a.kind });
  }
  absences.sort((a, b) => a.start.localeCompare(b.start) || a.person.localeCompare(b.person));
  return { schema: FERIAS_SCHEMA, ...meta, source: { team: un0, tool: TOOL, toolVersion: TOOL_VERSION, level: ehGrupo() ? 'group' : 'team' },
    unit: { name: db.unidade.nome, slug: un0, kind: db.nivel }, units, people, absences,
    holidays: db.feriados.map(f => ({ date: f.data, name: clamp(f.nome, 60) })),
    contributors: ehGrupo() ? db.unidades.filter(u => db.retratos[u.slug]).map(u => ({ slug: u.slug, name: u.nome, kind: u.tipo, files: db.retratos[u.slug].writers.length, lastGeneratedAt: db.retratos[u.slug].writers.map(w => w.generatedAt).sort().at(-1) })) : undefined };
}

async function ligarPasta(h, silencioso = false) {
  if (!await permissao(h, !silencioso)) { if (!silencioso) toast('Sem permissão na pasta.'); return false; }
  const v = HOST ? { tem: true } : await validarPastaComum(h);
  if (!v.tem && !v.nomeOk && !silencioso) {
    const r = await perguntar('Esta é a pasta compartilhada?', `<p>A pasta <b class="code">${esc(h.name)}</b> ainda não tem a estrutura da solução (<span class="code">times/</span>, <span class="code">grupo/</span>).</p>
      <p class="muted small">Escolha a pasta raiz sincronizada pelo OneDrive (normalmente <span class="code">${PASTA_COMUM}</span>). Se for esta mesma, a ferramenta cria só <span class="code">${esc(pastaPropria().join('/'))}/</span> quando publicar.</p>`, [['no', 'Escolher outra'], ['ok', 'É esta', 'pri']]);
    if (r !== 'ok') return false;
  }

}

// Lê todos os arquivos de uma pasta de férias (um por pessoa e computador), decifra com as chaves dadas e
// fica com o mais novo de cada pessoa (o mesmo gestor em dois computadores não soma duas vezes).
async function lerPastaFerias(dir, team, chaves, ignorarWriter = '') {
  const res = { writers: [], pessoas: [], ausencias: [], units: [], erros: [], slugRaiz: team };
  if (!dir) return res;
  const porPessoa = new Map();
  for await (const [n, h] of dir.entries()) {
    if (h.kind !== 'file' || !n.endsWith('.json') || n.startsWith('.')) continue;
    let p = null;
    try { const env = JSON.parse(await (await h.getFile()).text()); p = await decifrarEnv(env, chaves); if (env.team !== team || p.source?.team !== team || p.schema !== FERIAS_SCHEMA) throw new Error('arquivo de outra unidade'); }
    catch (e) { res.erros.push(`${n}: ${e.message}`); continue; }
    const w = p.source.writer || n, pessoa = w.split('~')[0];
    if (w === ignorarWriter) continue;
    const at = porPessoa.get(pessoa);
    if (!at || hlcCmp(p.hlc, at.hlc) > 0 || (p.hlc === at.hlc && p.revision > at.revision)) porPessoa.set(pessoa, p);
  }
  for (const p of porPessoa.values()) {
    res.writers.push({ writer: p.source.writer, revision: p.revision, generatedAt: p.generatedAt, level: p.source.level || 'team' });
    for (const x of p.people || []) if (!res.pessoas.some(y => y.id === x.id)) res.pessoas.push({ id: clamp(x.id, 160), name: clamp(x.name, 80), unit: clamp(x.unit || team, 60) });
    for (const a of p.absences || []) if (/^\d{4}-\d{2}-\d{2}$/.test(a.start) && /^\d{4}-\d{2}-\d{2}$/.test(a.end) && a.start <= a.end) res.ausencias.push({ person: clamp(a.person, 160), start: a.start, end: a.end, kind: TIPOS[a.kind] ? a.kind : 'outro' });
    for (const u of p.units || []) if (!res.units.some(y => y.slug === u.slug)) res.units.push({ slug: clamp(u.slug, 60), name: clamp(u.name, 80), kind: u.kind === 'grupo' ? 'grupo' : 'time', parent: u.parent || null });
  }
  return res;
}
async function lerPasta(silencioso = false) {
  if (!raiz || !db) return;
  situacao.erro = '';
  try {
    if (!ehGrupo()) {
      const ch = chaveMinha();
      if (ch) {
        const dir = await subpasta(raiz, pastaPropria(), false);
        const r = await lerPastaFerias(dir, db.unidade.slug, mapaDe(db.chaves), writer());
        db.retratos['.'] = { ...r, lidoEm: new Date().toISOString() };
        situacao.outros = await abertosEmOutros(dir, writer());
      }
    } else {
      for (const u of db.unidades) {
        const ch = mapaDe(u.chaves); if (!ch.size) { u.status = 'sem chave'; continue; }
        const dir = await subpasta(raiz, pastaUnidade(u), false);
        if (!dir) { u.status = 'ainda não publicou'; continue; }
        const r = await lerPastaFerias(dir, u.slug, ch);
        u.status = r.writers.length ? '' : r.erros.length ? `${r.erros.length} arquivo(s) não abriram com a chave cadastrada` : 'ainda não publicou';
        if (r.writers.length) db.retratos[u.slug] = { ...r, lidoEm: new Date().toISOString() };
      }
      const dir = await subpasta(raiz, pastaPropria(), false);
      situacao.outros = await abertosEmOutros(dir, writer());
    }
    situacao.lidoEm = new Date().toISOString(); sujo = true; clearTimeout(salvarT); salvarT = setTimeout(salvar, 1000);
    if (!silencioso) toast('Pasta lida.');
  } catch (e) { situacao.erro = e.message; }
  render();
}

  if (!raiz) { if (!auto) toast('Ligue a pasta sincronizada primeiro (Ajustes).', 5000); return; }
  try {
    const dir = await subpasta(raiz, pastaPropria(), true), sig = assinatura();
    const r = await publicarUnico({ dir, base: baseArquivo(), chave: ch, team: db.unidade.slug, writer: writer(), assumir, ultimaRevisao: db.publicacao.revision || 0,
      montar: { schema: FERIAS_SCHEMA, payload: meta => montarPayload(meta) } });
    db.publicacao = { revision: r.revision, em: r.generatedAt, assinatura: sig };
    sujo = true; clearTimeout(salvarT); salvarT = setTimeout(salvar, 600); render();
    if (!auto) toast(`${ehGrupo() ? 'Consolidado publicado para a liderança' : 'Férias publicadas para o time e o gestor'} (revisão ${r.revision}).`, 4500);
  } catch (e) {
    if ((e.code === 'DONO' || e.code === 'DISPOSITIVO') && !auto && await perguntar('Assumir a publicação?', `<p>${esc(e.message)}</p><p class="small muted">Cada arquivo comum tem um único dono.</p>`, [['no', 'Cancelar'], ['ok', 'Assumir e publicar', 'pri']]) === 'ok') return publicar(true);
    if (e.code !== 'DONO' && e.code !== 'DISPOSITIVO') toast('Não foi possível publicar: ' + e.message, 6000);
  }
}

}

function interpretar(txt) {

  const ds = [...s.matchAll(/\s(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)(?=\s)/g)].map(m => lerData(m[1])).filter(Boolean);
  if (ds[0]) { o.inicio = ds[0]; o.fim = ds[1] && ds[1] >= ds[0] ? ds[1] : ds[0]; if (ds[1] && ds[1] < ds[0]) o.fim = lerData(ds[1].slice(8) + '/' + ds[1].slice(5, 7) + '/' + (+ds[0].slice(0, 4) + 1)); }
  s = s.replace(/\s\d{1,2}\/\d{1,2}(?:\/\d{2,4})?(?=\s)/g, ' ').replace(/\s(a|até|ate|-)(?=\s)/gi, ' ');
  for (const [k, re] of [['folga', /\s(folga|day ?off|abono)(?=\s)/i], ['treinamento', /\s(treinamento|curso|evento|confer[êe]ncia)(?=\s)/i], ['outro', /\s(outra|outro|aus[êe]ncia|licen[çc]a)(?=\s)/i], ['ferias', /\s(f[ée]rias)(?=\s)/i]]) if (re.test(s)) { o.tipo = k; s = s.replace(re, ' '); break; }
  const nome = slugify(s.trim());
  if (nome) { const p = db.pessoas.filter(p => p.ativo).find(p => slugify(p.nome).startsWith(nome)) || db.pessoas.filter(p => p.ativo).find(p => slugify(p.nome).split('-').some(x => x.startsWith(nome.split('-')[0]))); if (p) o.pessoa = p.id; else o.novoNome = s.trim(); }
  return o;
}

// Impacto de uma ausência no grupo: quantas outras pessoas fora em cada dia útil do período.
function impacto(ini, fim, chaveIgnorar) {
  const v = visao(), m = mapaDias(v, ini, fim), total = v.pessoas.length || 1, uteis = dias(ini, fim).filter(util);
  let max = 0, diaMax = null, acima = 0;
  for (const d of uteis) { const n = [...m.get(d)].filter(k => k !== chaveIgnorar).length; if (n > max) { max = n; diaMax = d; } if ((n + 1) / total > limiteFr()) acima++; }
  return { max, diaMax, acima, uteis: uteis.length, total: v.pessoas.length };
}
// Sugere os períodos com menos gente fora nos próximos 6 meses, com o mesmo número de dias úteis.
function sugerir(nUteis, chaveIgnorar) {
  const h = hojeISO(), fim = addDias(h, 200), v = visao(), m = mapaDias(v, h, fim), total = v.pessoas.length || 1;
  const uteis = dias(addDias(h, 7), addDias(h, 180)).filter(util), out = [];
  for (let i = 0; i + nUteis <= uteis.length; i++) {
    if (i && diaSem(uteis[i]) !== 1 && nUteis >= 5) continue;   // períodos de uma semana ou mais começam na segunda
    const jan = uteis.slice(i, i + nUteis), ns = jan.map(d => [...(m.get(d) || [])].filter(k => k !== chaveIgnorar).length);
    out.push({ ini: jan[0], fim: jan.at(-1), max: Math.max(...ns), soma: ns.reduce((a, b) => a + b, 0) });
  }
  out.sort((a, b) => a.max - b.max || a.soma - b.soma || a.ini.localeCompare(b.ini));
  const esc2 = []; for (const x of out) { if (esc2.some(y => !(x.fim < y.ini || x.ini > y.fim))) continue; esc2.push(x); if (esc2.length === 3) break; }
  return esc2.map(x => ({ ...x, pct: x.max / total }));
}

// Lê o arquivo local cifrado do Hub ou das Finanças do Grupo, com a senha dele, e traz unidades e chaves.
// Só lê: o arquivo da outra ferramenta não é alterado (ADR 0010).
async function importarLocal(tool) {
  let fh; try { [fh] = await window.showOpenFilePicker({ id: 'ferias-imp-' + tool, types: [{ description: 'Arquivo cifrado da solução', accept: { 'application/json': ['.json'] } }] }); } catch { return; }
  const texto = await (await fh.getFile()).text();
  try { lerCabecalhoLocal(texto); } catch (e) { return toast(e.message); }
  let obj = null;
  for (let i = 0; i < 3 && !obj; i++) {
    const s = await pedirSenhaDlg(tool === 'hub' ? 'Senha do Hub' : 'Senha das Finanças do Grupo', i > 0); if (s == null) return;
    try { obj = (await decifrarLocal(texto, s)).dados; } catch (e) { if (e.code !== 'SENHA') return toast(e.message); }
  }
  if (!obj) return toast('Senha incorreta.');
  if (obj.tool !== tool || !Array.isArray(obj.times)) return toast(tool === 'hub' ? 'Este arquivo não é do Hub.' : 'Este arquivo não é das Finanças do Grupo.');
  let nu = 0, nk = 0, acima = 0;
  const lista = tool === 'hub' ? obj.times.map(t => ({ nome: t.nome, slug: t.slug, tipo: 'time', chaves: t.chaves || [] })) : obj.times.filter(t => t.tipo === 'grupo').map(t => ({ nome: t.nome, slug: t.slug, tipo: 'grupo', chaves: t.chaves || [] }));
  for (const x of lista) {
    if (!x.slug || x.slug === db.unidade.slug) continue;
    let u = unPorSlug(x.slug); if (!u) { u = { nome: clamp(x.nome, 80), slug: x.slug, tipo: x.tipo, chaves: [] }; db.unidades.push(u); nu++; }
    for (const c of x.chaves.filter(c => !c.revogada)) { try { const k = lerChaveTexto(c.texto); if (chaveDoSlug(k.kid, u.slug) && !u.chaves.some(y => y.kid === k.kid)) { u.chaves.push({ kid: k.kid, texto: c.texto, em: new Date().toISOString(), origem: tool }); nk++; } } catch {} }
  }
  if (tool === 'financas-grupo' && obj.grupo?.slug === db.unidade.slug) for (const c of (obj.acima?.chaves || []).filter(c => !c.revogada)) { try { const k = lerChaveTexto(c.texto); if (chaveDoSlug(k.kid, db.unidade.slug) && !db.chaves.some(y => y.kid === k.kid)) { db.chaves.push({ kid: k.kid, texto: c.texto, em: new Date().toISOString(), origem: tool }); acima++; } } catch {} }
  obj = null;
  await carregarChaves(); agendarSalvar(); await lerPasta(true);
  await perguntar('Importado', `<p>${nu} unidade(s) nova(s) e ${nk} chave(s) trazidas${acima ? ', além da chave da sua liderança' : ''}.</p><div class="cofre">As chaves agora também ficam dentro do arquivo ${HOST ? 'da Central' : 'do Mapa de Férias'}, cifrado com a <b>sua senha</b>. Ela deve estar no cofre de senhas.</div>`);
}

/* ------------------- dentro da Central de Gestão (ADR-0033) ------------------- */
// Os times da Central (com pasta) viram unidades, com as chaves de tarefas da Integração. As chaves antigas ficam,
// para ler arquivos publicados antes de uma troca de chave. Time que saiu da Central sai do mapa.
function sincronizarUnidades() {
  if (!HOST || !db) return false;
  const antes = JSON.stringify(db.unidades), ts = (HOST.unidades() || []).filter(t => t?.slug && t.slug !== db.unidade.slug);
  for (const t of ts) {
    let u = unPorSlug(t.slug);
    if (!u) { u = { nome: clamp(t.nome || t.slug, 80), slug: t.slug, tipo: 'time', chaves: [] }; db.unidades.push(u); }
    u.origem = 'central'; u.tipo = 'time'; u.nome = clamp(t.nome || u.nome, 80);
    const novas = [];
    for (const c of t.chaves || []) { try { const k = lerChaveTexto(c.texto); if (chaveDoSlug(k.kid, u.slug)) novas.push({ kid: k.kid, texto: c.texto, em: c.em || '', origem: 'central' }); } catch {} }
    u.chaves = [...u.chaves.filter(c => !novas.some(n => n.kid === c.kid)), ...novas];
  }
  const fora = db.unidades.filter(u => u.origem === 'central' && !ts.some(t => t.slug === u.slug));
  for (const u of fora) delete db.retratos[u.slug];
  db.unidades = db.unidades.filter(u => !fora.includes(u));
  return JSON.stringify(db.unidades) !== antes;
}
async function aposAbrirEmbutido() {
  if (sincronizarUnidades()) { sujo = true; salvar(); }
  arquivo = HOST.nomeArquivo?.() || 'arquivo da Central';

  await carregarChaves();
  const h = await HOST.pasta(false).catch(() => null);
  if (h && h !== raiz) await ligarPasta(h, true); else if (raiz) await lerPasta(true); else render();
};
function telaEmbutida(msg = '') {
  const g = HOST.grupo?.() || {}, eu = HOST.pessoa?.() || '';
  $('#app').innerHTML = `<div class="welcome"><div class="card">
    <h2 style="margin:0">Férias e ausências do grupo</h2>
    <div class="small muted">Os dias com mais e menos gente fora em todos os seus times, as suas férias e as dos seus diretos. Fica dentro da Central: mesmo arquivo, mesma senha.</div>
    ${msg ? `<div class="banner warn" style="margin-top:12px">${esc(msg)}</div>` : ''}
    <div class="f2" style="margin-top:16px"><label class="field"><span>Nome do grupo (ex.: Tecnologia)</span><input class="sin" id="eN" value="${esc(g.nome || '')}"></label>
    <label class="field"><span>Identificador (pasta)</span><input class="sin code" id="eS" value="${esc(g.slug || '')}"></label></div>
    <label class="field"><span>Seu nome</span><input class="sin" id="eP" value="${esc(eu)}"></label>
    <p class="small muted">Use o mesmo identificador do grupo nas Finanças do Grupo: a liderança encontra o seu consolidado por ele. Os times da Central entram sozinhos, com as chaves da Integração.</p>
    <div class="row"><button class="btn pri" id="eOk">Começar</button><span class="grow"></span><button class="btn" id="eAntigo">Trazer do Mapa de Férias separado</button></div>
    <p class="small muted" style="margin-top:14px">Apoio para a visão do grupo: não substitui a ferramenta oficial de férias da empresa.</p>
  </div></div>`;
  $('#eN').oninput = () => { $('#eS').value = slugify($('#eN').value); };
  $('#eOk').onclick = async () => {
    const nome = $('#eN').value.trim(), slug = slugify($('#eS').value), pessoa = $('#eP').value.trim();
    if (!nome || !slug || !pessoa) return toast('Preencha o nome do grupo, o identificador e o seu nome.');
    db = novoDb({ nivel: 'grupo', nome, slug, pessoa }); view = 'unidades';
    sincronizarUnidades(); sujo = true; await salvar(); await aposAbrirEmbutido();
    toast('Pronto. Os times da Central já estão no mapa; marque as suas férias e as dos diretos.', 5000);
  };
  $('#eAntigo').onclick = trazerArquivoAntigo;
}
// Migração: o arquivo do Mapa de Férias separado (ferias-<grupo>.json) é lido com a senha dele e vem para a Central.
async function trazerArquivoAntigo() {
  if (!window.showOpenFilePicker) return toast('Use Edge ou Chrome.');
  let fh; try { [fh] = await window.showOpenFilePicker({ id: 'ferias-antigo', types: [{ description: 'Mapa de Férias (ferias-<grupo>.json)', accept: { 'application/json': ['.json'] } }] }); } catch { return; }
  const texto = await (await fh.getFile()).text();
  try { const cab = lerCabecalhoLocal(texto); if (cab.app && cab.app !== TOOL) throw new Error('Este arquivo não é do Mapa de Férias.'); } catch (e) { return toast(e.message, 5000); }
  let dados = null;
  for (let i = 0; i < 3 && !dados; i++) {
    const s = await pedirSenhaDlg('Senha do Mapa de Férias separado', i > 0); if (s == null) return;
    try { dados = normalizar((await decifrarLocal(texto, s)).dados); } catch (e) { if (e.code !== 'SENHA') return toast(e.message, 6000); }
  }
  if (!dados) return toast('Senha incorreta.');
  if (dados.nivel !== 'grupo') return toast('Este arquivo é do papel "time". Na Central entram as férias do gestor ou da liderança.', 6000);
  if (db && (db.ausencias.length || db.pessoas.length > 1) && await perguntar('Substituir as férias da Central?', `<p>A Central já tem ${db.pessoas.length} pessoa(s) e ${db.ausencias.length} ausência(s). Trocar pelo conteúdo de <span class="code">${esc(fh.name)}</span>?</p>`, [['no', 'Cancelar'], ['ok', 'Substituir', 'danger']]) !== 'ok') return;
  delete dados.pastaComum;
  db = dados; sincronizarUnidades(); sujo = true; await salvar(); raiz = null;
  await aposAbrirEmbutido();
  toast(`Trazido de ${fh.name}: ${db.pessoas.length} pessoa(s), ${db.ausencias.length} ausência(s), ${db.unidades.length} unidade(s). O arquivo antigo não foi alterado.`, 7000);
}
async function iniciarEmbutido() {
  let d = null; try { d = HOST.carregar(); } catch {}
  if (!d) return telaEmbutida();
  try { db = normalizar(d); } catch (e) { return telaEmbutida(e.message); }
  await aposAbrirEmbutido();
}
if (HOST) iniciarEmbutido();
else (async () => { if (!await abrirLembradoSePuder(LEMBRAR, abrirArquivo) || (!db && !$('#app').children.length)) telaInicial(); })();
</script>
</body>
</html>
